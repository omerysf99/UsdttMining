<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Mining App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: white;
            user-select: none;
            overflow: hidden;
        }

        /* Fan Dönme Animasyonu */
        @keyframes rotate-fan {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .fan-animation {
            animation: rotate-fan 4s linear infinite;
        }

        .fan-animation.boosted {
            animation-duration: 1s;
        }

        /* Cam Efekti Kartlar */
        .glass-card {
            background: #151515;
            border: 1px solid #222;
        }

        /* Alt Navigasyon */
        .nav-active {
            color: #8b5cf6;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 12px;
        }

        /* Buton Efektleri */
        .btn-active:active {
            transform: scale(0.95);
        }

        /* Sayıların yumuşak değişimi */
        .counter-text {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto relative border-x border-gray-900 shadow-2xl">

    <!-- Üst Bölüm: Bakiyeler -->
    <header class="p-4 space-y-3">
        <!-- TON Bakiye Kartı -->
        <div class="glass-card rounded-2xl p-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full overflow-hidden bg-blue-500 flex items-center justify-center">
                    <img src="ton.jpg" alt="TON" class="w-full h-full object-cover" onerror="this.src='https://cryptologos.cc/logos/toncoin-ton-logo.png'">
                </div>
                <div>
                    <p class="text-xs text-gray-400">Balance</p>
                    <p class="font-bold text-sm tracking-wide" id="total-ton">7.6823 TON</p>
                </div>
            </div>
            <button class="bg-indigo-500/20 p-2 rounded-xl text-indigo-400 btn-active">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Zm0,128H56a8,8,0,0,1-8-8V85.33A23.86,23.86,0,0,0,56,88H216Zm-32-56a12,12,0,1,1,12,12A12,12,0,0,1,184,144Z"></path></svg>
            </button>
        </div>

        <!-- TONIX Bakiye Kartı -->
        <div class="glass-card rounded-2xl p-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full overflow-hidden bg-blue-700 flex items-center justify-center">
                    <img src="dragon.jpg" alt="TONIX" class="w-full h-full object-cover" onerror="this.src='https://cdn-icons-png.flaticon.com/512/10668/10668045.png'">
                </div>
                <div>
                    <p class="text-xs text-gray-400">Balance</p>
                    <p class="font-bold text-sm tracking-wide">500 TONIX</p>
                </div>
            </div>
            <button class="bg-indigo-500/20 p-2 rounded-xl text-indigo-400 btn-active">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Zm0,128H56a8,8,0,0,1-8-8V85.33A23.86,23.86,0,0,0,56,88H216Zm-32-56a12,12,0,1,1,12,12A12,12,0,0,1,184,144Z"></path></svg>
            </button>
        </div>
    </header>

    <!-- Ana Bölüm: Madencilik Alanı -->
    <main id="view-home" class="flex-1 flex flex-col items-center justify-center px-6 transition-all duration-300">
        <!-- Büyük Fan Görseli -->
        <div class="relative w-64 h-64 mb-8">
            <div class="absolute inset-0 bg-blue-500/10 blur-[60px] rounded-full"></div>
            <div id="main-fan" class="fan-animation relative z-10 w-full h-full">
                <img src="fan.jpg" alt="Fan" class="w-full h-full object-contain drop-shadow-[0_0_15px_rgba(59,130,246,0.5)]" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3593/3593672.png'">
            </div>
            <!-- Ortadaki Sabit Logo -->
            <div class="absolute inset-0 flex items-center justify-center z-20 pointer-events-none">
                <div class="w-12 h-12 bg-[#000000] border-2 border-blue-400 rounded-full flex items-center justify-center shadow-lg">
                   <img src="ton.jpg" class="w-8 h-8 opacity-90" onerror="this.style.display='none'">
                </div>
            </div>
        </div>

        <!-- Sayaç -->
        <div class="text-center">
            <h1 id="mining-counter" class="text-3xl font-bold counter-text tracking-tighter mb-2">0.0000000000 TON</h1>
            <div class="flex items-center justify-center gap-2 text-gray-400 bg-white/5 py-1 px-4 rounded-full">
                <span class="text-xs">ℹ️</span>
                <span class="text-sm font-semibold"><span id="ghs-value">6</span> GH/s</span>
                <span class="text-orange-500">⚡</span>
            </div>
        </div>

        <!-- Butonlar -->
        <div class="grid grid-cols-2 gap-4 w-full mt-10">
            <button onclick="claimMining()" class="bg-[#7c66e3] hover:bg-[#6b56d2] py-4 rounded-2xl font-bold flex items-center justify-center gap-2 btn-active transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M200,56V200a8,8,0,0,1-8,8H64a8,8,0,0,1-8-8V56a8,8,0,0,1,8-8H192A8,8,0,0,1,200,56Zm-40,88a12,12,0,1,0,12,12A12,12,0,0,0,160,144Zm-64,0a12,12,0,1,0,12,12A12,12,0,0,0,96,144Z"></path></svg>
                Claim
            </button>
            <button onclick="boostMining()" class="bg-[#7c66e3] hover:bg-[#6b56d2] py-4 rounded-2xl font-bold flex items-center justify-center gap-2 btn-active transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M213.66,122.34l-96-96a8,8,0,0,0-11.32,11.32L200.69,128,106.34,222.34a8,8,0,0,0,11.32,11.32l96-96A8,8,0,0,0,213.66,122.34Z"></path></svg>
                Boost
            </button>
        </div>
    </main>

    <!-- Diğer Sekmeler (Gizli) -->
    <div id="view-wallet" class="hidden flex-1 p-6">
        <h2 class="text-2xl font-bold mb-4">Cüzdan</h2>
        <div class="glass-card rounded-3xl p-6 text-center">
            <p class="text-gray-400 mb-2">Toplam Varlık</p>
            <p class="text-4xl font-bold text-blue-400">$ 24.50</p>
        </div>
    </div>

    <!-- Alt Navigasyon -->
    <footer class="bg-[#0f0f0f] p-2 flex justify-between items-center px-4 border-t border-gray-900 pb-6">
        <button onclick="switchTab('wallet', this)" class="flex flex-col items-center gap-1 p-2 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 256 256"><path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Zm-32,80a12,12,0,1,1,12-12A12,12,0,0,1,184,152Z"></path></svg>
            <span class="text-[10px]">Wallet</span>
        </button>
        <button onclick="switchTab('friends', this)" class="flex flex-col items-center gap-1 p-2 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 256 256"><path d="M117.33,152A48,48,0,1,0,69.33,104,48.05,48.05,0,0,0,117.33,152Zm0-80a32,32,0,1,1-32,32A32,32,0,0,1,117.33,72Zm64,88a48,48,0,1,0-48-48A48.05,48.05,0,0,0,181.33,160Zm0-80a32,32,0,1,1-32,32A32,32,0,0,1,181.33,80Zm-136,88a40,40,0,0,0-40,40,8,8,0,0,0,16,0,24,24,0,0,1,24-24,8,8,0,0,0,0-16Zm181.34,0a40,40,0,0,0-40,40,8,8,0,0,0,16,0,24,24,0,0,1,24-24,8,8,0,0,0,0-16Zm-160,32a48,48,0,0,0-48,48,8,8,0,0,0,16,0,32,32,0,0,1,32-32,8,8,0,0,0,0-16Z"></path></svg>
            <span class="text-[10px]">Friends</span>
        </button>
        <button onclick="switchTab('home', this)" class="nav-active flex flex-col items-center gap-1 p-2 px-4 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 256 256"><path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V120A15.87,15.87,0,0,0,219.31,108.68ZM208,216H160V160a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z"></path></svg>
            <span class="text-[10px]">Home</span>
        </button>
        <button onclick="switchTab('missions', this)" class="flex flex-col items-center gap-1 p-2 relative transition-all">
            <div class="absolute top-1 right-2 w-2 h-2 bg-red-500 rounded-full"></div>
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 256 256"><path d="M200,32a16,16,0,0,0-16,16v8a8,8,0,0,1-8,8H80a8,8,0,0,1-8-8V48a16,16,0,0,0-16-16H40A16,16,0,0,0,24,48V208a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V48A16,16,0,0,0,216,32ZM216,208H40V48H56V56a24,24,0,0,0,24,24h96a24,24,0,0,0,24-24V48h16Z"></path></svg>
            <span class="text-[10px]">Missions</span>
        </button>
        <button onclick="switchTab('more', this)" class="flex flex-col items-center gap-1 p-2 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 256 256"><path d="M156,128a28,28,0,1,1-28-28A28,28,0,0,1,156,128Zm-28,64a28,28,0,1,0,28,28A28,28,0,0,0,128,192Zm0-128a28,28,0,1,0-28-28A28,28,0,0,0,128,64Z"></path></svg>
            <span class="text-[10px]">More</span>
        </button>
    </footer>

    <!-- Bildirim Kutusu -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-white/10 backdrop-blur-md border border-white/20 px-6 py-2 rounded-full text-sm font-semibold opacity-0 pointer-events-none transition-all duration-300">
        Claimed!
    </div>

    <script>
        // Uygulama Durumu (State)
        let minedAmount = 0.0000000000;
        let totalBalance = 7.6823;
        let hashrate = 6; // GH/s
        let isBoosted = false;

        const counterEl = document.getElementById('mining-counter');
        const balanceEl = document.getElementById('total-ton');
        const ghsEl = document.getElementById('ghs-value');
        const fanEl = document.getElementById('main-fan');
        const toastEl = document.getElementById('toast');

        // Madencilik Fonksiyonu
        function updateMining() {
            // Saniyede eklenecek miktar (Hıza göre ölçekli)
            const increment = (hashrate * 0.000000005) + (Math.random() * 0.000000001);
            minedAmount += increment;
            counterEl.innerText = minedAmount.toFixed(10) + " TON";
        }

        // Madencilik döngüsünü başlat (Her 100ms'de bir güncelle)
        const miningInterval = setInterval(updateMining, 100);

        // Toplama (Claim) Fonksiyonu
        function claimMining() {
            if (minedAmount <= 0) return;

            totalBalance += minedAmount;
            minedAmount = 0;
            
            // UI Güncelleme
            balanceEl.innerText = totalBalance.toFixed(4) + " TON";
            counterEl.innerText = "0.0000000000 TON";
            
            showToast("Success! TON Collected");
        }

        // Hızlandırma (Boost) Fonksiyonu
        function boostMining() {
            if (isBoosted) return;
            
            isBoosted = true;
            hashrate *= 2;
            ghsEl.innerText = hashrate;
            fanEl.classList.add('boosted');
            
            showToast("Boost Active! 2x Speed");

            // 10 saniye sonra boost biter
            setTimeout(() => {
                isBoosted = false;
                hashrate /= 2;
                ghsEl.innerText = hashrate;
                fanEl.classList.remove('boosted');
                showToast("Boost Ended");
            }, 10000);
        }

        // Bildirim Göster
        function showToast(message) {
            toastEl.innerText = message;
            toastEl.style.opacity = "1";
            toastEl.style.bottom = "120px";
            
            setTimeout(() => {
                toastEl.style.opacity = "0";
                toastEl.style.bottom = "96px";
            }, 2000);
        }

        // Sekme Değiştirme
        function switchTab(tab, element) {
            // Tüm sekmeleri gizle ve butonların stilini sıfırla
            const tabs = ['home', 'wallet', 'friends', 'missions', 'more'];
            tabs.forEach(t => {
                const view = document.getElementById('view-' + t);
                if (view) view.classList.add('hidden');
            });

            const navButtons = document.querySelectorAll('footer button');
            navButtons.forEach(btn => btn.classList.remove('nav-active'));

            // Seçilen sekmeyi göster
            const targetView = document.getElementById('view-' + tab);
            if (targetView) targetView.classList.remove('hidden');
            element.classList.add('nav-active');

            // Eğer ana sayfadan çıkılırsa fan animasyonunu durdurarak enerji tasarrufu yapılabilir
        }

        // İlk başlangıçta verileri yerel depolamadan çekme (Opsiyonel geliştirme)
        window.onload = () => {
            console.log("App started");
        };
    </script>
</body>
</html>
