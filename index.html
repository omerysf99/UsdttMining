<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Bot Sayaç</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
            font-family: 'Inter', sans-serif;
        }
        .counter-card {
            background: white;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 340px;
        }
        #counter-display {
            font-size: 4rem;
            font-weight: 800;
            color: #1f2937;
            margin-bottom: 0.5rem;
            transition: transform 0.1s ease;
        }
        .btn-increment {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 1rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            user-select: none;
        }
        .btn-increment:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        .btn-increment:hover:not(:disabled) {
            background-color: #2563eb;
            transform: translateY(-2px);
        }
        .btn-increment:active:not(:disabled) {
            transform: translateY(0) scale(0.95);
        }
        #status-indicator {
            font-size: 0.75rem;
            margin-top: 1rem;
            color: #6b7280;
        }
        .telegram-info {
            background: #f0f7ff;
            border-radius: 0.75rem;
            padding: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            color: #1d4ed8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .loading-pulse {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        #reset-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div class="counter-card">
        <div class="telegram-info">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2L15 22L11 13L2 9L22 2Z"></path></svg>
            <span id="tg-id-display">TG ID: Yükleniyor...</span>
        </div>
        
        <h2 class="text-gray-500 text-xs font-bold tracking-widest mb-2 uppercase">Toplam Puan</h2>
        <div id="counter-display" class="loading-pulse">0</div>
        
        <button id="increment-btn" class="btn-increment" disabled>
            Yükleniyor...
        </button>
        
        <button id="reset-trigger" class="mt-4 text-gray-400 hover:text-red-500 text-xs underline transition-colors">Verileri Sıfırla</button>
        <div id="status-indicator">Başlatılıyor...</div>
    </div>

    <div id="reset-modal">
        <div class="bg-white p-6 rounded-xl shadow-xl max-w-xs w-full mx-4">
            <h3 class="text-lg font-bold mb-2">Emin misiniz?</h3>
            <p class="text-gray-600 mb-4 text-sm">Tüm ilerlemeniz silinecek. Onaylıyor musunuz?</p>
            <div class="flex gap-2">
                <button id="confirm-reset" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-semibold flex-1">Sıfırla</button>
                <button id="cancel-reset" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg text-sm font-semibold flex-1">Kapat</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDi7IqV474UDMtrKyKuO-2pct5WxwSB3jQ",
            authDomain: "studio-9241589115-a403e.firebaseapp.com",
            projectId: "studio-9241589115-a403e",
            storageBucket: "studio-9241589115-a403e.firebasestorage.app",
            messagingSenderId: "1010284036381",
            appId: "1:1010284036381:web:cd6effcc67287c510e61f4"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'telegram-counter-bot';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let count = 0;
        let currentUser = null;
        let unsubCounter = null;
        let unsubProfile = null;

        const display = document.getElementById('counter-display');
        const tgDisplay = document.getElementById('tg-id-display');
        const btn = document.getElementById('increment-btn');
        const resetTrigger = document.getElementById('reset-trigger');
        const status = document.getElementById('status-indicator');
        const resetModal = document.getElementById('reset-modal');

        // Firebase'e Kaydetme Fonksiyonu
        async function updateCloud(newCount) {
            if (!currentUser) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'counter');
                await setDoc(docRef, { value: newCount, updatedAt: serverTimestamp() }, { merge: true });
            } catch (e) {
                status.textContent = "Kaydetme hatası!";
            }
        }

        // Veri Senkronizasyonu
        function startSyncing(user) {
            currentUser = user;
            
            // 1. Sayaç Verisini Dinle
            const counterRef = doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'counter');
            unsubCounter = onSnapshot(counterRef, (snap) => {
                if (snap.exists()) {
                    count = snap.data().value || 0;
                    display.textContent = count;
                    display.classList.remove('loading-pulse');
                    btn.disabled = false;
                    btn.textContent = "Artır +1";
                    status.textContent = "Veriler güncel.";
                } else {
                    updateCloud(0);
                }
            });

            // 2. Telegram Profil Bilgisini Dinle (RULE 1 uyumlu yol)
            const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'info');
            unsubProfile = onSnapshot(profileRef, (snap) => {
                if (snap.exists() && snap.data().telegramId) {
                    tgDisplay.textContent = `ID: ${snap.data().telegramId}`;
                } else {
                    tgDisplay.textContent = "TG ID: Bağlı Değil";
                }
            });
        }

        // Auth Başlatma
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                status.textContent = "Giriş yapılamadı.";
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                startSyncing(user);
            } else {
                if (unsubCounter) unsubCounter();
                if (unsubProfile) unsubProfile();
                status.textContent = "Oturum açılmalı.";
            }
        });

        // Buton Olayları
        btn.addEventListener('click', () => {
            count++;
            display.textContent = count; // Hızlı geri bildirim
            updateCloud(count);
            display.style.transform = 'scale(1.1)';
            setTimeout(() => display.style.transform = 'scale(1)', 100);
        });

        resetTrigger.addEventListener('click', () => resetModal.style.display = 'flex');
        document.getElementById('cancel-reset').addEventListener('click', () => resetModal.style.display = 'none');
        document.getElementById('confirm-reset').addEventListener('click', () => {
            updateCloud(0);
            resetModal.style.display = 'none';
        });

        initAuth();
    </script>
</body>
</html>
