<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars Miner Arayüzü</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a111a;
            --card-bg: #16212d;
            --accent-blue: #2176ff;
            --green-btn: #28a745;
            --text-white: #ffffff;
            --text-gray: #a0aec0;
            --border-color: #2d3748;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Ana Konteynır */
        .app-container {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(180deg, #0f172a 0%, #050a0f 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid var(--border-color);
        }

        /* Üst Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
        }

        .balance-badge {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-color);
        }

        .balance-badge span { color: #4ade80; font-weight: bold; }

        .header-icons { display: flex; gap: 15px; align-items: center; }
        .flag-icon { width: 24px; border-radius: 3px; }

        /* Miner Bölümü */
        .miner-section {
            padding: 10px 20px;
            text-align: center;
        }

        .miner-image-container {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
        }

        .miner-img {
            width: 80%;
            filter: drop-shadow(0 0 15px rgba(33, 118, 255, 0.3));
        }

        .timer-btn {
            background: linear-gradient(to right, #1d4e89, #2176ff);
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 10px;
        }

        /* Lottery Bölümü */
        .lottery-card {
            background-color: #1b5e4c;
            margin: 15px 20px;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lottery-icon {
            background: white;
            color: #1b5e4c;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* Veri Kartı */
        .stats-card {
            background-color: var(--card-bg);
            margin: 0 20px;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
        }

        .input-display {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 8px;
            font-size: 1.2rem;
            margin: 10px 0;
            border: 1px solid #334155;
        }

        .sell-btn {
            background-color: #2fa17e;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border: none;
        }

        /* Alt Navigasyon */
        .nav-bar {
            margin-top: auto;
            display: flex;
            justify-content: space-around;
            background-color: #16212d;
            padding: 10px 0;
            border-top: 1px solid var(--border-color);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            color: var(--text-gray);
            gap: 5px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--text-white);
            background: rgba(255,255,255,0.05);
            padding: 5px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .nav-item i { font-size: 1.2rem; }

        .footer-text {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-gray);
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="balance-badge">
            <span>$</span> 0.0000 USD
        </div>
        <div class="header-icons">
            <img src="https://flagcdn.com/w40/tr.png" class="flag-icon" alt="TR">
            <i class="fas fa-cog"></i>
        </div>
    </div>

    <div class="miner-section">
        <div class="miner-image-container">
            <img src="https://cdn-icons-png.flaticon.com/512/3665/3665923.png" class="miner-img" alt="Miner">
            <i class="fas fa-chevron-right" style="position: absolute; right: 10px; top: 50%; color: #2176ff;"></i>
        </div>
        <div class="timer-btn">11:12:26</div>
    </div>

    <div class="lottery-card">
        <div class="lottery-icon">X100</div>
        <div>
            <div style="font-weight: bold;">POWER LOTTERY</div>
            <div style="font-size: 0.8rem; opacity: 0.8;">X100'e kadar kazan</div>
        </div>
    </div>

    <div class="stats-card">
        <div style="color: var(--text-gray);">Madenlenen Hash</div>
        <div class="input-display">0.73403</div>
        <button class="sell-btn">
            <i class="fas fa-sync-alt"></i> HASH'LERİ SAT
        </button>
        <div style="margin-top: 15px; color: var(--text-gray);">Gücünüz (Power)</div>
    </div>

    <div class="footer-text">@Stars_Miner_bot</div>

    <nav class="nav-bar">
        <div class="nav-item">
            <i class="fas fa-microchip" style="color: #a78bfa;"></i>
            <span>Yükselt</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-dollar-sign"></i>
            <span>Kazan</span>
        </div>
        <div class="nav-item active">
            <i class="fas fa-pickaxe"></i>
            <span>Madenci</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-list-ul"></i>
            <span>Görev</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-wallet"></i>
            <span>Ödeme</span>
        </div>
    </nav>
</div>

</body>
</html>
