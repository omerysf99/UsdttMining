<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Miner 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            margin: 0;
            user-select: none;
            touch-action: manipulation;
        }

        .sci-fi-border {
            border: 2px solid #1e293b;
            position: relative;
            background: rgba(15, 23, 42, 0.8);
            clip-path: polygon(10% 0, 90% 0, 100% 20%, 100% 80%, 90% 100%, 10% 100%, 0 80%, 0 20%);
        }

        .sci-fi-border::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 1px solid #38bdf8;
            opacity: 0.3;
            pointer-events: none;
        }

        .glow-text {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
        }

        .energy-bar-container {
            width: 12px;
            height: 200px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .energy-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            transition: height 0.3s ease;
            background: linear-gradient(to top, #0ea5e9, #38bdf8);
            box-shadow: 0 0 15px #0ea5e9;
        }

        .canvas-container {
            width: 100%;
            height: 350px;
            position: relative;
        }

        .tap-effect {
            position: absolute;
            color: #38bdf8;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            font-family: 'Orbitron', sans-serif;
            z-index: 50;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        .btn-blue {
            background: linear-gradient(135deg, #1e40af 0%, #0369a1 100%);
            box-shadow: 0 0 15px rgba(3, 105, 161, 0.5);
            transition: all 0.2s;
        }
        .btn-blue:active { transform: scale(0.95); filter: brightness(1.2); }

        .btn-gray {
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .nav-icon {
            color: #64748b;
            font-size: 1.5rem;
            transition: color 0.3s;
        }
        .nav-icon.active {
            color: #38bdf8;
            filter: drop-shadow(0 0 5px #38bdf8);
        }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto relative border-x border-slate-800">

    <!-- Üst İstatistik Paneli -->
    <div class="grid grid-cols-2 gap-4 p-4 mt-2">
        <div class="sci-fi-border p-2 text-center">
            <div class="text-[10px] text-slate-400 uppercase tracking-tighter">Pasif madencilik</div>
            <div class="text-sky-400 font-bold text-sm">+0.05</div>
            <div class="text-[10px] text-slate-500">USDT / gün</div>
        </div>
        <div class="sci-fi-border p-2 text-center">
            <div class="text-[10px] text-slate-400 uppercase tracking-tighter">Tap getirisi</div>
            <div class="text-sky-400 font-bold text-sm">+0.000250</div>
            <div class="text-[10px] text-slate-500">USDT</div>
        </div>
    </div>

    <!-- Ana Bakiye -->
    <div class="text-center mt-6">
        <h1 id="balance" class="text-4xl font-bold orbitron glow-text tracking-widest">0.000000</h1>
        <span class="text-sky-400 font-bold ml-1">USDT</span>
        <p class="text-[11px] text-slate-500 mt-2 uppercase tracking-widest">Otomatik madenciliği artırmak için bir modül satın alın</p>
    </div>

    <!-- 3D Alan ve Enerji -->
    <div class="flex-grow flex items-center justify-center relative px-6">
        <!-- Sol Enerji Barı -->
        <div class="flex flex-col items-center gap-2">
            <div class="energy-bar-container">
                <div id="energy-fill-left" class="energy-fill" style="height: 100%;"></div>
            </div>
            <span class="text-[10px] text-sky-400 font-bold" id="energy-text">100/100</span>
        </div>

        <!-- 3D Çekirdek -->
        <div id="canvas-container" class="canvas-container cursor-pointer">
            <!-- Three.js buraya render edilecek -->
        </div>

        <!-- Sağ Isı/Enerji Barı (Görsel) -->
        <div class="flex flex-col items-center gap-2">
            <div class="energy-bar-container">
                <div class="energy-fill" style="height: 40%; background: linear-gradient(to top, #f97316, #fbbf24); box-shadow: 0 0 15px #f97316;"></div>
            </div>
            <span class="text-[10px] text-orange-400 font-bold uppercase">TEMP</span>
        </div>
    </div>

    <!-- Butonlar -->
    <div class="flex gap-4 px-4 mb-6">
        <button class="flex-1 py-4 rounded-xl btn-blue font-bold uppercase tracking-widest text-sm">Modül Satın Al</button>
        <button class="flex-1 py-4 rounded-xl btn-gray font-bold uppercase tracking-widest text-sm">Çek</button>
    </div>

    <!-- Alt Navigasyon -->
    <div class="bg-slate-900/80 border-t border-slate-800 p-4 flex justify-between items-center rounded-t-3xl">
        <i class="fas fa-th-large nav-icon active"></i>
        <i class="fas fa-wallet nav-icon"></i>
        <i class="fas fa-microchip nav-icon"></i>
        <i class="fas fa-users nav-icon"></i>
        <i class="fas fa-newspaper nav-icon"></i>
    </div>

    <!-- Bilgi Mesajı -->
    <div id="passive-notice" class="fixed top-0 left-0 w-full h-full bg-black/80 flex items-center justify-center z-[100] hidden">
        <div class="bg-slate-800 p-6 rounded-2xl text-center border border-sky-500 max-w-[80%]">
            <h2 class="text-xl font-bold mb-2 text-sky-400">Hoş Geldiniz!</h2>
            <p id="passive-amount-text" class="text-sm text-slate-300 mb-4"></p>
            <button onclick="closeNotice()" class="px-6 py-2 bg-sky-600 rounded-lg font-bold">TOPLA</button>
        </div>
    </div>

    <script>
        // Oyun Ayarları ve Durumu
        let state = {
            balance: parseFloat(localStorage.getItem('miner_balance')) || 0.0,
            energy: parseInt(localStorage.getItem('miner_energy')) || 100,
            lastUpdate: parseInt(localStorage.getItem('miner_last_update')) || Date.now()
        };

        const MAX_ENERGY = 100;
        const TAP_VALUE = 0.000250;
        const DAILY_PASSIVE = 0.05;
        const PASSIVE_PER_MS = DAILY_PASSIVE / (24 * 60 * 60 * 1000);
        const REGEN_TIME = 2000; // 2 saniyede 1 enerji

        const balanceEl = document.getElementById('balance');
        const energyFillLeft = document.getElementById('energy-fill-left');
        const energyText = document.getElementById('energy-text');
        const canvasContainer = document.getElementById('canvas-container');

        // Three.js Kurulumu
        let scene, camera, renderer, core;

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, canvasContainer.offsetWidth / canvasContainer.offsetHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(canvasContainer.offsetWidth, canvasContainer.offsetHeight);
            canvasContainer.appendChild(renderer.domElement);

            // Çekirdek yapısı (fan.jpg texture olarak kullanılacak)
            // Not: fan.jpg yerelde olmadığı için bir placeholder renk kullanıyoruz, 
            // kullanıcı kendi GitHub linkini buraya ekleyebilir.
            const loader = new THREE.TextureLoader();
            const texture = loader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/uv_grid_opengl.jpg'); // Fallback

            const geometry = new THREE.IcosahedronGeometry(1.5, 0);
            const material = new THREE.MeshPhongMaterial({
                color: 0x0ea5e9,
                wireframe: true,
                emissive: 0x0369a1,
                emissiveIntensity: 0.5
            });
            
            const innerGeometry = new THREE.SphereGeometry(0.8, 32, 32);
            const innerMaterial = new THREE.MeshPhongMaterial({
                color: 0x38bdf8,
                emissive: 0x38bdf8,
                emissiveIntensity: 1
            });

            core = new THREE.Group();
            const outerMesh = new THREE.Mesh(geometry, material);
            const innerMesh = new THREE.Mesh(innerGeometry, innerMaterial);
            
            // Etrafındaki halkalar
            const ringGeo = new THREE.TorusGeometry(2, 0.05, 16, 100);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.3 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;

            core.add(outerMesh);
            core.add(innerMesh);
            core.add(ring);
            scene.add(core);

            const light = new THREE.PointLight(0x38bdf8, 2, 100);
            light.position.set(5, 5, 5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));

            camera.position.z = 5;
        }

        function animate() {
            requestAnimationFrame(animate);
            if (core) {
                core.rotation.y += 0.01;
                core.rotation.x += 0.005;
            }
            renderer.render(scene, camera);
        }

        // Oyun Mantığı
        function updateUI() {
            balanceEl.innerText = state.balance.toFixed(6);
            energyFillLeft.style.height = `${(state.energy / MAX_ENERGY) * 100}%`;
            energyText.innerText = `${state.energy}/${MAX_ENERGY}`;
            
            localStorage.setItem('miner_balance', state.balance);
            localStorage.setItem('miner_energy', state.energy);
            localStorage.setItem('miner_last_update', Date.now());
        }

        function handleTap(e) {
            if (state.energy <= 0) return;

            // Enerji düşür, bakiye ekle
            state.energy -= 1;
            state.balance += TAP_VALUE;

            // 3D Animasyon tepkisi
            core.scale.set(1.2, 1.2, 1.2);
            setTimeout(() => core.scale.set(1, 1, 1), 100);

            // Görsel efekt
            const x = e.clientX || e.touches[0].clientX;
            const y = e.clientY || e.touches[0].clientY;
            createTapEffect(x, y);

            updateUI();
        }

        function createTapEffect(x, y) {
            const el = document.createElement('div');
            el.className = 'tap-effect';
            el.innerText = `+${TAP_VALUE}`;
            el.style.left = `${x - 20}px`;
            el.style.top = `${y - 20}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        // Pasif Gelir Hesaplama
        function calculatePassive() {
            const now = Date.now();
            const diff = now - state.lastUpdate;
            const earned = diff * PASSIVE_PER_MS;
            
            if (earned > 0.000001) {
                state.balance += earned;
                document.getElementById('passive-amount-text').innerText = `Siz yokken madencileriniz ${earned.toFixed(6)} USDT topladı!`;
                document.getElementById('passive-notice').classList.remove('hidden');
            }
            updateUI();
        }

        function closeNotice() {
            document.getElementById('passive-notice').classList.add('hidden');
        }

        // Enerji Yenilenmesi (2 sn'de 1)
        setInterval(() => {
            if (state.energy < MAX_ENERGY) {
                state.energy += 1;
                updateUI();
            }
        }, REGEN_TIME);

        // Pasif Güncelleme (Oyundayken de küçük artışlar için)
        setInterval(() => {
            state.balance += (1000 * PASSIVE_PER_MS);
            updateUI();
        }, 1000);

        // Başlatma
        window.onload = () => {
            init3D();
            animate();
            calculatePassive();

            canvasContainer.addEventListener('mousedown', handleTap);
            canvasContainer.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleTap(e);
            });

            // Pencere yeniden boyutlandırma
            window.onresize = () => {
                camera.aspect = canvasContainer.offsetWidth / canvasContainer.offsetHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(canvasContainer.offsetWidth, canvasContainer.offsetHeight);
            };
        };
    </script>
</body>
</html>
