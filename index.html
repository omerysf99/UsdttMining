<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TeleTap Pro - Miner</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            overflow: hidden;
            touch-action: manipulation;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .coin-btn {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(145deg, #3b82f6, #1d4ed8);
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.05s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .coin-btn:active {
            transform: scale(0.92);
        }
        .floating-text {
            position: absolute;
            color: #60a5fa;
            font-weight: 800;
            font-size: 1.5rem;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.5); }
        }
        .progress-bar {
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-white">

    <div class="max-w-md w-full flex flex-col items-center gap-8">
        <!-- Üst Panel -->
        <div class="glass w-full p-4 rounded-2xl flex justify-between items-center border border-white/10">
            <div class="flex items-center gap-3">
                <div id="user-avatar" class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center font-bold text-white text-xl shadow-lg shadow-blue-500/20">?</div>
                <div>
                    <p id="user-name" class="text-gray-400 text-[10px] font-bold uppercase tracking-widest leading-none mb-1">Yükleniyor...</p>
                    <p id="tg-id-display" class="text-blue-400 text-xs font-semibold">ID: Bağlanıyor...</p>
                </div>
            </div>
            <div id="connection-dot" class="w-3 h-3 rounded-full bg-red-500 shadow-[0_0_12px_rgba(239,68,68,0.6)] animate-pulse"></div>
        </div>

        <!-- Ana Skor -->
        <div class="text-center">
            <h1 id="counter-display" class="text-7xl font-black text-white mb-1 tracking-tighter drop-shadow-2xl">0</h1>
            <p class="text-blue-400 font-bold text-xs tracking-[0.2em] uppercase opacity-80">Toplam Kazanç</p>
        </div>

        <!-- Tıklama Alanı -->
        <div id="tap-area" class="coin-btn">
            <div class="absolute inset-0 rounded-full border-4 border-white/10"></div>
            <svg class="text-white w-24 h-24 drop-shadow-lg" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
        </div>

        <!-- Alt İlerleme Paneli -->
        <div class="glass w-full p-6 rounded-[2.5rem] border border-white/10">
            <div class="flex justify-between text-[10px] font-black text-gray-400 mb-3 tracking-widest">
                <span id="level-title">SEVİYE 1: ÇAYLAK</span>
                <span id="level-text">0 / 1000</span>
            </div>
            <div class="progress-bar mb-6">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <div class="flex flex-col items-center gap-3">
                <button id="reset-trigger" class="text-gray-500 hover:text-red-400 text-[10px] uppercase font-bold transition-all hover:tracking-wider">Verileri Sıfırla</button>
                <div id="status-indicator" class="text-gray-600 text-[9px] uppercase font-bold tracking-widest text-center">
                    Sistem Hazırlanıyor
                </div>
            </div>
        </div>
    </div>

    <!-- Onay Modalı -->
    <div id="reset-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden items-center justify-center p-6 z-[200]">
        <div class="glass bg-slate-900/50 p-8 rounded-[2.5rem] w-full max-w-xs text-center border border-white/5">
            <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="text-red-500 w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 class="text-white text-xl font-extrabold mb-2 uppercase tracking-tight">Emin misiniz?</h3>
            <p class="text-gray-400 text-sm mb-8 leading-relaxed">Tüm puanlarınız ve ilerlemeniz kalıcı olarak silinecek.</p>
            <div class="flex flex-col gap-3">
                <button id="confirm-reset" class="bg-red-500 hover:bg-red-600 text-white font-black py-4 rounded-2xl transition-all shadow-lg shadow-red-500/20 active:scale-95">EVET, SIFIRLA</button>
                <button id="cancel-reset" class="text-gray-500 font-bold text-sm py-2 hover:text-white transition-colors">VAZGEÇ</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
            if (tg.setHeaderColor) tg.setHeaderColor('#1e293b');
        }

        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "AIzaSyDi7IqV474UDMtrKyKuO-2pct5WxwSB3jQ",
                authDomain: "studio-9241589115-a403e.firebaseapp.com",
                projectId: "studio-9241589115-a403e",
                storageBucket: "studio-9241589115-a403e.firebasestorage.app",
                messagingSenderId: "1010284036381",
                appId: "1:1010284036381:web:cd6effcc67287c510e61f4"
            };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'teletap-pro-v1';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let count = 0;
        let currentUser = null;
        let syncActive = false;

        const display = document.getElementById('counter-display');
        const tgDisplay = document.getElementById('tg-id-display');
        const userNameDisplay = document.getElementById('user-name');
        const userAvatar = document.getElementById('user-avatar');
        const tapArea = document.getElementById('tap-area');
        const progressFill = document.getElementById('progress-fill');
        const status = document.getElementById('status-indicator');
        const connDot = document.getElementById('connection-dot');

        async function updateCloud(val) {
            if (!currentUser) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'counter');
                await setDoc(docRef, { 
                    value: val, 
                    lastActive: serverTimestamp(),
                    client: tg?.platform || 'web'
                }, { merge: true });
            } catch (e) {
                console.error("Buluta yazılamadı:", e);
            }
        }

        function updateUI(val) {
            count = val;
            display.textContent = val.toLocaleString();
            
            const nextLevel = 1000;
            const progress = (val % nextLevel) / nextLevel * 100;
            progressFill.style.width = `${progress}%`;
            document.getElementById('level-text').textContent = `${(val % nextLevel)} / ${nextLevel}`;
            
            const levelNum = Math.floor(val / 1000) + 1;
            document.getElementById('level-title').textContent = `SEVİYE ${levelNum}: ${levelNum > 5 ? 'ELİT' : 'ÇAYLAK'}`;
        }

        function startSync(user) {
            if (syncActive) return;
            currentUser = user;
            syncActive = true;
            
            status.textContent = "Bağlantı Aktif ✅";
            connDot.classList.replace('bg-red-500', 'bg-green-500');
            connDot.classList.remove('animate-pulse');

            const tgUser = tg?.initDataUnsafe?.user;
            if (tgUser) {
                userNameDisplay.textContent = `${tgUser.first_name} ${tgUser.last_name || ''}`.trim();
                tgDisplay.textContent = `ID: ${tgUser.id}`;
                userAvatar.textContent = tgUser.first_name[0].toUpperCase();
            } else {
                userNameDisplay.textContent = "Misafir Kullanıcı";
                tgDisplay.textContent = "Web Önizleme";
            }

            const counterRef = doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'counter');
            onSnapshot(counterRef, (snap) => {
                if (snap.exists()) {
                    updateUI(snap.data().value || 0);
                } else {
                    updateCloud(0);
                    updateUI(0);
                }
            }, (err) => {
                status.textContent = "Veri Yetki Hatası";
                console.error(err);
            });
        }

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Giriş Hatası:", e);
                status.textContent = e.code === 'auth/configuration-not-found' 
                    ? "HATA: Firebase'den Anonim Girişi Açın!" 
                    : "Bağlantı Hatası: " + e.code;
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) startSync(user);
            else status.textContent = "Oturum bekleniyor...";
        });

        function createParticle(x, y) {
            const p = document.createElement('div');
            p.className = 'floating-text';
            p.textContent = '+1';
            p.style.left = `${x}px`;
            p.style.top = `${y}px`;
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 800);
        }

        tapArea.addEventListener('pointerdown', (e) => {
            if (!currentUser) return;
            count++;
            updateUI(count);
            updateCloud(count);
            createParticle(e.clientX, e.clientY);
            
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        });

        const modal = document.getElementById('reset-modal');
        document.getElementById('reset-trigger').onclick = () => modal.style.display = 'flex';
        document.getElementById('cancel-reset').onclick = () => modal.style.display = 'none';
        document.getElementById('confirm-reset').onclick = () => {
            updateCloud(0);
            updateUI(0);
            modal.style.display = 'none';
        };

        initAuth();
    </script>
</body>
</html>
