<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Çoklu Giriş Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 text-slate-800">

    <div class="glass-card w-full max-w-md p-8 rounded-2xl shadow-2xl">
        <div id="auth-ui">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-800">Giriş Yap</h1>
                <p class="text-slate-500 mt-2">Tercih ettiğiniz yöntemi seçin</p>
            </div>

            <!-- Giriş Seçenekleri -->
            <div id="auth-methods" class="space-y-3">
                <!-- Google Login -->
                <button onclick="signInWithGoogle()" 
                    class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 hover:bg-slate-50 font-semibold py-3 rounded-xl transition-all shadow-sm active:scale-95">
                    <svg class="w-5 h-5" viewBox="0 0 48 48">
                        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
                    </svg>
                    Google ile Devam Et
                </button>

                <div class="relative py-4">
                    <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-200"></span></div>
                    <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-slate-400">Veya</span></div>
                </div>

                <!-- E-posta Formu -->
                <div class="space-y-2">
                    <input type="email" id="email" placeholder="E-posta" class="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    <input type="password" id="password" placeholder="Şifre" class="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    <div class="flex gap-2">
                        <button onclick="handleEmailAuth('signin')" class="flex-1 bg-slate-800 text-white py-2 rounded-lg text-sm font-semibold hover:bg-slate-700">Giriş Yap</button>
                        <button onclick="handleEmailAuth('signup')" class="flex-1 border border-slate-800 text-slate-800 py-2 rounded-lg text-sm font-semibold hover:bg-slate-50">Kayıt Ol</button>
                    </div>
                </div>

                <div class="relative py-4">
                    <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-200"></span></div>
                </div>

                <!-- Telefon Girişi -->
                <div id="phone-section">
                    <input type="tel" id="phoneNumber" placeholder="+90 5xx..." value="+90" class="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 text-sm mb-2">
                    <div id="recaptcha-container"></div>
                    <button onclick="sendOTP()" id="phone-btn" class="w-full bg-emerald-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-emerald-700 mt-2">Telefon ile Kod Gönder</button>
                </div>

                <div id="otp-section" class="hidden space-y-2">
                    <input type="text" id="verificationCode" placeholder="6 Haneli Kod" class="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none text-center tracking-widest">
                    <button onclick="verifyOTP()" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-semibold">Kodu Doğrula</button>
                </div>
            </div>
        </div>

        <!-- Başarı Ekranı -->
        <div id="success-ui" class="hidden text-center">
            <div id="user-photo-container" class="mb-4"></div>
            <h2 class="text-xl font-bold" id="user-display-name">Hoş Geldiniz!</h2>
            <p class="text-slate-500 text-sm mb-4" id="user-email-phone"></p>
            <button onclick="signOutUser()" class="w-full py-2 bg-red-50 text-red-600 rounded-lg font-semibold hover:bg-red-100 transition-colors">Çıkış Yap</button>
        </div>

        <div id="message-box" class="mt-4 p-3 rounded-lg text-xs hidden text-center"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword,
            RecaptchaVerifier,
            signInWithPhoneNumber,
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoJmNT86J_GoBUG-X2TrGOHPtK258kaBM",
            authDomain: "aaa123-468db.firebaseapp.com",
            projectId: "aaa123-468db",
            storageBucket: "aaa123-468db.firebasestorage.app",
            messagingSenderId: "277639579187",
            appId: "1:277639579187:web:f51052399a8d44f2308546",
            measurementId: "G-8HXRVPPNHR"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        auth.languageCode = 'tr';

        function showMessage(msg, isError = false) {
            const box = document.getElementById('message-box');
            box.innerText = msg;
            box.className = `mt-4 p-3 rounded-lg text-xs text-center ${isError ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}`;
        }

        function updateUI(user) {
            if (user) {
                document.getElementById('auth-ui').classList.add('hidden');
                document.getElementById('success-ui').classList.remove('hidden');
                document.getElementById('user-display-name').innerText = user.displayName || 'Kullanıcı';
                document.getElementById('user-email-phone').innerText = user.email || user.phoneNumber;
                if (user.photoURL) {
                    document.getElementById('user-photo-container').innerHTML = `<img src="${user.photoURL}" class="w-20 h-20 rounded-full mx-auto shadow-md border-2 border-white">`;
                }
            } else {
                document.getElementById('auth-ui').classList.remove('hidden');
                document.getElementById('success-ui').classList.add('hidden');
                document.getElementById('message-box').classList.add('hidden');
            }
        }

        // --- Google Login ---
        window.signInWithGoogle = async () => {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                updateUI(result.user);
            } catch (e) { showMessage(e.message, true); }
        };

        // --- Email/Password ---
        window.handleEmailAuth = async (type) => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                const result = (type === 'signup') 
                    ? await createUserWithEmailAndPassword(auth, email, pass)
                    : await signInWithEmailAndPassword(auth, email, pass);
                updateUI(result.user);
            } catch (e) { showMessage(e.message, true); }
        };

        // --- Phone Login ---
        window.setupRecaptcha = () => {
            if (window.recaptchaVerifier) return;
            window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 'size': 'invisible' });
        };

        window.sendOTP = async () => {
            const phone = document.getElementById('phoneNumber').value;
            setupRecaptcha();
            try {
                window.confirmationResult = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
                document.getElementById('phone-section').classList.add('hidden');
                document.getElementById('otp-section').classList.remove('hidden');
                showMessage("Doğrulama kodu gönderildi.");
            } catch (e) { showMessage(e.message, true); }
        };

        window.verifyOTP = async () => {
            const code = document.getElementById('verificationCode').value;
            try {
                const result = await window.confirmationResult.confirm(code);
                updateUI(result.user);
            } catch (e) { showMessage("Hatalı kod.", true); }
        };

        window.signOutUser = () => signOut(auth).then(() => location.reload());

        auth.onAuthStateChanged(updateUI);
    </script>
</body>
</html>
