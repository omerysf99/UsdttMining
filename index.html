<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejderha Dünyası - TON Mining</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #000000;
            --card-bg: #111111;
            --accent-red: #ff0015;
            --accent-gold: #ffb703;
            --text-gray: #a0a0a0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
        }

        /* Üst Bakiye Kartları */
        .balance-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            border: 1px solid rgba(255,0,21,0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .balance-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            border: 1.5px solid rgba(255,255,255,0.05);
        }

        .balance-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .wallet-btn {
            background: linear-gradient(135deg, var(--accent-red), #80000b);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 21, 0.4);
        }

        /* Orta Fan Ünitesi - Siyah Çerçeve Kaldırıldı */
        .fan-frame {
            position: relative;
            width: 340px;
            height: 340px;
            margin: 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(255, 0, 21, 0.25) 0%, transparent 70%);
            border-radius: 50%;
        }

        .fan-image-container {
            width: 310px;
            height: 310px;
            border-radius: 50%;
            overflow: hidden;
            /* Siyah çerçeve ve arka plan kaldırıldı */
            border: none; 
            box-shadow: 0 0 50px rgba(255, 0, 21, 0.6);
            background-color: transparent;
        }

        .fan-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Sayaç Alanı */
        .counter-section {
            text-align: center;
            margin-top: 10px;
        }

        .counter-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 36px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(255, 0, 21, 0.4);
        }

        .power-label {
            color: var(--accent-red);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Butonlar */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 20px;
            margin-top: auto;
            margin-bottom: 95px;
        }

        .btn-main {
            padding: 18px;
            border-radius: 16px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .btn-claim {
            background: linear-gradient(to right, #ff0015, #99000d);
            box-shadow: 0 4px 15px rgba(255, 0, 21, 0.3);
        }

        .btn-boost {
            background: #111;
            border: 2px solid var(--accent-red);
            color: var(--accent-red);
        }

        .btn-main:active { transform: scale(0.96); }

        /* Navigasyon */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 85px;
            background-color: #080808;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.03);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #666;
            font-size: 11px;
            font-weight: 600;
        }

        .nav-link.active {
            color: white;
        }

        .active-indicator {
            background: #151515;
            padding: 10px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 0, 21, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="p-5 flex flex-col h-full max-w-md mx-auto w-full">
        
        <!-- Bakiye: TON -->
        <div class="balance-card">
            <div class="flex items-center">
                <div class="balance-icon">
                    <img src="ton.jpg" alt="TON" onerror="this.src='https://cryptologos.cc/logos/toncoin-ton-logo.png'">
                </div>
                <div>
                    <p class="text-[10px] text-gray-500 uppercase font-black">TON Balance</p>
                    <h3 class="text-base font-extrabold" id="ton-balance-display">0.0000 TON</h3>
                </div>
            </div>
            <div class="wallet-btn">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="white">
                    <path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h9zm-9-2h10V8H12v8z"/>
                </svg>
            </div>
        </div>

        <!-- Bakiye: $DRAGON -->
        <div class="balance-card">
            <div class="flex items-center">
                <div class="balance-icon">
                    <img src="dragon.jpg" alt="DRAGON" onerror="this.style.display='none'; this.parentNode.innerHTML='<span class=\'text-2xl\'>🐉</span>'">
                </div>
                <div>
                    <p class="text-[10px] text-gray-500 uppercase font-black">$DRAGON Balance</p>
                    <h3 class="text-base font-extrabold">0</h3>
                </div>
            </div>
            <div class="wallet-btn" style="background: #222; box-shadow: none;">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="white">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
            </div>
        </div>

        <!-- Ana Madenci Ünitesi -->
        <div class="fan-frame">
            <div class="fan-image-container">
                <img src="fan.jpg" class="fan-image" alt="Red Dragon Fan" onerror="this.src='https://via.placeholder.com/310/000000/ff0000?text=DRAGON+FAN'">
            </div>
        </div>

        <!-- Sayaç -->
        <div class="counter-section">
            <div class="counter-value" id="mining-counter">0.0000000000</div>
            <div class="power-label">
                <span>DRAGON POWER</span>
                <span class="text-white">|</span>
                <span>1 GH/S</span>
                <span class="animate-pulse">🔥</span>
            </div>
        </div>

        <!-- Butonlar -->
        <div class="action-grid">
            <button class="btn-main btn-claim" onclick="claimRewards()">
                <span>📥</span> Claim
            </button>
            <button class="btn-main btn-boost">
                <span>🚀</span> Boost
            </button>
        </div>

    </div>

    <!-- Navigasyon -->
    <nav class="bottom-nav">
        <div class="nav-link">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h9zm-9-2h10V8H12v8z"/></svg>
            <span>Wallet</span>
        </div>
        <div class="nav-link">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3z"/></svg>
            <span>Friends</span>
        </div>
        <div class="nav-link active">
            <div class="active-indicator">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="#ff0015"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span class="text-white mt-1">Home</span>
            </div>
        </div>
        <div class="nav-link">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
            <span>Tasks</span>
        </div>
        <div class="nav-link">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            <span>More</span>
        </div>
    </nav>

    <script>
        // Madencilik Hesabı: Günde 1 TON
        const DAILY_REWARD = 1.0;
        const REWARD_PER_SECOND = DAILY_REWARD / 86400;
        const TICK_MS = 80; 
        const REWARD_PER_TICK = REWARD_PER_SECOND / (1000 / TICK_MS);

        let currentSession = 0.0;
        let totalBalance = 0.0;

        const counterEl = document.getElementById('mining-counter');
        const displayEl = document.getElementById('ton-balance-display');

        // Kazım Döngüsü
        setInterval(() => {
            currentSession += REWARD_PER_TICK;
            counterEl.innerText = currentSession.toFixed(10);
        }, TICK_MS);

        function claimRewards() {
            if (currentSession <= 0) return;

            totalBalance += currentSession;
            displayEl.innerText = totalBalance.toFixed(4) + " TON";
            
            const toast = document.createElement('div');
            toast.className = 'fixed top-12 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-8 py-4 rounded-2xl z-50 font-black shadow-[0_0_30px_rgba(255,0,21,0.5)] border border-white/20';
            toast.innerText = '+' + currentSession.toFixed(6) + ' TON COLLECTED! 🔥';
            document.body.appendChild(toast);
            
            currentSession = 0;
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -20px)';
                toast.style.transition = 'all 0.4s ease';
                setTimeout(() => toast.remove(), 400);
            }, 1800);
        }
    </script>
</body>
</html>
