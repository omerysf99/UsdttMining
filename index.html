<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Madencilik Arayüzü</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 9:16 Oranı için Konteyner */
        .app-container {
            width: 100%;
            height: 100%;
            max-width: calc(100vh * 9 / 16); /* Yüksekliğe göre 9:16 genişlik */
            max-height: 100vh;
            background-color: #0c0c0c;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        /* İçerik Alanı */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            padding-bottom: 100px; /* Navigasyon için boşluk */
        }

        /* Üst Kartlar */
        .balance-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .coin-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 12px;
            object-fit: cover;
        }

        .wallet-btn {
            background: #6d5dfc;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Fan Alanı */
        .mining-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 300px;
        }

        .fan-container {
            position: relative;
            width: min(70vw, 260px);
            height: min(70vw, 260px);
            margin-bottom: 20px;
        }

        .fan-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: rotateFan 3s linear infinite;
        }

        @keyframes rotateFan {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Sayılar */
        .main-balance {
            font-size: clamp(1.8rem, 8vw, 2.5rem);
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: -1px;
        }

        .stats-badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #aaa;
            margin-top: 10px;
        }

        /* Butonlar */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
            flex-shrink: 0;
        }

        .btn {
            padding: 14px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:active { transform: scale(0.95); }
        .btn-claim { background: #6d5dfc; color: white; }
        .btn-boost { background: #8e80ff; color: white; }

        /* Alt Menü */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 15, 15, 0.98);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 24px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            color: #888;
            text-decoration: none;
            width: 20%;
        }

        .nav-item.active {
            color: #8e80ff;
        }

        .nav-icon {
            font-size: 1.4rem;
            margin-bottom: 2px;
        }

        .svg-icon { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="content">
            <!-- Üst Bakiye Kartları -->
            <div class="balance-card">
                <div class="flex items-center">
                    <img src="ton.jpg" alt="TON" class="coin-icon" onerror="this.src='https://cryptologos.cc/logos/toncoin-ton-logo.png'">
                    <div>
                        <div class="text-[10px] uppercase tracking-wider text-gray-500">Balance</div>
                        <div class="font-bold text-sm" id="mainWalletBalance">0.0000000000 TON</div>
                    </div>
                </div>
                <div class="wallet-btn">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 18V19C21 20.1 20.1 21 19 21H5C3.89 21 3 20.1 3 19V5C3 3.9 3.89 3 5 3H19C20.1 3 21 3.9 21 5V6H12C10.89 6 10 6.89 10 8V16C10 17.11 10.89 18 12 18H21ZM12 16H22V8H12V16ZM16 13.5C15.17 13.5 14.5 12.83 14.5 12C14.5 11.17 15.17 10.5 16 10.5C16.83 10.5 17.5 11.17 17.5 12C17.5 12.83 16.83 13.5 16 13.5Z"/></svg>
                </div>
            </div>

            <div class="balance-card">
                <div class="flex items-center">
                    <img src="dragon.jpg" alt="TONIX" class="coin-icon" onerror="this.src='https://via.placeholder.com/32/333/fff?text=T'">
                    <div>
                        <div class="text-[10px] uppercase tracking-wider text-gray-500">Balance</div>
                        <div class="font-bold text-sm">0 TONIX</div>
                    </div>
                </div>
                <div class="wallet-btn">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 18V19C21 20.1 20.1 21 19 21H5C3.89 21 3 20.1 3 19V5C3 3.9 3.89 3 5 3H19C20.1 3 21 3.9 21 5V6H12C10.89 6 10 6.89 10 8V16C10 17.11 10.89 18 12 18H21ZM12 16H22V8H12V16ZM16 13.5C15.17 13.5 14.5 12.83 14.5 12C14.5 11.17 15.17 10.5 16 10.5C16.83 10.5 17.5 11.17 17.5 12C17.5 12.83 16.83 13.5 16 13.5Z"/></svg>
                </div>
            </div>

            <!-- Fan Alanı -->
            <div class="mining-section">
                <div class="fan-container">
                    <img src="fan.jpg" alt="Fan" class="fan-img" id="miningFan" onerror="this.src='https://img.freepik.com/premium-photo/3d-render-electric-fan-ventilator-blue-color-isolated-black-background_1020697-2384.jpg'">
                </div>

                <div class="main-balance" id="tonBalance">0.0000000000</div>
                <div class="text-xl font-extrabold text-white mb-2">TON</div>
                
                <div class="stats-badge">
                    <span style="font-size: 14px; opacity: 0.6;">ℹ️</span>
                    <span class="font-bold text-white">11 GH/s</span>
                    <span style="color: #ff9d00;">⚡</span>
                </div>
            </div>

            <!-- İşlem Butonları -->
            <div class="action-buttons">
                <div class="btn btn-claim" onclick="handleClaim()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z"/></svg>
                    Claim
                </div>
                <div class="btn btn-boost" onclick="handleBoost()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M13 10V3L4 14H11V21L20 10H13Z"/></svg>
                    Boost
                </div>
            </div>
        </div>

        <!-- Alt Navigasyon (Her Zaman Sabit) -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item">
                <span class="nav-icon">👛</span>
                <span>Wallet</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">👥</span>
                <span>Friends</span>
            </a>
            <a href="#" class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span>Home</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">🎯</span>
                <span>Missions</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">⚙️</span>
                <span>More</span>
            </a>
        </nav>

    </div>

    <script>
        let currentBalance = 0.0;
        let walletBalance = 0.0;
        
        const balanceElement = document.getElementById('tonBalance');
        const walletElement = document.getElementById('mainWalletBalance');
        const increment = 0.0000001273148; 

        setInterval(() => {
            currentBalance += increment;
            balanceElement.textContent = currentBalance.toFixed(10);
        }, 100);

        function handleClaim() {
            if (currentBalance > 0) {
                walletBalance += currentBalance;
                currentBalance = 0;
                
                walletElement.textContent = walletBalance.toFixed(10) + " TON";
                balanceElement.textContent = "0.0000000000";
                
                const btn = event.currentTarget;
                btn.style.transform = "scale(0.9)";
                setTimeout(() => { btn.style.transform = "scale(1)"; }, 100);
            }
        }

        function handleBoost() {
            const fan = document.getElementById('miningFan');
            fan.style.animationDuration = '0.5s';
            setTimeout(() => {
                fan.style.animationDuration = '3s';
            }, 2500);
        }
    </script>
</body>
</html>
