<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Madencilik Arayüzü</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            height: 100%;
            max-width: calc(100vh * 9 / 16);
            max-height: 100vh;
            background-color: #0c0c0c;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            padding-bottom: 100px;
        }

        .balance-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .coin-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 12px;
            object-fit: cover;
        }

        .wallet-btn {
            background: #6d5dfc;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mining-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 300px;
        }

        .fan-container {
            position: relative;
            width: min(70vw, 260px);
            height: min(70vw, 260px);
            margin-bottom: 20px;
        }

        .fan-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: rotateFan 3s linear infinite;
        }

        @keyframes rotateFan {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .main-balance {
            font-size: clamp(1.8rem, 8vw, 2.5rem);
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: -1px;
        }

        .stats-badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #aaa;
            margin-top: 10px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
            flex-shrink: 0;
        }

        .btn {
            padding: 14px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .btn:active { transform: scale(0.95); }
        .btn-claim { background: #6d5dfc; color: white; }
        .btn-boost { background: #8e80ff; color: white; }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 15, 15, 0.98);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 24px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            color: #888;
            text-decoration: none;
            width: 20%;
        }

        .nav-item.active {
            color: #8e80ff;
        }

        .nav-icon {
            font-size: 1.4rem;
            margin-bottom: 2px;
        }

        .svg-icon { width: 20px; height: 20px; fill: currentColor; }

        #saveStatus {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 10px;
            color: #6d5dfc;
            opacity: 0.7;
            z-index: 200;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="saveStatus">Başlatılıyor...</div>
        <div class="content">
            <!-- Üst Bakiye Kartları -->
            <div class="balance-card">
                <div class="flex items-center">
                    <img src="ton.jpg" alt="TON" class="coin-icon" onerror="this.src='https://cryptologos.cc/logos/toncoin-ton-logo.png'">
                    <div>
                        <div class="text-[10px] uppercase tracking-wider text-gray-500">Bakiye</div>
                        <div class="font-bold text-sm" id="mainWalletBalance">0.0000000000 TON</div>
                    </div>
                </div>
                <div class="wallet-btn">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 18V19C21 20.1 20.1 21 19 21H5C3.89 21 3 20.1 3 19V5C3 3.9 3.89 3 5 3H19C20.1 3 21 3.9 21 5V6H12C10.89 6 10 6.89 10 8V16C10 17.11 10.89 18 12 18H21ZM12 16H22V8H12V16ZM16 13.5C15.17 13.5 14.5 12.83 14.5 12C14.5 11.17 15.17 10.5 16 10.5C16.83 10.5 17.5 11.17 17.5 12C17.5 12.83 16.83 13.5 16 13.5Z"/></svg>
                </div>
            </div>

            <div class="balance-card">
                <div class="flex items-center">
                    <img src="dragon.jpg" alt="TONIX" class="coin-icon" onerror="this.src='https://via.placeholder.com/32/333/fff?text=T'">
                    <div>
                        <div class="text-[10px] uppercase tracking-wider text-gray-500">Bakiye</div>
                        <div class="font-bold text-sm">0 TONIX</div>
                    </div>
                </div>
                <div class="wallet-btn">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 18V19C21 20.1 20.1 21 19 21H5C3.89 21 3 20.1 3 19V5C3 3.9 3.89 3 5 3H19C20.1 3 21 3.9 21 5V6H12C10.89 6 10 6.89 10 8V16C10 17.11 10.89 18 12 18H21ZM12 16H22V8H12V16ZM16 13.5C15.17 13.5 14.5 12.83 14.5 12C14.5 11.17 15.17 10.5 16 10.5C16.83 10.5 17.5 11.17 17.5 12C17.5 12.83 16.83 13.5 16 13.5Z"/></svg>
                </div>
            </div>

            <!-- Fan Alanı -->
            <div class="mining-section">
                <div class="fan-container">
                    <img src="fan.jpg" alt="Fan" class="fan-img" id="miningFan" onerror="this.src='https://img.freepik.com/premium-photo/3d-render-electric-fan-ventilator-blue-color-isolated-black-background_1020697-2384.jpg'">
                </div>

                <div class="main-balance" id="tonBalance">0.0000000000</div>
                <div class="text-xl font-extrabold text-white mb-2">TON</div>
                
                <div class="stats-badge">
                    <span style="font-size: 14px; opacity: 0.6;">ℹ️</span>
                    <span class="font-bold text-white">11 GH/s</span>
                    <span style="color: #ff9d00;">⚡</span>
                </div>
            </div>

            <!-- İşlem Butonları -->
            <div class="action-buttons">
                <div class="btn btn-claim" id="claimBtn">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z"/></svg>
                    Claim
                </div>
                <div class="btn btn-boost" id="boostBtn">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M13 10V3L4 14H11V21L20 10H13Z"/></svg>
                    Boost
                </div>
            </div>
        </div>

        <!-- Alt Navigasyon -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item"><span class="nav-icon">👛</span><span>Wallet</span></a>
            <a href="#" class="nav-item"><span class="nav-icon">👥</span><span>Friends</span></a>
            <a href="#" class="nav-item active"><span class="nav-icon">🏠</span><span>Home</span></a>
            <a href="#" class="nav-item"><span class="nav-icon">🎯</span><span>Missions</span></a>
            <a href="#" class="nav-item"><span class="nav-icon">⚙️</span><span>More</span></a>
        </nav>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Yapılandırması
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "",
            authDomain: "studio-9241589115-a403e.firebaseapp.com",
            projectId: "studio-9241589115-a403e",
            storageBucket: "studio-9241589115-a403e.firebasestorage.app",
            messagingSenderId: "1010284036381",
            appId: "1:1010284036381:web:cd6effcc67287c510e61f4"
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ton-miner-v1';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Değişkenler
        let currentBalance = 0.0;
        let walletBalance = 0.0;
        const incrementPerSecond = 0.11 / 86400; // Günde 0.11 TON

        const balanceElement = document.getElementById('tonBalance');
        const walletElement = document.getElementById('mainWalletBalance');
        const saveStatus = document.getElementById('saveStatus');
        const miningFan = document.getElementById('miningFan');

        // Sayaç Döngüsü (Hemen başlar)
        setInterval(() => {
            currentBalance += (incrementPerSecond / 10);
            balanceElement.textContent = currentBalance.toFixed(10);
        }, 100);

        // Auth Başlatma
        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) return;
            
            saveStatus.textContent = "Veriler yükleniyor...";
            const userDocRef = doc(db, 'artifacts', appId, 'users', user.uid, 'mining', 'data');
            
            try {
                const userDoc = await getDoc(userDocRef);
                const now = Date.now();

                if (userDoc.exists()) {
                    const data = userDoc.data();
                    walletBalance = parseFloat(data.walletBalance) || 0;
                    
                    // Mevcut bakiyeyi ve offline kazancı hesapla
                    const lastMiningBalance = parseFloat(data.currentBalance) || 0;
                    const lastUpdateTime = data.lastUpdateTime || now;
                    const secondsPassed = (now - lastUpdateTime) / 1000;
                    const offlineGain = secondsPassed * incrementPerSecond;
                    
                    currentBalance = lastMiningBalance + offlineGain;
                } else {
                    await setDoc(userDocRef, {
                        walletBalance: 0,
                        currentBalance: 0,
                        lastUpdateTime: now
                    });
                }

                saveStatus.textContent = "Bulut Senkronize";
                walletElement.textContent = walletBalance.toFixed(10) + " TON";
                
                // Kayıt Döngüsü (30 saniyede bir)
                setInterval(async () => {
                    await saveToCloud(userDocRef);
                }, 30000);

            } catch (err) {
                console.error("Depolama Hatası:", err);
                saveStatus.textContent = "Çevrimdışı Mod";
            }
        });

        async function saveToCloud(docRef) {
            if (!docRef || !auth.currentUser) return;
            try {
                await updateDoc(docRef, {
                    walletBalance: walletBalance,
                    currentBalance: currentBalance,
                    lastUpdateTime: Date.now()
                });
                saveStatus.textContent = "İlerleme Kaydedildi";
                setTimeout(() => { saveStatus.textContent = "Bulut Senkronize"; }, 2000);
            } catch (e) {
                saveStatus.textContent = "Senkronizasyon Hatası";
            }
        }

        // Buton Dinleyicileri
        document.getElementById('claimBtn').addEventListener('click', async () => {
            if (currentBalance > 0) {
                walletBalance += currentBalance;
                currentBalance = 0;
                
                walletElement.textContent = walletBalance.toFixed(10) + " TON";
                balanceElement.textContent = "0.0000000000";
                
                if (auth.currentUser) {
                    const userDocRef = doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'mining', 'data');
                    await saveToCloud(userDocRef);
                }

                // Efekt
                const btn = document.getElementById('claimBtn');
                btn.style.transform = "scale(0.9)";
                setTimeout(() => { btn.style.transform = "scale(1)"; }, 100);
            }
        });

        document.getElementById('boostBtn').addEventListener('click', () => {
            miningFan.style.animationDuration = '0.5s';
            const btn = document.getElementById('boostBtn');
            btn.style.transform = "scale(0.9)";
            setTimeout(() => {
                miningFan.style.animationDuration = '3s';
                btn.style.transform = "scale(1)";
            }, 2500);
        });

        initAuth();
    </script>
</body>
</html>
