<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejderha Dünyası - TON Mining</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #000000;
            --card-bg: #111111;
            --accent-red: #ff0015;
            --accent-gold: #ffb703;
            --text-gray: #a0a0a0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
        }

        /* Üst Bakiye Kartları */
        .balance-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            border: 1px solid rgba(255,0,21,0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .balance-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            border: 1.5px solid rgba(255,255,255,0.05);
        }

        .balance-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .wallet-btn {
            background: linear-gradient(135deg, var(--accent-red), #80000b);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 21, 0.4);
        }

        /* Fan Alanı */
        .fan-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            width: 100%;
            max-width: 400px;
        }

        .fan-image {
            width: 90%;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 25px rgba(255, 0, 21, 0.3));
        }

        /* Sayaç Alanı */
        .counter-section {
            text-align: center;
            margin-top: 10px;
        }

        .counter-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 36px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(255, 0, 21, 0.4);
        }

        .power-label {
            color: var(--accent-red);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Butonlar */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 20px;
            margin-top: auto;
            margin-bottom: 95px;
        }

        .btn-main {
            padding: 18px;
            border-radius: 16px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .btn-claim {
            background: linear-gradient(to right, #ff0015, #99000d);
            box-shadow: 0 4px 15px rgba(255, 0, 21, 0.3);
        }

        .btn-boost {
            background: #111;
            border: 2px solid var(--accent-red);
            color: var(--accent-red);
        }

        .btn-main:active { transform: scale(0.96); }

        /* Navigasyon */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 85px;
            background-color: #080808;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.03);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #666;
            font-size: 11px;
            font-weight: 600;
        }

        .nav-link.active {
            color: white;
        }

        .active-indicator {
            background: #151515;
            padding: 10px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 0, 21, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="p-5 flex flex-col h-full max-w-md mx-auto w-full">
        
        <!-- Bakiye: TON -->
        <div class="balance-card">
            <div class="flex items-center">
                <div class="balance-icon">
                    <img src="ton.jpg" alt="TON" onerror="this.src='https://cryptologos.cc/logos/toncoin-ton-logo.png'">
                </div>
                <div>
                    <p class="text-[10px] text-gray-500 uppercase font-black">TON Balance</p>
                    <h3 class="text-base font-extrabold" id="ton-balance-display">0.0000 TON</h3>
                </div>
            </div>
            <div class="wallet-btn">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="white">
                    <path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h9zm-9-2h10V8H12v8z"/>
                </svg>
            </div>
        </div>

        <!-- Bakiye: $DRAGON -->
        <div class="balance-card">
            <div class="flex items-center">
                <div class="balance-icon">
                    <img src="dragon.jpg" alt="DRAGON" onerror="this.src='https://via.placeholder.com/44/ff0015/ffffff?text=D'">
                </div>
                <div>
                    <p class="text-[10px] text-gray-500 uppercase font-black">$DRAGON Balance</p>
                    <h3 class="text-base font-extrabold" id="dragon-balance-display">0</h3>
                </div>
            </div>
            <div class="wallet-btn" style="background: #222; box-shadow: none;">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="white">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
            </div>
        </div>

        <!-- Ana Madenci Ünitesi -->
        <div class="fan-container">
            <img src="fan.jpg" class="fan-image" alt="Red Dragon Fan">
        </div>

        <!-- Sayaç -->
        <div class="counter-section">
            <div class="counter-value" id="mining-counter">0.0000000000</div>
            <div class="power-label">
                <span>DRAGON POWER</span>
                <span class="text-white">|</span>
                <span>1 GH/S</span>
                <span class="animate-pulse">🔥</span>
            </div>
        </div>

        <!-- Butonlar -->
        <div class="action-grid">
            <button class="btn-main btn-claim" onclick="window.claimRewards()">
                <span>📥</span> Claim
            </button>
            <button class="btn-main btn-boost">
                <span>🚀</span> Boost
            </button>
        </div>

    </div>

    <!-- Navigasyon -->
    <nav class="bottom-nav">
        <div class="nav-link">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h9zm-9-2h10V8H12v8z"/></svg>
            <span>Wallet</span>
        </div>
        <div class="nav-link">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3z"/></svg>
            <span>Friends</span>
        </div>
        <div class="nav-link active">
            <div class="active-indicator">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="#ff0015"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span class="text-white mt-1">Home</span>
            </div>
        </div>
        <div class="nav-link">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
            <span>Tasks</span>
        </div>
        <div class="nav-link">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            <span>More</span>
        </div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Sistem yapılandırmasını önceliklendir
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "AIzaSyBhxm1GLb_gqnMzulWFDtTGPkGFp-nPREw",
                authDomain: "asdbn-5dd38.firebaseapp.com",
                projectId: "asdbn-5dd38",
                storageBucket: "asdbn-5dd38.firebasestorage.app",
                messagingSenderId: "852532391581",
                appId: "1:852532391581:web:c864fc3aace8de0d41ee74"
            };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'asdbn-5dd38';

        // Kazanç Ayarları
        const DAILY_REWARD = 1.0;
        const REWARD_PER_SECOND = DAILY_REWARD / 86400;
        const TICK_MS = 80; 
        const REWARD_PER_TICK = REWARD_PER_SECOND / (1000 / TICK_MS);

        let currentSession = 0.0;
        let totalBalance = 0.0;
        let dragonBalance = 0;
        let userId = null;
        let lastOfflineSave = 0;

        const counterEl = document.getElementById('mining-counter');
        const displayEl = document.getElementById('ton-balance-display');
        const dragonDisplayEl = document.getElementById('dragon-balance-display');

        // Giriş Akışı
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Giriş hatası:", error);
                setTimeout(initAuth, 2000);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userId = user.uid;
                await loadData();
            } else {
                await initAuth();
            }
        });

        // Veri Yükleme ve Çevrimdışı Kazanç Hesaplama
        async function loadData() {
            if (!userId) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'gameData', 'status');
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    totalBalance = data.totalBalance || 0;
                    dragonBalance = data.dragonBalance || 0;
                    
                    // Çevrimdışı kazanç hesapla
                    if (data.updatedAt) {
                        const now = Date.now();
                        const diffInSeconds = (now - data.updatedAt) / 1000;
                        const offlineEarnings = diffInSeconds * REWARD_PER_SECOND;
                        
                        if (offlineEarnings > 0.000001) {
                            totalBalance += offlineEarnings;
                            showOfflineToast(offlineEarnings);
                        }
                    }
                    updateUI();
                }
            } catch (err) {
                console.error("Veri yüklenemedi:", err);
            }
        }

        // Veri Kaydetme (updatedAt zaman damgasını günceller)
        async function saveData() {
            if (!userId) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'gameData', 'status');
                await setDoc(docRef, {
                    totalBalance,
                    dragonBalance,
                    updatedAt: Date.now()
                }, { merge: true });
            } catch (err) {
                console.error("Veri kaydedilemedi:", err);
            }
        }

        function updateUI() {
            if (displayEl) displayEl.innerText = totalBalance.toFixed(4) + " TON";
            if (dragonDisplayEl) dragonDisplayEl.innerText = dragonBalance.toLocaleString();
        }

        // Kazım Döngüsü
        setInterval(() => {
            currentSession += REWARD_PER_TICK;
            if (counterEl) counterEl.innerText = currentSession.toFixed(10);
            
            // Her 30 saniyede bir arkaplanda otomatik kaydet (zaman damgası için)
            if (Date.now() - lastOfflineSave > 30000) {
                saveData();
                lastOfflineSave = Date.now();
            }
        }, TICK_MS);

        // Çevrimdışı Kazanç Bildirimi
        function showOfflineToast(amount) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-24 left-1/2 transform -translate-x-1/2 bg-yellow-500 text-black px-6 py-3 rounded-xl z-50 font-bold shadow-xl text-sm border-2 border-black';
            toast.innerText = 'Hoş Geldin! Sen yokken +' + amount.toFixed(6) + ' TON kazandın! 💤';
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 1s';
                setTimeout(() => toast.remove(), 1000);
            }, 5000);
        }

        // Claim İşlemi
        window.claimRewards = async function() {
            if (currentSession <= 0 || !userId) return;

            totalBalance += currentSession;
            updateUI();
            
            const toast = document.createElement('div');
            toast.className = 'fixed top-12 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-8 py-4 rounded-2xl z-50 font-black shadow-[0_0_30px_rgba(255,0,21,0.5)] border border-white/20';
            toast.innerText = '+' + currentSession.toFixed(6) + ' TON TOPLANDI! 🔥';
            document.body.appendChild(toast);
            
            currentSession = 0;
            
            await saveData();
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -20px)';
                toast.style.transition = 'all 0.4s ease';
                setTimeout(() => toast.remove(), 400);
            }, 1800);
        }
    </script>
</body>
</html>
