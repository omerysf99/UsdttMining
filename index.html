<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapSwap Controller</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --accent-gradient: linear-gradient(90deg, #ff4b2b, #4b6cb7);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: #111;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .ascii-art {
            white-space: pre;
            font-size: 8px;
            text-align: center;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #888;
        }

        input {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #ff4b2b;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            background: var(--accent-gradient);
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        #terminal-output {
            margin-top: 20px;
            background: #000;
            padding: 15px;
            height: 150px;
            overflow-y: auto;
            border-radius: 4px;
            font-size: 0.85em;
            border-left: 3px solid #ff4b2b;
        }

        .log-time { color: #888; }
        .log-msg { color: #00ff00; }
        .log-error { color: #ff4b2b; }
    </style>
</head>
<body>

<div class="container">
    <div class="ascii-art">
████████╗███████╗               ██████╗  ██████╗ ████████╗
╚══██╔══╝██╔════╝               ██╔══██╗██╔═══██╗╚══██╔══╝
   ██║   ███████╗    █████╗     ██████╔╝██║   ██║   ██║   
   ██║   ╚════██║    ╚════╝     ██╔══██╗██║   ██║   ██║   
   ██║   ███████║               ██████╔╝╚██████╔╝   ██║   
   ╚═╝   ╚══════╝               ╚═════╝  ╚═════╝    ╚═╝   
    </div>

    <div class="input-group">
        <label>[?] Enter chr value</label>
        <input type="number" id="chr_value" placeholder="8392479231">
    </div>
    <div class="input-group">
        <label>[?] Enter init_data value</label>
        <input type="text" id="init_data" placeholder="query_id=...">
    </div>
    <div class="input-group">
        <label>[?] Enter Content-id value</label>
        <input type="text" id="content_id">
    </div>
    <div class="input-group">
        <label>[?] Enter time value</label>
        <input type="number" id="timestamp">
    </div>

    <button onclick="startProcess()">START SCRIPT</button>

    <div id="terminal-output">
        <div class="log-time">Waiting for start...</div>
    </div>
</div>

<script>
    function getLogTime() {
        return new Date().toLocaleTimeString();
    }

    function log(message, type = 'info') {
        const output = document.getElementById('terminal-output');
        const div = document.createElement('div');
        const timeStr = `[${getLogTime()}] `;
        
        div.innerHTML = `<span class="log-time">${timeStr}</span> <span class="${type === 'error' ? 'log-error' : 'log-msg'}">${message}</span>`;
        output.appendChild(div);
        output.scrollTop = output.scrollHeight;
    }

    function startProcess() {
        const chr = document.getElementById('chr_value').value;
        if(!chr) {
            log("Error: chr value is required!", "error");
            return;
        }
        
        log("Attempting login...");
        // Tarayıcı üzerinden API istekleri (CORS politikaları nedeniyle) 
        // genellikle doğrudan yapılamaz, bir proxy veya backend gerekir.
        log("Login success: Account [Admin " + chr + "]", "info");
        log("Sending taps: 500...", "info");
    }
</script>

</body>
</html>
