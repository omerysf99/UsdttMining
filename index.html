<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars Miner V2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #070b10;
            --card-bg: #111a24;
            --accent-blue: #2176ff;
            --green-success: #2ecc71;
            --text-gray: #8e9aaf;
            --danger: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        /* 9:16 Aspect Ratio Container */
        .app-frame {
            width: 100vw;
            max-width: 400px;
            height: calc(400px * 16 / 9);
            max-height: 100vh;
            background: linear-gradient(180deg, #0f172a 0%, #050a0f 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid #1e293b;
            position: relative;
        }

        /* Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            align-items: center;
        }

        .balance-box {
            background: rgba(255,255,255,0.05);
            padding: 10px 15px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            font-weight: bold;
        }

        .balance-box span { color: var(--green-success); }

        /* Miner Section */
        .miner-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .machine-card {
            background: rgba(255,255,255,0.02);
            width: 100%;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(33, 118, 255, 0.2);
            margin-bottom: 20px;
        }

        .machine-img {
            width: 150px;
            filter: drop-shadow(0 0 20px var(--accent-blue));
            margin-bottom: 20px;
        }

        .timer {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, #2176ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Stats & Actions */
        .action-area {
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
        }

        .stat-label { color: var(--text-gray); font-size: 0.9rem; margin-bottom: 5px; }

        .hash-input {
            background: #0a0f16;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.5rem;
            text-align: center;
            border: 1px solid #1e293b;
            margin-bottom: 15px;
        }

        .btn-sell {
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            border: none;
            background: var(--green-success);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-sell:disabled { background: #2c3e50; cursor: not-allowed; }

        .info-text {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-top: 10px;
        }

        /* Nav Bar */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            background: var(--card-bg);
            border-top: 1px solid #1e293b;
        }

        .nav-btn { text-align: center; color: var(--text-gray); font-size: 0.7rem; }
        .nav-btn.active { color: white; }
        .nav-btn i { display: block; font-size: 1.4rem; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="app-frame">
    <div class="top-bar">
        <div class="balance-box">
            <i class="fas fa-coins" style="color: #f1c40f;"></i> 
            <span id="usd-balance">0.00</span> USD
        </div>
        <i class="fas fa-cog" style="font-size: 1.5rem; color: var(--text-gray);"></i>
    </div>

    <div class="miner-display">
        <div class="machine-card">
            <img src="https://cdn-icons-png.flaticon.com/512/3665/3665923.png" class="machine-img" alt="Miner">
            <div class="timer" id="timer">12:00:00</div>
            <p style="color: var(--accent-blue); margin-top: 10px; font-size: 0.8rem;">ÜCRETSİZ MADENCİ AKTİF</p>
        </div>
    </div>

    <div class="action-area">
        <div class="stat-label">Madenlenen Toplam Hash</div>
        <div class="hash-input" id="hash-count">1009.00</div>
        
        <button class="btn-sell" id="sell-btn" onclick="sellHash()">
            <i class="fas fa-exchange-alt"></i> HASH'LERİ SAT
        </button>
        
        <p class="info-text">Min Satış: 1009 Hash | 100 Hash = 0.01$</p>
        <p class="info-text" style="color: var(--accent-blue);">Üretim Hızı: 30dk / 1 Hash</p>
    </div>

    <div style="text-align: center; padding: 10px; font-size: 0.7rem; color: #334155;">@Stars_Miner_bot</div>

    <nav class="bottom-nav">
        <div class="nav-btn"><i class="fas fa-bolt"></i>Yükselt</div>
        <div class="nav-btn"><i class="fas fa-gift"></i>Kazan</div>
        <div class="nav-btn active"><i class="fas fa-hammer"></i>Madenci</div>
        <div class="nav-btn"><i class="fas fa-tasks"></i>Görev</div>
        <div class="nav-btn"><i class="fas fa-wallet"></i>Ödeme</div>
    </nav>
</div>

<script>
    let currentHash = 1009.00;
    let balance = 0.00;

    function sellHash() {
        if (currentHash >= 1009) {
            // Hesaplama: 100 hash = 0.01$ ise 1 hash = 0.0001$
            let earnedUSD = currentHash * 0.0001;
            balance += earnedUSD;
            
            // UI Güncelleme
            document.getElementById('usd-balance').innerText = balance.toFixed(4);
            currentHash = 0;
            document.getElementById('hash-count').innerText = "0.00";
            
            alert("Başarıyla satıldı! Kazanç: $" + earnedUSD.toFixed(4));
            checkLimit();
        }
    }

    function checkLimit() {
        const btn = document.getElementById('sell-btn');
        if (currentHash < 1009) {
            btn.disabled = true;
            btn.style.opacity = "0.5";
        }
    }

    // Sayfa yüklendiğinde kontrol et
    checkLimit();
</script>

</body>
</html>
