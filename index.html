<!DOCTYPE html>
<!-- 
  ================================================================
  PROJE: TON Madencilik Uygulaması (Mining App)
  SÜRÜM: 5.2.0
  GÜNCELLEME: Dinamik Navigasyon Görsel Sorunu Kesin Çözüm
  ================================================================
-->
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TON Mining App | Canvas Professional</title>

    <!-- Tailwind CSS ve Font Entegrasyonu -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* GÖRSEL DEĞİŞKENLER VE TEMEL STİLLER 
        */
        :root {
            --primary-purple: #7c66e3;
            --primary-dark: #0b0b0b;
            --accent-blue: #0088cc;
            --glass-bg: #121212;
            --border-color: #1f1f1f;
            --font-main: 'Inter', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--primary-dark);
            color: white;
            user-select: none;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* MOBİL UYUMLU ANA KONTEYNIR (9:18 ORANI) 
        */
        .app-container {
            width: 100%;
            max-width: 380px; 
            aspect-ratio: 9 / 18;
            background-color: #000;
            display: flex;
            flex-direction: column;
            position: relative;
            max-height: 98vh;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 1);
        }

        /* ANİMASYONLAR 
        */
        @keyframes rotate-fan {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .fan-animation {
            animation: rotate-fan 8s linear infinite;
        }

        .fan-animation.boosted {
            animation-duration: 2s;
        }

        /* TASARIM BİLEŞENLERİ 
        */
        .glass-card {
            background-color: var(--glass-bg);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .btn-purple {
            background-color: var(--primary-purple);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(124, 102, 227, 0.15);
        }
        
        .btn-purple:active {
            transform: scale(0.92);
            background-color: #6b56d2;
        }

        /* DİNAMİK NAVİGASYON (FOOTER) 
        */
        #dynamic-footer {
            background-image: url('navi.jpg'); /* Varsayılan */
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            flex-shrink: 0;
            position: relative;
            background-color: #121212;
            border-top: 1px solid var(--border-color);
            z-index: 100;
            transition: background-image 0.1s ease; /* Daha hızlı geçiş */
        }

        /* Görünmez Tıklama Alanları */
        .nav-item {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            z-index: 110;
        }

        /* SAYI VE METİN FORMATLARI 
        */
        .counter-text {
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.04em;
        }

        @keyframes balance-glow {
            0% { border-color: var(--border-color); }
            50% { border-color: var(--accent-blue); box-shadow: 0 0 15px rgba(0, 136, 204, 0.3); }
            100% { border-color: var(--border-color); }
        }

        .balance-update {
            animation: balance-glow 0.6s ease-out;
        }

        /* İÇERİK SAYFALARI 
        */
        .view-content {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 1.5rem;
            animation: viewFadeIn 0.3s ease-out;
            overflow-y: auto;
        }

        .view-content.active {
            display: flex;
        }

        @keyframes viewFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- ÜST PANEL -->
        <header class="p-4 space-y-3 z-50 bg-black/60 backdrop-blur-xl">
            <!-- TON Bakiye -->
            <div class="glass-card p-3.5 flex items-center justify-between" id="ton-card">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-full overflow-hidden border border-blue-500/20 flex items-center justify-center bg-black">
                        <img src="ton.jpg" alt="TON" class="w-full h-full object-cover" onerror="this.src='https://cryptologos.cc/logos/toncoin-ton-logo.png'">
                    </div>
                    <div>
                        <p class="text-[10px] text-gray-500 font-black uppercase tracking-widest leading-none mb-1">Balance</p>
                        <p class="font-bold text-sm tracking-wide" id="total-ton-header">0 TON</p>
                    </div>
                </div>
                <div class="bg-[#1a1a1a] p-2.5 rounded-xl text-gray-400 border border-white/5">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256">
                        <path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Z"></path>
                    </svg>
                </div>
            </div>

            <!-- TONIX Bakiye -->
            <div class="glass-card p-3.5 flex items-center justify-between">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-full overflow-hidden border border-purple-500/20 flex items-center justify-center bg-black">
                        <img src="dragon.jpg" alt="TONIX" class="w-8 h-8 object-cover" onerror="this.src='https://cdn-icons-png.flaticon.com/512/10668/10668045.png'">
                    </div>
                    <div>
                        <p class="text-[10px] text-gray-500 font-black uppercase tracking-widest leading-none mb-1">Balance</p>
                        <p class="font-bold text-sm tracking-wide">1200 TONIX</p>
                    </div>
                </div>
                <div class="bg-[#1a1a1a] p-2.5 rounded-xl text-gray-400 border border-white/5">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256">
                        <path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Z"></path>
                    </svg>
                </div>
            </div>
        </header>

        <!-- ANA İÇERİK -->
        <div class="flex-1 relative overflow-hidden">
            
            <!-- HOME -->
            <section id="view-home" class="view-content active h-full flex flex-col items-center justify-around py-4">
                <div class="relative w-64 h-64 overflow-hidden rounded-full border border-white/10 shadow-2xl">
                    <div class="absolute inset-0 bg-blue-500/5 blur-[70px] rounded-full"></div>
                    <div id="main-fan" class="fan-animation w-full h-full relative z-10">
                        <img src="fan.jpg" alt="Fan" class="w-full h-full object-cover" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3593/3593672.png'">
                    </div>
                </div>

                <div class="text-center relative">
                    <h1 id="mining-counter" class="text-3xl font-black counter-text mb-2 tracking-tighter">0.0000000000 TON</h1>
                    <div class="inline-flex items-center gap-2 text-gray-500 bg-white/5 py-1.5 px-6 rounded-full border border-white/5 shadow-inner">
                        <span class="text-xs">ℹ️</span>
                        <span class="text-sm font-bold tracking-widest"><span id="ghs-value">6</span> GH/s</span>
                        <span class="text-orange-500 text-sm animate-pulse">⚡</span>
                    </div>
                </div>

                <div class="flex gap-4 w-full px-2">
                    <button id="btn-claim" class="btn-purple flex-1 py-4 rounded-2xl gap-2 shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="white" viewBox="0 0 256 256">
                            <path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Z"></path>
                        </svg>
                        <span class="text-xs font-black uppercase tracking-tighter">Topla</span>
                    </button>
                    <button id="btn-boost" class="btn-purple flex-1 py-4 rounded-2xl gap-2 shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="white" viewBox="0 0 256 256">
                            <path d="M213.66,122.34l-96-96a8,8,0,0,0-11.32,11.32L200.69,128,106.34,222.34a8,8,0,0,0,11.32,11.32l96-96A8,8,0,0,0,213.66,122.34Z"></path>
                        </svg>
                        <span class="text-xs font-black uppercase tracking-tighter">Hızlandır</span>
                    </button>
                </div>
            </section>

            <!-- WALLET -->
            <section id="view-wallet" class="view-content h-full no-scrollbar">
                <h2 class="text-2xl font-black mb-6">Cüzdan</h2>
                <div class="space-y-4">
                    <div class="glass-card p-6 bg-gradient-to-br from-indigo-900/30 to-transparent">
                        <p class="text-gray-500 text-[10px] font-black uppercase mb-1">Portföy Değeri</p>
                        <p class="text-3xl font-black text-white">$ 0.00</p>
                    </div>
                </div>
            </section>

            <!-- FRIENDS -->
            <section id="view-friends" class="view-content h-full no-scrollbar text-center justify-center">
                <h2 class="text-2xl font-black mb-2">Arkadaşlarını Çağır</h2>
                <p class="text-gray-500 text-sm mb-10 px-4">Her arkadaşın için kazım hızına kalıcı <span class="text-white font-bold">+1 GH/s</span> ekle.</p>
                <button class="btn-purple w-full py-4 rounded-xl text-sm font-black">DAVET LİNKİNİ KOPYALA</button>
            </section>

            <!-- MISSIONS -->
            <section id="view-missions" class="view-content h-full no-scrollbar">
                <h2 class="text-2xl font-black mb-6">Görev Merkezi</h2>
                <div class="space-y-3.5">
                    <div class="glass-card p-4 flex justify-between items-center border-l-4 border-blue-500 bg-blue-500/5">
                        <p class="font-black text-sm text-gray-200">Kanalımızı Takip Et</p>
                        <button class="bg-blue-500 text-white px-4 py-2 rounded-xl text-[10px] font-black">KATIL</button>
                    </div>
                </div>
            </section>

            <!-- MORE -->
            <section id="view-more" class="view-content h-full no-scrollbar">
                <h2 class="text-2xl font-black mb-6">Seçenekler</h2>
                <div class="space-y-2">
                    <div class="glass-card p-4 flex justify-between items-center">
                        <span class="text-sm font-bold text-gray-300">Profil Ayarları</span>
                        <span class="text-indigo-500">→</span>
                    </div>
                </div>
            </section>

        </div>

        <!-- DİNAMİK NAVİGASYON -->
        <footer id="dynamic-footer">
            <button onclick="switchTab('wallet')" class="nav-item"></button>
            <button onclick="switchTab('friends')" class="nav-item"></button>
            <button onclick="switchTab('home')" class="nav-item"></button>
            <button onclick="switchTab('missions')" class="nav-item"></button>
            <button onclick="switchTab('more')" class="nav-item"></button>
        </footer>

        <!-- TOAST BİLDİRİMİ -->
        <div id="toast" class="absolute bottom-28 left-1/2 -translate-x-1/2 bg-[#1a1a1a]/95 border border-white/10 px-8 py-3 rounded-2xl text-[11px] font-black opacity-0 transition-all duration-300 shadow-2xl z-[200] pointer-events-none scale-75 backdrop-blur-md">
            Aktarıldı!
        </div>

    </div>

    <script>
        /**
         * UYGULAMA DURUMU
         */
        const appState = {
            minedAmount: 0.0000000000,
            totalBalance: 0,
            hashrate: 6,
            isBoosted: false,
            boostDuration: 5000,
            // Navigasyon görselleri eşleşmesi
            navImages: {
                home: 'navi.jpg',
                wallet: 'naviwallet.jpg',
                friends: 'navifriends.jpg',
                missions: 'navimissions.jpg',
                more: 'navimore.jpg'
            }
        };

        const dom = {
            counter: document.getElementById('mining-counter'),
            ghs: document.getElementById('ghs-value'),
            fan: document.getElementById('main-fan'),
            toast: document.getElementById('toast'),
            headerBalance: document.getElementById('total-ton-header'),
            footer: document.getElementById('dynamic-footer'),
            tonCard: document.getElementById('ton-card'),
            sections: {
                home: document.getElementById('view-home'),
                wallet: document.getElementById('view-wallet'),
                friends: document.getElementById('view-friends'),
                missions: document.getElementById('view-missions'),
                more: document.getElementById('view-more')
            }
        };

        // Rakam formatlayıcı (Örn: 0.01)
        const formatTON = (val) => {
            if (val === 0) return "0";
            return val.toFixed(8).replace(/\.?0+$/, "");
        };

        // Bildirim göster (Aktarıldı X ton)
        const showNotify = (msg) => {
            dom.toast.innerText = msg;
            dom.toast.style.opacity = "1";
            dom.toast.style.transform = "translateX(-50%) translateY(-15px) scale(1)";
            setTimeout(() => {
                dom.toast.style.opacity = "0";
                dom.toast.style.transform = "translateX(-50%) translateY(0px) scale(0.75)";
            }, 2500);
        };

        // Madencilik motoru
        setInterval(() => {
            const gain = (appState.hashrate * 0.0000000045) + (Math.random() * 0.0000000005);
            appState.minedAmount += gain;
            if (dom.counter) dom.counter.innerText = appState.minedAmount.toFixed(10) + " TON";
        }, 100);

        // Claim İşlemi
        const handleClaim = () => {
            if (appState.minedAmount > 0.0000000001) {
                const collected = appState.minedAmount;
                appState.totalBalance += collected;
                dom.headerBalance.innerText = formatTON(appState.totalBalance) + " TON";
                
                showNotify("Aktarıldı " + formatTON(collected) + " ton");

                appState.minedAmount = 0;
                dom.counter.innerText = "0.0000000000 TON";

                dom.tonCard.classList.remove('balance-update');
                void dom.tonCard.offsetWidth; 
                dom.tonCard.classList.add('balance-update');
            }
        };

        // Boost İşlemi
        const handleBoost = () => {
            if (appState.isBoosted) return;
            appState.isBoosted = true;
            appState.hashrate *= 2;
            dom.ghs.innerText = appState.hashrate;
            dom.fan.classList.add('boosted');
            showNotify("Boost Aktif! 🚀");
            setTimeout(() => {
                appState.isBoosted = false;
                appState.hashrate /= 2;
                dom.ghs.innerText = appState.hashrate;
                dom.fan.classList.remove('boosted');
            }, appState.boostDuration);
        };

        /**
         * SEKMELER ARASI GEÇİŞ (DYNAMIC NAV FIXED)
         */
        window.switchTab = (tabID) => {
            // 1. İçerikleri yönet
            Object.keys(dom.sections).forEach(key => {
                dom.sections[key].classList.remove('active');
            });
            const target = dom.sections[tabID];
            if (target) target.classList.add('active');

            // 2. Navigasyon görselini yönet (Hızlı Değişim)
            const imgName = appState.navImages[tabID];
            if (imgName) {
                // Doğrudan stil ataması ile görseli güncelle
                const footerEl = document.getElementById('dynamic-footer');
                footerEl.style.backgroundImage = "url('" + imgName + "')";
            }
        };

        document.getElementById('btn-claim').addEventListener('click', handleClaim);
        document.getElementById('btn-boost').addEventListener('click', handleBoost);
    </script>
</body>
</html>
