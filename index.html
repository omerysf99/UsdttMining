<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Mining App</title>

    <!-- Stil ve Yazı Tipi Kaynakları -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Temel Uygulama Tasarımı */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0b;
            color: white;
            user-select: none;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 9:18 Mobil En-Boy Oranı */
        .app-container {
            width: 100%;
            max-width: 380px; 
            aspect-ratio: 9 / 18;
            background-color: #000;
            display: flex;
            flex-direction: column;
            position: relative;
            max-height: 98vh;
            overflow: hidden;
            border: 1px solid #1a1a1a;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        /* Madencilik Fanı Animasyonu */
        @keyframes rotate-fan {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .fan-animation {
            animation: rotate-fan 8s linear infinite;
        }

        .fan-animation.boosted {
            animation-duration: 2s;
        }

        /* Kart Stilleri */
        .glass-card {
            background-color: #121212;
            border-radius: 20px;
            border: 1px solid #1f1f1f;
            transition: all 0.3s ease;
        }

        /* Mor Buton Teması */
        .btn-purple {
            background-color: #7c66e3;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
        }
        
        .btn-purple:active {
            transform: scale(0.92);
            background-color: #6b56d2;
        }

        /* Alt Menü (Görsel Tabanlı) */
        .nav-footer {
            background-image: url('navi.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            flex-shrink: 0;
            position: relative;
            background-color: #121212;
            border-top: 1px solid #1f1f1f;
        }

        .nav-item {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            z-index: 10;
        }

        /* Sayı Gösterim Formatı */
        .counter-text {
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        /* GELİŞTİRİLMİŞ TON PARÇACIK ANİMASYONU (3 Saniye) */
        @keyframes coin-flow {
            0% { 
                transform: translate(0, 0) scale(0) rotate(0deg); 
                opacity: 0; 
            }
            10% {
                transform: translate(var(--pop-x), var(--pop-y)) scale(1.1) rotate(45deg);
                opacity: 1;
            }
            25% {
                transform: translate(var(--pop-x), calc(var(--pop-y) - 20px)) scale(1.2) rotate(90deg);
                opacity: 1;
            }
            100% { 
                transform: translate(var(--dest-x), var(--dest-y)) scale(0.4) rotate(720deg); 
                opacity: 0.1; 
            }
        }

        .ton-particle {
            position: absolute;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-image: url('https://cryptologos.cc/logos/toncoin-ton-logo.png');
            background-size: 75%;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0088cc;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.6), inset 0 0 4px rgba(255,255,255,0.4);
            /* Animasyon Ayarı */
            animation: coin-flow 3s forwards cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        /* Bakiye Güncelleme Parlaması */
        @keyframes balance-glow {
            0% { border-color: #1f1f1f; box-shadow: none; }
            50% { border-color: #0088cc; box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); }
            100% { border-color: #1f1f1f; box-shadow: none; }
        }

        .balance-update {
            animation: balance-glow 0.6s ease-out;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Üst Bölüm: Bakiyeler -->
        <header class="p-4 space-y-3">
            <!-- TON Cüzdan Kartı -->
            <div class="glass-card p-3 flex items-center justify-between" id="ton-card">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full overflow-hidden border border-blue-500/20 flex items-center justify-center bg-black">
                        <img src="ton.jpg" alt="TON" class="w-full h-full object-cover" onerror="this.src='https://cryptologos.cc/logos/toncoin-ton-logo.png'">
                    </div>
                    <div>
                        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Balance</p>
                        <p class="font-bold text-sm tracking-wide" id="total-ton-header">0 TON</p>
                    </div>
                </div>
                <div class="bg-[#1a1a1a] p-2 rounded-xl text-gray-400 border border-white/5">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256">
                        <path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Z"></path>
                    </svg>
                </div>
            </div>

            <!-- TONIX Kartı -->
            <div class="glass-card p-3 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full overflow-hidden border border-blue-400/20 flex items-center justify-center bg-[#1a1a1a]">
                        <img src="dragon.jpg" alt="TONIX" class="w-full h-full object-cover" onerror="this.src='https://cdn-icons-png.flaticon.com/512/10668/10668045.png'">
                    </div>
                    <div>
                        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Balance</p>
                        <p class="font-bold text-sm tracking-wide">0 TONIX</p>
                    </div>
                </div>
                <div class="bg-[#1a1a1a] p-2 rounded-xl text-gray-400 border border-white/5">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256">
                        <path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Z"></path>
                    </svg>
                </div>
            </div>
        </header>

        <!-- Ana Madencilik Alanı -->
        <main id="view-home" class="flex-1 flex flex-col items-center justify-around px-6 py-4">
            
            <!-- Merkezi Dönen Fan -->
            <div class="relative w-64 h-64 overflow-hidden rounded-full border border-white/10 shadow-2xl">
                <div class="absolute inset-0 bg-blue-500/5 blur-[50px] rounded-full"></div>
                <div id="main-fan" class="fan-animation w-full h-full relative z-10">
                    <img src="fan.jpg" alt="Mining Fan" class="w-full h-full object-cover" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3593/3593672.png'">
                </div>
            </div>

            <!-- Sayaç ve Hız Göstergesi -->
            <div class="text-center relative">
                <h1 id="mining-counter" class="text-3xl font-bold counter-text mb-2 tracking-tight">0.0000000000 TON</h1>
                <div class="inline-flex items-center gap-2 text-gray-500 bg-white/5 py-1 px-4 rounded-full border border-white/5">
                    <span class="text-xs">ℹ️</span>
                    <span class="text-sm font-semibold"><span id="ghs-value">6</span> GH/s</span>
                    <span class="text-orange-500 text-sm">⚡</span>
                </div>
            </div>

            <!-- Ana Butonlar -->
            <div class="flex gap-4 w-full px-2">
                <button onclick="claimMining()" class="btn-purple flex-1 py-4 rounded-2xl shadow-lg shadow-indigo-500/10 gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="white" viewBox="0 0 256 256"><path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Z"></path></svg>
                    <span>Topla</span>
                </button>
                <button onclick="boostMining()" class="btn-purple flex-1 py-4 rounded-2xl shadow-lg shadow-indigo-500/10 gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="white" viewBox="0 0 256 256"><path d="M213.66,122.34l-96-96a8,8,0,0,0-11.32,11.32L200.69,128,106.34,222.34a8,8,0,0,0,11.32,11.32l96-96A8,8,0,0,0,213.66,122.34Z"></path></svg>
                    <span>Hızlandır</span>
                </button>
            </div>
        </main>

        <!-- Navigasyon Çubuğu -->
        <footer class="nav-footer">
            <button onclick="switchTab('wallet', this)" class="nav-item"></button>
            <button onclick="switchTab('friends', this)" class="nav-item"></button>
            <button onclick="switchTab('home', this)" class="nav-item"></button>
            <button onclick="switchTab('missions', this)" class="nav-item"></button>
            <button onclick="switchTab('more', this)" class="nav-item"></button>
        </footer>

        <!-- Toast Bildirimi -->
        <div id="toast" class="absolute bottom-28 left-1/2 -translate-x-1/2 bg-[#1a1a1a] border border-white/10 px-6 py-2 rounded-2xl text-xs font-bold opacity-0 transition-all duration-300 shadow-2xl z-50">
            Toplandı!
        </div>
    </div>

    <!-- Uygulama Mantığı -->
    <script>
        let minedAmount = 0.0000000000;
        let totalBalance = 0;
        let hashrate = 6;
        let isBoosted = false;

        const counterEl = document.getElementById('mining-counter');
        const ghsEl = document.getElementById('ghs-value');
        const fanContainer = document.getElementById('main-fan');
        const toastEl = document.getElementById('toast');
        const headerBalanceEl = document.getElementById('total-ton-header');
        const appContainer = document.querySelector('.app-container');
        const tonCard = document.getElementById('ton-card');

        // Madencilik Sayaç Döngüsü
        function updateMining() {
            const increment = (hashrate * 0.0000000045) + (Math.random() * 0.0000000005);
            minedAmount += increment;
            counterEl.innerText = minedAmount.toFixed(10) + " TON";
        }

        setInterval(updateMining, 100);

        /**
         * Toplama (Claim) Fonksiyonu
         * Parçacıkları fırlatır ve 3 saniye sonra bakiyeyi günceller.
         */
        function claimMining() {
            if (minedAmount > 0.0000000001) {
                const amountToClaim = minedAmount;
                minedAmount = 0;
                counterEl.innerText = "0.0000000000 TON";

                // 15 parçacıklı yoğun akış
                const particleCount = 15;
                for (let i = 0; i < particleCount; i++) {
                    setTimeout(() => {
                        createTonParticle();
                    }, i * 60);
                }

                // 3 saniyelik animasyonun bitişine yakın bakiye güncellemesi
                setTimeout(() => {
                    updateTotalBalance(amountToClaim);
                }, 2700);

                showToast("Toplanıyor... ⚡");
            }
        }

        /**
         * TON Parçacığı Oluşturma
         * Dinamik pozisyon hesaplaması yapar.
         */
        function createTonParticle() {
            const particle = document.createElement('div');
            particle.className = 'ton-particle';
            
            const startRect = counterEl.getBoundingClientRect();
            const containerRect = appContainer.getBoundingClientRect();
            
            const startX = startRect.left - containerRect.left + (startRect.width / 2) - 14;
            const startY = startRect.top - containerRect.top;
            
            const targetRect = tonCard.getBoundingClientRect();
            const destX = (targetRect.left - containerRect.left + 30) - startX;
            const destY = (targetRect.top - containerRect.top + 25) - startY;

            // Fıskiye Patlama Efekti (Rastgele sıçrama)
            const popX = (Math.random() - 0.5) * 120;
            const popY = -40 - (Math.random() * 60);

            particle.style.left = startX + 'px';
            particle.style.top = startY + 'px';
            particle.style.setProperty('--pop-x', `${popX}px`);
            particle.style.setProperty('--pop-y', `${popY}px`);
            particle.style.setProperty('--dest-x', `${destX}px`);
            particle.style.setProperty('--dest-y', `${destY}px`);

            appContainer.appendChild(particle);
            
            // Animasyon tamamlandığında DOM'dan kaldır
            setTimeout(() => {
                particle.remove();
            }, 3100);
        }

        // Bakiye formatlama (Gereksiz sıfırları siler)
        function formatTONBalance(num) {
            if (num === 0) return "0";
            return num.toFixed(8).replace(/\.?0+$/, "");
        }

        // Ana Bakiyeyi Güncelleme
        function updateTotalBalance(amount) {
            totalBalance += amount;
            headerBalanceEl.innerText = formatTONBalance(totalBalance) + " TON";
            
            // Kart üzerinde görsel geri bildirim
            tonCard.classList.remove('balance-update');
            void tonCard.offsetWidth; 
            tonCard.classList.add('balance-update');
            
            showToast("Bakiyeye eklendi! 💰");
        }

        // Hızlandırma Fonksiyonu
        function boostMining() {
            if (isBoosted) return;
            isBoosted = true;
            hashrate *= 2;
            ghsEl.innerText = hashrate;
            fanContainer.classList.add('boosted');
            showToast("Hızlandırma Aktif! 🚀");
            
            setTimeout(() => {
                isBoosted = false;
                hashrate /= 2;
                ghsEl.innerText = hashrate;
                fanContainer.classList.remove('boosted');
            }, 5000);
        }

        // Bildirim Kutusu
        function showToast(message) {
            toastEl.innerText = message;
            toastEl.style.opacity = "1";
            toastEl.style.bottom = "120px";
            setTimeout(() => {
                toastEl.style.opacity = "0";
                toastEl.style.bottom = "100px";
            }, 2000);
        }

        function switchTab(tab, element) {
            console.log("Navigasyon: " + tab);
        }
    </script>
</body>
</html>
