<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase SMS Doğrulama</title>
</head>
<body>

    <h2>Firebase SMS Doğrulama</h2>

    <div id="phone-container">
        <input type="text" id="phoneNumber" placeholder="+905551234567">
        <button onclick="sendOTP()">Kod Gönder</button>
    </div>

    <div id="recaptcha-container"></div>

    <div id="verification-container" style="display:none; margin-top: 20px;">
        <input type="text" id="verificationCode" placeholder="Gelen Kodu Girin">
        <button onclick="verifyOTP()">Kodu Onayla</button>
    </div>

    <p id="status"></p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Sizin Config Bilgileriniz
        const firebaseConfig = {
            apiKey: "AIzaSyDoJmNT86J_GoBUG-X2TrGOHPtK258kaBM",
            authDomain: "aaa123-468db.firebaseapp.com",
            projectId: "aaa123-468db",
            storageBucket: "aaa123-468db.firebasestorage.app",
            messagingSenderId: "277639579187",
            appId: "1:277639579187:web:f51052399a8d44f2308546",
            measurementId: "G-8HXRVPPNHR"
        };

        // Firebase Başlat
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        auth.languageCode = 'tr'; // SMS dilini Türkçe yap

        // ReCaptcha Kurulumu
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
            'size': 'normal',
            'callback': (response) => {
                console.log("ReCaptcha tamamlandı.");
            }
        });

        // SMS Gönderme Fonksiyonu
        window.sendOTP = function() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            const appVerifier = window.recaptchaVerifier;

            signInWithPhoneNumber(auth, phoneNumber, appVerifier)
                .then((confirmationResult) => {
                    window.confirmationResult = confirmationResult;
                    document.getElementById('verification-container').style.display = 'block';
                    document.getElementById('status').innerText = "Kod gönderildi!";
                }).catch((error) => {
                    console.error("Hata:", error);
                    document.getElementById('status').innerText = "Hata: " + error.message;
                });
        }

        // Kodu Doğrulama Fonksiyonu
        window.verifyOTP = function() {
            const code = document.getElementById('verificationCode').value;
            
            confirmationResult.confirm(code).then((result) => {
                const user = result.user;
                document.getElementById('status').innerText = "Giriş Başarılı! Kullanıcı ID: " + user.uid;
            }).catch((error) => {
                document.getElementById('status').innerText = "Hatalı Kod!";
            });
        }
    </script>
</body>
</html>
