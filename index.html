<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Miner 3D - Fan Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            margin: 0;
            user-select: none;
            touch-action: manipulation;
        }

        .sci-fi-border {
            border: 2px solid #1e293b;
            position: relative;
            background: rgba(15, 23, 42, 0.8);
            clip-path: polygon(10% 0, 90% 0, 100% 20%, 100% 80%, 90% 100%, 10% 100%, 0 80%, 0 20%);
        }

        .sci-fi-border::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 1px solid #38bdf8;
            opacity: 0.3;
            pointer-events: none;
        }

        .glow-text {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
        }

        /* Gelişmiş Bar Tasarımı */
        .energy-bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            filter: drop-shadow(0 0 8px rgba(0,0,0,0.5));
        }

        .energy-bar-container {
            width: 16px;
            height: 220px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        /* Çentikli Görünüm Maskesi */
        .bar-segments {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(to bottom, transparent 70%, rgba(2, 6, 23, 0.8) 70%);
            background-size: 100% 6px; /* Her segment boyutu */
            z-index: 10;
            pointer-events: none;
        }

        .energy-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            transition: height 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: linear-gradient(to top, #0284c7, #38bdf8, #bae6fd);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }

        .limit-fill {
            background: linear-gradient(to top, #ea580c, #fbbf24, #fef3c7);
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.6);
        }

        .bar-icon {
            font-size: 14px;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 5px currentColor);
        }

        .canvas-container {
            width: 100%;
            height: 350px;
            position: relative;
        }

        .tap-effect {
            position: absolute;
            color: #38bdf8;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            font-family: 'Orbitron', sans-serif;
            z-index: 50;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        .btn-blue {
            background: linear-gradient(135deg, #1e40af 0%, #0369a1 100%);
            box-shadow: 0 0 15px rgba(3, 105, 161, 0.5);
            transition: all 0.2s;
        }
        .btn-blue:active { transform: scale(0.95); filter: brightness(1.2); }

        .btn-gray {
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .nav-icon {
            color: #64748b;
            font-size: 1.5rem;
            transition: color 0.3s;
        }
        .nav-icon.active {
            color: #38bdf8;
            filter: drop-shadow(0 0 5px #38bdf8);
        }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto relative border-x border-slate-800">

    <!-- Üst İstatistik Paneli -->
    <div class="grid grid-cols-2 gap-4 p-4 mt-2">
        <div class="sci-fi-border p-2 text-center">
            <div class="text-[10px] text-slate-400 uppercase tracking-tighter">Pasif madencilik</div>
            <div class="text-sky-400 font-bold text-sm">+0.05</div>
            <div class="text-[10px] text-slate-500">USDT / gün</div>
        </div>
        <div class="sci-fi-border p-2 text-center">
            <div class="text-[10px] text-slate-400 uppercase tracking-tighter">Tap getirisi</div>
            <div class="text-sky-400 font-bold text-sm">+0.000250</div>
            <div class="text-[10px] text-slate-500">USDT</div>
        </div>
    </div>

    <!-- Ana Bakiye -->
    <div class="text-center mt-6">
        <h1 id="balance" class="text-4xl font-bold orbitron glow-text tracking-widest">0.000000</h1>
        <span class="text-sky-400 font-bold ml-1">USDT</span>
        <p class="text-[11px] text-slate-500 mt-2 uppercase tracking-widest">Günlük tıklama limitine dikkat edin</p>
    </div>

    <!-- 3D Alan ve Enerji -->
    <div class="flex-grow flex items-center justify-center relative px-4">
        
        <!-- Geliştirilmiş Sol Enerji Barı -->
        <div class="energy-bar-wrapper">
            <i class="fas fa-bolt bar-icon text-sky-400"></i>
            <div class="energy-bar-container">
                <div id="energy-fill-left" class="energy-fill" style="height: 100%;"></div>
                <div class="bar-segments"></div>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-[9px] text-slate-500 uppercase font-bold">Enerji</span>
                <span class="text-[11px] text-sky-400 font-bold" id="energy-text">100/100</span>
            </div>
        </div>

        <!-- 3D Nesne Alanı -->
        <div id="canvas-container" class="canvas-container cursor-pointer">
            <!-- Three.js buraya render edilecek -->
        </div>

        <!-- Geliştirilmiş Sağ Günlük Limit Barı -->
        <div class="energy-bar-wrapper">
            <i class="fas fa-crosshairs bar-icon text-orange-400"></i>
            <div class="energy-bar-container" style="border-color: rgba(249, 115, 22, 0.2);">
                <div id="limit-fill-right" class="energy-fill limit-fill" style="height: 100%;"></div>
                <div class="bar-segments"></div>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-[9px] text-slate-500 uppercase font-bold">Limit</span>
                <span class="text-[11px] text-orange-400 font-bold" id="limit-text">2500/2500</span>
            </div>
        </div>
    </div>

    <!-- Butonlar -->
    <div class="flex gap-4 px-4 mb-6">
        <button class="flex-1 py-4 rounded-xl btn-blue font-bold uppercase tracking-widest text-sm">Modül Satın Al</button>
        <button class="flex-1 py-4 rounded-xl btn-gray font-bold uppercase tracking-widest text-sm">Çek</button>
    </div>

    <!-- Alt Navigasyon -->
    <div class="bg-slate-900/80 border-t border-slate-800 p-4 flex justify-between items-center rounded-t-3xl">
        <i class="fas fa-th-large nav-icon active"></i>
        <i class="fas fa-wallet nav-icon"></i>
        <i class="fas fa-microchip nav-icon"></i>
        <i class="fas fa-users nav-icon"></i>
        <i class="fas fa-newspaper nav-icon"></i>
    </div>

    <!-- Bilgi Mesajı -->
    <div id="passive-notice" class="fixed top-0 left-0 find w-full h-full bg-black/80 flex items-center justify-center z-[100] hidden">
        <div class="bg-slate-800 p-6 rounded-2xl text-center border border-sky-500 max-w-[80%]">
            <h2 class="text-xl font-bold mb-2 text-sky-400">Hoş Geldiniz!</h2>
            <p id="passive-amount-text" class="text-sm text-slate-300 mb-4"></p>
            <button onclick="closeNotice()" class="px-6 py-2 bg-sky-600 rounded-lg font-bold">TOPLA</button>
        </div>
    </div>

    <script>
        const getTodayString = () => new Date().toDateString();

        let state = {
            balance: parseFloat(localStorage.getItem('miner_balance')) || 0.0,
            energy: parseInt(localStorage.getItem('miner_energy')) || 100,
            dailyTaps: parseInt(localStorage.getItem('miner_daily_taps')) || 2500,
            lastDate: localStorage.getItem('miner_last_date') || getTodayString(),
            lastUpdate: parseInt(localStorage.getItem('miner_last_update')) || Date.now()
        };

        const MAX_ENERGY = 100;
        const MAX_DAILY_TAPS = 2500;
        const TAP_VALUE = 0.000250;
        const DAILY_PASSIVE = 0.05;
        const PASSIVE_PER_MS = DAILY_PASSIVE / (24 * 60 * 60 * 1000);
        const REGEN_TIME = 2000;

        const balanceEl = document.getElementById('balance');
        const energyFillLeft = document.getElementById('energy-fill-left');
        const energyText = document.getElementById('energy-text');
        const limitFillRight = document.getElementById('limit-fill-right');
        const limitText = document.getElementById('limit-text');
        const canvasContainer = document.getElementById('canvas-container');

        if (state.lastDate !== getTodayString()) {
            state.dailyTaps = MAX_DAILY_TAPS;
            state.lastDate = getTodayString();
        }

        // Three.js Kurulumu
        let scene, camera, renderer, fanMesh;

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, canvasContainer.offsetWidth / canvasContainer.offsetHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(canvasContainer.offsetWidth, canvasContainer.offsetHeight);
            canvasContainer.appendChild(renderer.domElement);

            const loader = new THREE.TextureLoader();
            const fanTexture = loader.load('fan.jpg');

            // "Yan yatırma" isteği üzerine CircleGeometry kullanarak düz bir disk yapısı kuruyoruz
            // Bu yapı varsayılan olarak dik durur ve yan yatık görünmez.
            const geometry = new THREE.CircleGeometry(2, 64);
            
            const material = new THREE.MeshBasicMaterial({ 
                map: fanTexture,
                transparent: true,
                side: THREE.DoubleSide
            });

            fanMesh = new THREE.Mesh(geometry, material);
            // Rotasyonu sıfırlıyoruz (Dik durması için)
            fanMesh.rotation.x = 0; 
            scene.add(fanMesh);

            // Aydınlatma - BasicMaterial kullandığımız için ışığa ihtiyacı yok ama ortam ışığı kalsın
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            camera.position.z = 5;
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        function updateUI() {
            balanceEl.innerText = state.balance.toFixed(6);
            energyFillLeft.style.height = `${(state.energy / MAX_ENERGY) * 100}%`;
            energyText.innerText = `${state.energy}/${MAX_ENERGY}`;
            limitFillRight.style.height = `${(state.dailyTaps / MAX_DAILY_TAPS) * 100}%`;
            limitText.innerText = `${state.dailyTaps}/${MAX_DAILY_TAPS}`;
            
            localStorage.setItem('miner_balance', state.balance);
            localStorage.setItem('miner_energy', state.energy);
            localStorage.setItem('miner_daily_taps', state.dailyTaps);
            localStorage.setItem('miner_last_date', state.lastDate);
            localStorage.setItem('miner_last_update', Date.now());
        }

        function handleTap(e) {
            if (state.energy <= 0 || state.dailyTaps <= 0) return;

            state.energy -= 1;
            state.dailyTaps -= 1;
            state.balance += TAP_VALUE;

            // Görsel geri bildirim için sadece çok hafif bir büyüme (ileri-geri hareketi yok)
            fanMesh.scale.set(1.02, 1.02, 1.02);
            setTimeout(() => fanMesh.scale.set(1, 1, 1), 50);

            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            if(x && y) createTapEffect(x, y);

            updateUI();
        }

        function createTapEffect(x, y) {
            const el = document.createElement('div');
            el.className = 'tap-effect';
            el.innerText = `+${TAP_VALUE}`;
            el.style.left = `${x - 20}px`;
            el.style.top = `${y - 20}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function calculatePassive() {
            const now = Date.now();
            const diff = now - state.lastUpdate;
            const earned = diff * PASSIVE_PER_MS;
            
            if (earned > 0.000001) {
                state.balance += earned;
                document.getElementById('passive-amount-text').innerText = `Siz yokken madencileriniz ${earned.toFixed(6)} USDT topladı!`;
                document.getElementById('passive-notice').classList.remove('hidden');
            }
            updateUI();
        }

        function closeNotice() {
            document.getElementById('passive-notice').classList.add('hidden');
        }

        setInterval(() => {
            if (state.energy < MAX_ENERGY) {
                state.energy += 1;
                updateUI();
            }
        }, REGEN_TIME);

        setInterval(() => {
            state.balance += (1000 * PASSIVE_PER_MS);
            updateUI();
        }, 1000);

        window.onload = () => {
            init3D();
            animate();
            calculatePassive();

            canvasContainer.addEventListener('mousedown', handleTap);
            canvasContainer.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleTap(e);
            });

            window.onresize = () => {
                camera.aspect = canvasContainer.offsetWidth / canvasContainer.offsetHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(canvasContainer.offsetWidth, canvasContainer.offsetHeight);
            };
        };
    </script>
</body>
</html>
