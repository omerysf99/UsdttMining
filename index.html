<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF İndirme Merkezi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .pdf-card:hover { transform: translateY(-5px); transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

    <!-- Navigasyon -->
    <nav class="glass sticky top-0 z-50 border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="showPage('home')">
                <i class="fas fa-file-pdf text-red-600 text-2xl"></i>
                <span class="font-bold text-xl tracking-tight">PDF Depom</span>
            </div>
            <button onclick="showLogin()" class="text-gray-600 hover:text-red-600 font-medium transition">
                <i class="fas fa-lock-open mr-1"></i> Yönetici Girişi
            </button>
        </div>
    </nav>

    <!-- Ana Sayfa (Ziyaretçi Görünümü) -->
    <main id="home-page" class="max-w-6xl mx-auto px-4 py-12">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-extrabold mb-4">Döküman Arşivi</h1>
            <p class="text-gray-600 max-w-2xl mx-auto">Aşağıdaki listeden ihtiyacınız olan PDF dosyasını seçip tek tıkla cihazınıza indirebilirsiniz.</p>
        </div>

        <div id="pdf-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- PDF Kartları Buraya Gelecek -->
        </div>

        <div id="empty-state" class="hidden text-center py-20">
            <i class="fas fa-folder-open text-gray-300 text-6xl mb-4"></i>
            <p class="text-gray-500">Henüz yüklenmiş bir döküman bulunmuyor.</p>
        </div>
    </main>

    <!-- Admin Paneli -->
    <main id="admin-page" class="hidden max-w-4xl mx-auto px-4 py-12">
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-3xl font-bold text-gray-800">Yönetim Paneli</h2>
            <button onclick="logout()" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg text-sm transition">Güvenli Çıkış</button>
        </div>

        <!-- Yeni Ekleme Formu -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8">
            <h3 class="text-lg font-semibold mb-4">Yeni PDF Ekle</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Döküman Adı</label>
                    <input type="text" id="pdf-name" placeholder="Örn: 2024 Kullanım Klavuzu" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Dropbox Paylaşım Linki</label>
                    <input type="text" id="pdf-url" placeholder="https://www.dropbox.com/s/..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <button onclick="addPDF()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition shadow-lg shadow-red-200">
                    Sisteme Kaydet
                </button>
            </div>
        </div>

        <!-- Mevcut Dosyaları Yönet -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b border-gray-100">
                    <tr>
                        <th class="px-6 py-4 text-sm font-semibold">Dosya Adı</th>
                        <th class="px-6 py-4 text-sm font-semibold">İşlem</th>
                    </tr>
                </thead>
                <tbody id="admin-list">
                    <!-- Yönetim Listesi -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Login Modal -->
    <div id="login-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] p-4">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-center">Yönetici Girişi</h2>
            <input type="password" id="admin-pass" placeholder="Şifre" class="w-full px-4 py-3 border border-gray-300 rounded-lg mb-4 outline-none focus:border-red-500">
            <div class="flex space-x-3">
                <button onclick="closeLogin()" class="flex-1 px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">İptal</button>
                <button onclick="login()" class="flex-1 px-4 py-2 bg-black text-white rounded-lg hover:bg-gray-800 transition">Giriş Yap</button>
            </div>
            <p class="text-xs text-gray-400 mt-4 text-center">Varsayılan şifre: 1234</p>
        </div>
    </div>

    <!-- Bildirim Kutusu -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-800 text-white px-6 py-3 rounded-xl shadow-2xl z-[200]">
        Mesaj buraya gelecek.
    </div>

    <script>
        // Veritabanı simülasyonu (LocalStorage)
        let pdfData = JSON.parse(localStorage.getItem('my_pdfs')) || [
            { id: 1, name: 'Örnek Katalog.pdf', url: 'https://www.dropbox.com/s/sample/test.pdf?dl=1' }
        ];

        const ADMIN_PASSWORD = "1234"; // Şifrenizi buradan değiştirebilirsiniz
        let isAdmin = false;

        // Sayfa Değiştirme
        function showPage(page) {
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('admin-page').classList.add('hidden');
            
            if (page === 'admin' && isAdmin) {
                document.getElementById('admin-page').classList.remove('hidden');
            } else {
                document.getElementById('home-page').classList.remove('hidden');
            }
            renderLists();
        }

        // Listeleri Render Etme
        function renderLists() {
            const list = document.getElementById('pdf-list');
            const adminList = document.getElementById('admin-list');
            const emptyState = document.getElementById('empty-state');
            
            list.innerHTML = '';
            adminList.innerHTML = '';

            if (pdfData.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                pdfData.forEach(pdf => {
                    // Dropbox linkini otomatik düzelt (dl=0 -> dl=1)
                    const directUrl = pdf.url.replace('?dl=0', '?dl=1');
                    if (!directUrl.includes('?dl=1') && !directUrl.includes('&dl=1')) {
                        pdf.url += (pdf.url.includes('?') ? '&dl=1' : '?dl=1');
                    }

                    // Ana Sayfa Kartı
                    list.innerHTML += `
                        <div class="pdf-card bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
                            <div class="mb-4">
                                <div class="w-12 h-12 bg-red-50 text-red-600 rounded-lg flex items-center justify-center mb-4">
                                    <i class="fas fa-file-pdf text-xl"></i>
                                </div>
                                <h3 class="font-bold text-gray-800 line-clamp-2">${pdf.name}</h3>
                            </div>
                            <a href="${directUrl}" download class="w-full inline-flex items-center justify-center px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg font-semibold transition group">
                                <i class="fas fa-download mr-2 group-hover:bounce"></i> İndir
                            </a>
                        </div>
                    `;

                    // Admin Satırı
                    adminList.innerHTML += `
                        <tr class="border-b border-gray-50 last:border-0">
                            <td class="px-6 py-4 text-sm font-medium text-gray-700">${pdf.name}</td>
                            <td class="px-6 py-4">
                                <button onclick="deletePDF(${pdf.id})" class="text-red-500 hover:text-red-700 p-2">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }
        }

        // PDF Ekleme
        function addPDF() {
            const name = document.getElementById('pdf-name').value;
            let url = document.getElementById('pdf-url').value;

            if (!name || !url) {
                showToast("Lütfen tüm alanları doldurun!");
                return;
            }

            // Dropbox linkini direct linke çevirme mantığı
            if (url.includes("dropbox.com")) {
                url = url.split('?')[0] + "?dl=1";
            }

            const newPDF = {
                id: Date.now(),
                name: name,
                url: url
            };

            pdfData.push(newPDF);
            saveData();
            document.getElementById('pdf-name').value = '';
            document.getElementById('pdf-url').value = '';
            showToast("Döküman başarıyla eklendi.");
            renderLists();
        }

        // PDF Silme
        function deletePDF(id) {
            pdfData = pdfData.filter(p => p.id !== id);
            saveData();
            renderLists();
            showToast("Döküman sistemden silindi.");
        }

        // Veri Kaydetme
        function saveData() {
            localStorage.setItem('my_pdfs', JSON.stringify(pdfData));
        }

        // Login İşlemleri
        function showLogin() {
            if(isAdmin) {
                showPage('admin');
            } else {
                document.getElementById('login-modal').classList.remove('hidden');
            }
        }

        function closeLogin() {
            document.getElementById('login-modal').classList.add('hidden');
        }

        function login() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASSWORD) {
                isAdmin = true;
                closeLogin();
                showPage('admin');
                showToast("Hoşgeldiniz!");
            } else {
                showToast("Hatalı şifre!");
            }
            document.getElementById('admin-pass').value = '';
        }

        function logout() {
            isAdmin = false;
            showPage('home');
            showToast("Çıkış yapıldı.");
        }

        // Toast Bildirimi
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Başlangıç
        window.onload = renderLists;
    </script>
</body>
</html>
