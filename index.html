<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Mining App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: white;
            user-select: none;
            overflow: hidden;
        }

        /* Fan Dönme Animasyonu */
        @keyframes rotate-fan {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .fan-animation {
            animation: rotate-fan 4s linear infinite;
        }

        .fan-animation.boosted {
            animation-duration: 1s;
        }

        /* Cam Efekti Kartlar */
        .glass-card {
            background: #121212;
            border: 1px solid #222;
        }

        /* Alt Navigasyon */
        .nav-active {
            color: #3b82f6; /* Mavi tema (fan.jpg ile uyumlu) */
            background: rgba(59, 130, 246, 0.1);
            border-radius: 12px;
        }

        /* Buton Efektleri */
        .btn-active:active {
            transform: scale(0.95);
        }

        /* Sayıların yumuşak değişimi */
        .counter-text {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto relative border-x border-gray-900 shadow-2xl">

    <!-- Üst Bölüm: Bakiyeler -->
    <header class="p-4 space-y-3">
        <!-- TON Bakiye Kartı -->
        <div class="glass-card rounded-2xl p-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full overflow-hidden border border-blue-500/30 flex items-center justify-center bg-blue-500/10">
                    <img src="ton.jpg" alt="TON" class="w-full h-full object-cover" onerror="this.src='https://cryptologos.cc/logos/toncoin-ton-logo.png'">
                </div>
                <div>
                    <p class="text-xs text-gray-500">Bakiye</p>
                    <p class="font-bold text-sm tracking-wide" id="total-ton">7.6823 TON</p>
                </div>
            </div>
            <button class="bg-gray-800 p-2 rounded-xl text-gray-400 btn-active">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256"><path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Z"></path></svg>
            </button>
        </div>

        <!-- TONIX Bakiye Kartı -->
        <div class="glass-card rounded-2xl p-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full overflow-hidden border border-blue-400/30 flex items-center justify-center bg-blue-400/10">
                    <img src="dragon.jpg" alt="TONIX" class="w-full h-full object-cover" onerror="this.src='https://cdn-icons-png.flaticon.com/512/10668/10668045.png'">
                </div>
                <div>
                    <p class="text-xs text-gray-500">Bakiye</p>
                    <p class="font-bold text-sm tracking-wide">500 TONIX</p>
                </div>
            </div>
            <button class="bg-gray-800 p-2 rounded-xl text-gray-400 btn-active">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256"><path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Z"></path></svg>
            </button>
        </div>
    </header>

    <!-- Ana Bölüm: Madencilik Alanı -->
    <main id="view-home" class="flex-1 flex flex-col items-center justify-center px-6 transition-all duration-300">
        <!-- Büyük Fan Görseli -->
        <div class="relative w-72 h-72 mb-10">
            <!-- Arka Plan Parlaması (Mavi tema) -->
            <div class="absolute inset-0 bg-blue-600/10 blur-[80px] rounded-full"></div>
            
            <!-- Dönen Fan -->
            <div id="main-fan" class="fan-animation relative z-10 w-full h-full overflow-hidden rounded-full border-4 border-white/5">
                <img src="fan.jpg" alt="Fan" class="w-full h-full object-cover" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3593/3593672.png'">
            </div>
            
            <!-- Ortadaki İkon Kullanıcı İsteği Üzerine Kaldırıldı -->
        </div>

        <!-- Sayaç -->
        <div class="text-center">
            <h1 id="mining-counter" class="text-4xl font-bold counter-text tracking-tighter mb-2">0.0000000000 TON</h1>
            <div class="flex items-center justify-center gap-2 text-gray-400 bg-white/5 py-1.5 px-5 rounded-full border border-white/5">
                <span class="text-xs">ℹ️</span>
                <span class="text-sm font-semibold"><span id="ghs-value">6</span> GH/s</span>
                <span class="text-orange-500">⚡</span>
            </div>
        </div>

        <!-- Butonlar -->
        <div class="grid grid-cols-2 gap-4 w-full mt-12">
            <button onclick="claimMining()" class="bg-[#7c66e3] hover:bg-[#6b56d2] py-4 rounded-2xl font-bold flex flex-col items-center justify-center gap-1 btn-active transition-all shadow-lg shadow-indigo-500/20">
                <span class="text-lg">💰</span>
                <span>Topla</span>
            </button>
            <button onclick="boostMining()" class="bg-[#222] hover:bg-[#333] border border-white/5 py-4 rounded-2xl font-bold flex flex-col items-center justify-center gap-1 btn-active transition-all">
                <span class="text-lg">🚀</span>
                <span>Hızlandır</span>
            </button>
        </div>
    </main>

    <!-- Diğer Sekmeler (Gizli) -->
    <div id="view-wallet" class="hidden flex-1 p-6 flex flex-col items-center justify-center text-center">
        <div class="w-20 h-20 bg-blue-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
            <span class="text-3xl">👛</span>
        </div>
        <h2 class="text-2xl font-bold mb-2">Cüzdanım</h2>
        <p class="text-gray-400">Kazançlarınızı ve transferlerinizi yönetin</p>
    </div>

    <!-- Alt Navigasyon -->
    <footer class="bg-[#0a0a0a] p-2 flex justify-between items-center px-4 border-t border-gray-900 pb-8">
        <button onclick="switchTab('wallet', this)" class="flex flex-col items-center gap-1 p-2 transition-all opacity-60">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 256 256"><path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Z"></path></svg>
            <span class="text-[10px]">Cüzdan</span>
        </button>
        <button onclick="switchTab('friends', this)" class="flex flex-col items-center gap-1 p-2 transition-all opacity-60">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 256 256"><path d="M117.33,152A48,48,0,1,0,69.33,104,48.05,48.05,0,0,0,117.33,152Z"></path></svg>
            <span class="text-[10px]">Arkadaşlar</span>
        </button>
        <button onclick="switchTab('home', this)" class="nav-active flex flex-col items-center gap-1 p-2 px-4 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 256 256"><path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V120A15.87,15.87,0,0,0,219.31,108.68Z"></path></svg>
            <span class="text-[10px]">Ana Sayfa</span>
        </button>
        <button onclick="switchTab('missions', this)" class="flex flex-col items-center gap-1 p-2 relative transition-all opacity-60">
            <div class="absolute top-1 right-2 w-2 h-2 bg-red-500 rounded-full"></div>
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 256 256"><path d="M216,32H40A16,16,0,0,0,24,48V208a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V48A16,16,0,0,0,216,32Z"></path></svg>
            <span class="text-[10px]">Görevler</span>
        </button>
        <button onclick="switchTab('more', this)" class="flex flex-col items-center gap-1 p-2 transition-all opacity-60">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 256 256"><path d="M156,128a28,28,0,1,1-28-28A28,28,0,0,1,156,128Z"></path></svg>
            <span class="text-[10px]">Daha Fazla</span>
        </button>
    </footer>

    <!-- Bildirim -->
    <div id="toast" class="fixed bottom-28 left-1/2 -translate-x-1/2 bg-white/10 backdrop-blur-xl border border-white/20 px-8 py-3 rounded-2xl text-sm font-bold opacity-0 pointer-events-none transition-all duration-300 shadow-2xl z-50">
        Toplandı!
    </div>

    <script>
        let minedAmount = 0.0000000000;
        let totalBalance = 7.6823;
        let hashrate = 6;
        let isBoosted = false;

        const counterEl = document.getElementById('mining-counter');
        const balanceEl = document.getElementById('total-ton');
        const ghsEl = document.getElementById('ghs-value');
        const fanEl = document.getElementById('main-fan');
        const toastEl = document.getElementById('toast');

        function updateMining() {
            const increment = (hashrate * 0.000000005) + (Math.random() * 0.000000001);
            minedAmount += increment;
            counterEl.innerText = minedAmount.toFixed(10) + " TON";
        }

        setInterval(updateMining, 100);

        function claimMining() {
            if (minedAmount < 0.000001) {
                showToast("Toplanacak miktar yetersiz!");
                return;
            }
            totalBalance += minedAmount;
            minedAmount = 0;
            balanceEl.innerText = totalBalance.toFixed(4) + " TON";
            counterEl.innerText = "0.0000000000 TON";
            showToast("Başarılı! TON Toplandı 💰");
        }

        function boostMining() {
            if (isBoosted) return;
            isBoosted = true;
            hashrate *= 2;
            ghsEl.innerText = hashrate;
            fanEl.classList.add('boosted');
            showToast("Hızlandırma Aktif! 2x Hız 🚀");
            setTimeout(() => {
                isBoosted = false;
                hashrate /= 2;
                ghsEl.innerText = hashrate;
                fanEl.classList.remove('boosted');
                showToast("Hızlandırma Sona Erdi");
            }, 10000);
        }

        function showToast(message) {
            toastEl.innerText = message;
            toastEl.style.opacity = "1";
            toastEl.style.transform = "translateX(-52%) translateY(-10px)";
            setTimeout(() => {
                toastEl.style.opacity = "0";
                toastEl.style.transform = "translateX(-50%) translateY(0px)";
            }, 2500);
        }

        function switchTab(tab, element) {
            const tabs = ['home', 'wallet', 'friends', 'missions', 'more'];
            tabs.forEach(t => {
                const view = document.getElementById('view-' + t);
                if (view) view.classList.add('hidden');
            });
            const navButtons = document.querySelectorAll('footer button');
            navButtons.forEach(btn => {
                btn.classList.remove('nav-active');
                btn.classList.add('opacity-60');
            });
            const targetView = document.getElementById('view-' + tab);
            if (targetView) targetView.classList.remove('hidden');
            element.classList.add('nav-active');
            element.classList.remove('opacity-60');
        }
    </script>
</body>
</html>
