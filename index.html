<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Giriş Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .hidden { display: none; }
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 text-slate-800">

    <div class="glass-card w-full max-w-md p-8 rounded-2xl shadow-2xl">
        <!-- Giriş Arayüzü -->
        <div id="auth-ui">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-800">Hoş Geldiniz</h1>
                <p class="text-slate-500 mt-2">Uygulamaya devam etmek için giriş yapın</p>
            </div>

            <div class="space-y-4">
                <!-- Google Giriş Düğmesi -->
                <button onclick="signInWithGoogle()" 
                    id="google-btn"
                    class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 hover:bg-slate-50 font-semibold py-3 rounded-xl transition-all shadow-sm active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span id="google-btn-content" class="flex items-center gap-3">
                        <svg class="w-5 h-5" viewBox="0 0 48 48">
                            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
                        </svg>
                        Google ile Devam Et
                    </span>
                    <span id="google-btn-loader" class="hidden"><div class="loading-spinner"></div></span>
                </button>

                <div class="relative py-2">
                    <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-200"></span></div>
                    <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-slate-400">Veya</span></div>
                </div>

                <!-- E-posta Formu -->
                <div class="space-y-3">
                    <input type="email" id="email" placeholder="E-posta adresi" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                    <input type="password" id="password" placeholder="Şifre" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                    <div class="flex gap-3">
                        <button onclick="handleEmailAuth('signin')" class="flex-1 bg-slate-800 text-white py-3 rounded-xl font-semibold hover:bg-slate-700 transition-all active:scale-95">Giriş Yap</button>
                        <button onclick="handleEmailAuth('signup')" class="flex-1 border border-slate-800 text-slate-800 py-3 rounded-xl font-semibold hover:bg-slate-50 transition-all active:scale-95">Kayıt Ol</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Başarı Arayüzü -->
        <div id="success-ui" class="hidden text-center py-4">
            <div id="user-photo-container" class="mb-6"></div>
            <h2 class="text-2xl font-bold text-slate-800" id="user-display-name">Hoş Geldiniz!</h2>
            <p class="text-slate-500 mt-1 mb-8" id="user-email-info"></p>
            <button onclick="signOutUser()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-bold hover:bg-red-100 transition-all active:scale-95">Güvenli Çıkış Yap</button>
        </div>

        <!-- Mesaj Kutusu -->
        <div id="message-box" class="mt-6 p-4 rounded-xl text-sm hidden text-center"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut,
            browserLocalPersistence,
            setPersistence
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoJmNT86J_GoBUG-X2TrGOHPtK258kaBM",
            authDomain: "aaa123-468db.firebaseapp.com",
            projectId: "aaa123-468db",
            storageBucket: "aaa123-468db.firebasestorage.app",
            messagingSenderId: "277639579187",
            appId: "1:277639579187:web:f51052399a8d44f2308546",
            measurementId: "G-8HXRVPPNHR"
        };

        // Firebase Başlatma
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        auth.languageCode = 'tr';

        // Mesaj Gösterme Fonksiyonu
        function showMessage(msg, type = 'error') {
            const box = document.getElementById('message-box');
            box.innerHTML = '';
            box.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-emerald-100', 'text-emerald-700', 'bg-amber-100', 'text-amber-800');
            
            if (type === 'error') {
                if (msg.toLowerCase().includes('unauthorized-domain')) {
                    const currentHostname = window.location.hostname;
                    box.classList.add('bg-amber-100', 'text-amber-800');
                    box.innerHTML = `
                        <div class="text-left">
                            <strong class="block mb-1 font-bold">⚠️ Alan Adı Yetkisiz!</strong>
                            <p class="mb-2 text-[12px]">Google girişi için bu adresi Firebase'e ekleyin:</p>
                            <code class="block p-2 bg-white/60 rounded border border-amber-300 mb-2 font-mono text-[10px] break-all select-all">${currentHostname}</code>
                            <p class="text-[10px] opacity-70 italic font-medium">Authentication > Settings > Authorized Domains</p>
                        </div>
                    `;
                } else {
                    box.classList.add('bg-red-100', 'text-red-700');
                    box.innerText = msg;
                }
            } else {
                box.classList.add('bg-emerald-100', 'text-emerald-700');
                box.innerText = msg;
            }
            box.classList.remove('hidden');
        }

        // Arayüz Güncelleme
        function updateUI(user) {
            const authUi = document.getElementById('auth-ui');
            const successUi = document.getElementById('success-ui');
            const nameEl = document.getElementById('user-display-name');
            const emailEl = document.getElementById('user-email-info');
            const photoEl = document.getElementById('user-photo-container');

            if (user) {
                authUi.classList.add('hidden');
                successUi.classList.remove('hidden');
                document.getElementById('message-box').classList.add('hidden');
                nameEl.innerText = user.displayName || 'Kullanıcı';
                emailEl.innerText = user.email || 'E-posta tanımlı değil';
                
                if (user.photoURL) {
                    photoEl.innerHTML = `<img src="${user.photoURL}" class="w-24 h-24 rounded-full mx-auto shadow-xl border-4 border-white object-cover">`;
                } else {
                    photoEl.innerHTML = `<div class="w-24 h-24 bg-slate-200 rounded-full mx-auto flex items-center justify-center text-3xl text-slate-400">👤</div>`;
                }
            } else {
                authUi.classList.remove('hidden');
                successUi.classList.add('hidden');
            }
        }

        // --- GELİŞTİRİLMİŞ GOOGLE GİRİŞİ ---
        window.signInWithGoogle = async () => {
            const btn = document.getElementById('google-btn');
            const content = document.getElementById('google-btn-content');
            const loader = document.getElementById('google-btn-loader');

            // Görsel durumu güncelle
            btn.disabled = true;
            content.classList.add('hidden');
            loader.classList.remove('hidden');
            
            const provider = new GoogleAuthProvider();
            // Kullanıcıya her zaman hesap seçtirme
            provider.setCustomParameters({ prompt: 'select_account' });

            try {
                // Oturum kalıcılığını ayarla
                await setPersistence(auth, browserLocalPersistence);
                const result = await signInWithPopup(auth, provider);
                updateUI(result.user);
                showMessage("Hoş geldiniz, giriş yapıldı!", "success");
            } catch (error) {
                console.error("Giriş Hatası:", error);
                
                let errorMsg = error.message;
                if (error.code === 'auth/popup-closed-by-user') errorMsg = "Giriş penceresi kullanıcı tarafından kapatıldı.";
                else if (error.code === 'auth/cancelled-popup-request') errorMsg = "Giriş işlemi iptal edildi.";
                
                showMessage(errorMsg, "error");
            } finally {
                btn.disabled = false;
                content.classList.remove('hidden');
                loader.classList.add('hidden');
            }
        };

        // --- E-POSTA GİRİŞİ ---
        window.handleEmailAuth = async (type) => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;

            if (!email || !pass) {
                showMessage("Lütfen e-posta ve şifrenizi girin.", "error");
                return;
            }

            try {
                const result = (type === 'signup') 
                    ? await createUserWithEmailAndPassword(auth, email, pass)
                    : await signInWithEmailAndPassword(auth, email, pass);
                updateUI(result.user);
            } catch (error) {
                showMessage(error.message, "error");
            }
        };

        // --- ÇIKIŞ ---
        window.signOutUser = () => {
            signOut(auth).then(() => {
                location.reload();
            });
        };

        // Oturum durumunu sürekli takip et
        onAuthStateChanged(auth, updateUI);
    </script>
</body>
</html>
