<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Miner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;800&display=swap');

        body {
            background-color: #0c0c0c;
            color: #ffffff;
            font-family: 'Lexend', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .card-bg {
            background-color: #161616;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Arka Plan Neon Çizgileri */
        .bg-curves {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 60%),
                url("data:image/svg+xml,%3Csvg width='400' height='400' viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 400C150 350 250 150 400 0' stroke='%238b5cf6' stroke-width='1' fill='none' opacity='0.2'/%3E%3Cpath d='M0 200C200 150 300 50 400 -100' stroke='%238b5cf6' stroke-width='1' fill='none' opacity='0.1'/%3E%3C/svg%3E");
            z-index: 0;
            pointer-events: none;
        }

        /* Madenci Fanı Animasyonu */
        @keyframes fan-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .miner-container {
            position: relative;
            filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.3));
        }

        .miner-fan {
            animation: fan-spin 4s linear infinite;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Buton Efektleri */
        .btn-blue {
            background: linear-gradient(180deg, #007bff 0%, #0056b3 100%);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }

        .btn-active:active {
            transform: scale(0.96);
        }

        .nav-active {
            color: #8b5cf6;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
        }

        .balance-text {
            letter-spacing: -0.05em;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen max-w-md mx-auto relative px-4 pt-6 pb-24">

    <!-- Arka Plan Görseli -->
    <div class="bg-curves"></div>

    <!-- Üst Bakiyeler (Sadece Claim edilenler görünür) -->
    <div class="space-y-3 z-10">
        <!-- SOL Kartı -->
        <div class="card-bg rounded-[24px] p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <!-- Siyahlık problemini gidermek için arka planı kaldırdım ve containment'ı iyileştirdim -->
                <div class="w-11 h-11 rounded-full border border-white/10 overflow-hidden flex items-center justify-center bg-transparent">
                    <img src="sol.jpg" class="w-full h-full object-contain" alt="SOL" onerror="this.src='https://cryptologos.cc/logos/solana-sol-logo.png'">
                </div>
                <div>
                    <p class="text-[13px] font-bold text-white leading-tight">SOL</p>
                    <p class="text-[12px] text-gray-400">Balance</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <p class="font-extrabold text-xl balance-text" id="sol-top">0.000000 SOL</p>
                <button class="w-10 h-10 rounded-xl btn-blue flex items-center justify-center btn-active">
                    <i class="fa-solid fa-wallet text-white text-sm"></i>
                </button>
            </div>
        </div>

        <!-- TON Kartı -->
        <div class="card-bg rounded-[24px] p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-full border border-white/10 overflow-hidden flex items-center justify-center bg-transparent">
                    <img src="ton.jpg" class="w-full h-full object-contain" alt="TON" onerror="this.src='https://cryptologos.cc/logos/toncoin-ton-logo.png'">
                </div>
                <div>
                    <p class="text-[13px] font-bold text-white leading-tight">TON</p>
                    <p class="text-[12px] text-gray-400">Balance</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <p class="font-extrabold text-xl balance-text" id="ton-top">0.000000 TON</p>
                <button class="w-10 h-10 rounded-xl btn-blue flex items-center justify-center btn-active">
                    <i class="fa-solid fa-wallet text-white text-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Madenci Alanı -->
    <div class="flex-1 flex flex-col items-center justify-center z-10">
        <div class="miner-container w-72 h-72 flex items-center justify-center mb-6">
            <!-- Madenci Fan Görseli -->
            <img src="fan2.jpg" class="miner-fan w-full h-full border-4 border-white/5" alt="Miner Fan" onerror="this.style.display='none'; document.getElementById('fallback-fan').style.display='block';">
            
            <div id="fallback-fan" style="display:none;" class="w-full h-full">
                <svg class="miner-fan w-full h-full" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="48" fill="#4c1d95" />
                    <path d="M50 10 L50 90 M10 50 L90 50" stroke="white" stroke-width="2" opacity="0.3"/>
                </svg>
            </div>
            <!-- Miner ortası boş -->
        </div>

        <!-- Göstergeler (Aktif Madencilik) -->
        <div class="text-center space-y-1">
            <p class="text-xs text-gray-500 uppercase font-bold tracking-widest">Mining Progress</p>
            <h1 class="text-4xl font-extrabold balance-text text-white" id="sol-pending">0.0000000000 SOL</h1>
            <h2 class="text-2xl font-bold balance-text text-blue-400" id="ton-pending">0.0000000000 TON</h2>
            
            <div class="flex items-center justify-center gap-2 text-gray-400 text-[13px] font-bold mt-4">
                <i class="fa-solid fa-circle-info opacity-50"></i>
                <span id="speed-text">1 GH/s</span>
                <i class="fa-solid fa-bolt text-orange-500"></i>
            </div>
        </div>
    </div>

    <!-- Alt İşlemler -->
    <div class="grid grid-cols-2 gap-4 mb-6 z-10">
        <button id="claim-btn" class="btn-blue py-4 rounded-[22px] flex items-center justify-center gap-2 font-extrabold text-white btn-active">
            <i class="fa-solid fa-coins"></i>
            Claim
        </button>
        <!-- Boost butonu duruyor ancak işlevsiz -->
        <button id="boost-btn" class="btn-blue py-4 rounded-[22px] flex items-center justify-center gap-2 font-extrabold text-white btn-active">
            <i class="fa-solid fa-rocket"></i>
            Boost
        </button>
    </div>

    <!-- Navigasyon -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#0a0a0a]/90 backdrop-blur-lg border-t border-white/5 flex justify-around items-center py-3 z-20">
        <button class="flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-wallet text-xl"></i>
            <span class="text-[10px] font-bold uppercase">Wallet</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-users text-xl"></i>
            <span class="text-[10px] font-bold uppercase">Friends</span>
        </button>
        <button class="flex flex-col items-center gap-1 nav-active">
            <i class="fa-solid fa-fan text-xl"></i>
            <span class="text-[10px] font-bold uppercase">Home</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-500 relative">
            <i class="fa-solid fa-bullseye text-xl"></i>
            <span class="text-[10px] font-bold uppercase">Missions</span>
            <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full border-2 border-black"></span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-sliders text-xl"></i>
            <span class="text-[10px] font-bold uppercase">More</span>
        </button>
    </nav>

    <!-- Toast Bildirimi -->
    <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 bg-white/10 backdrop-blur-xl border border-white/20 px-8 py-3 rounded-full text-sm font-bold opacity-0 transition-all duration-300 pointer-events-none z-50 shadow-2xl text-center">
        İşlem Başarılı!
    </div>

    <script>
        // Cüzdan Bakiyeleri (Claim edilenler)
        let claimedSol = 0;
        let claimedTon = 0;

        // Madencilik Bakiyeleri (Henüz toplanmamış olanlar)
        let pendingSol = 0;
        let pendingTon = 0;

        // Hız Ayarları (Sabit 1 GH/s)
        let speed = 1;
        
        // 1 GH/s = Günde 0.0001 birim
        const DAILY_TARGET = 0.0001; 
        const INTERVAL_MS = 100;
        const INTERVALS_PER_DAY = (24 * 60 * 60 * 1000) / INTERVAL_MS; 
        const INCREMENT_PER_UNIT_SPEED = DAILY_TARGET / INTERVALS_PER_DAY;

        const updateDisplay = () => {
            // Orta Alan (Bekleyen Madencilik)
            document.getElementById('sol-pending').innerText = `${pendingSol.toFixed(10)} SOL`;
            document.getElementById('ton-pending').innerText = `${pendingTon.toFixed(10)} TON`;
            
            // Üst Kartlar (Sadece Claim Edilenler)
            document.getElementById('sol-top').innerText = `${claimedSol.toFixed(6)} SOL`;
            document.getElementById('ton-top').innerText = `${claimedTon.toFixed(6)} TON`;
            
            document.getElementById('speed-text').innerText = `${speed} GH/s`;
        };

        // Madencilik Döngüsü
        setInterval(() => {
            if(speed > 0) {
                pendingSol += INCREMENT_PER_UNIT_SPEED * speed;
                pendingTon += INCREMENT_PER_UNIT_SPEED * speed;
                updateDisplay();
            }
        }, INTERVAL_MS);

        // Boost Butonu (Tıklandığında işlem yapmaz)
        document.getElementById('boost-btn').onclick = () => {
            showToast("Boost özelliği yakında!");
        };

        // Claim Butonu (Bekleyeni Cüzdana Aktar)
        document.getElementById('claim-btn').onclick = () => {
            if(pendingSol > 0 || pendingTon > 0) {
                claimedSol += pendingSol;
                claimedTon += pendingTon;

                showToast(`${pendingSol.toFixed(6)} SOL & ${pendingTon.toFixed(6)} TON toplandı!`);
                
                pendingSol = 0;
                pendingTon = 0;
                
                updateDisplay();
            } else {
                showToast("Henüz kazılmış bir bakiye yok.");
            }
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = '1';
            t.style.transform = 'translate(-50%, 10px)';
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.transform = 'translate(-50%, 0px)';
            }, 2000);
        }

        window.onload = updateDisplay;
    </script>
</body>
</html>
