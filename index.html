<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Kütüphanesi | Güvenli Giriş</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.03);
        }
        .hidden { display: none; }
        .pdf-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid transparent;
        }
        .pdf-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: white;
            border-color: #e2e8f0;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .input-focus:focus {
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen text-slate-900">

    <div class="container mx-auto px-4 py-12 flex flex-col items-center">
        
        <!-- Giriş / Kayıt Ekranı -->
        <div id="auth-ui" class="w-full max-w-md animate-in">
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-[2rem] shadow-2xl shadow-indigo-200 mb-6 transform rotate-3 hover:rotate-0 transition-transform duration-500">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>
                <h1 class="text-4xl font-extrabold tracking-tight text-slate-900">Kütüphanem</h1>
                <p class="text-slate-500 mt-3 font-medium">Hızlı ve güvenli erişim portalı</p>
            </div>

            <div class="glass-card p-8 rounded-[2.5rem]">
                <div class="space-y-5">
                    <div class="space-y-4">
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase ml-2 mb-1 block">E-posta</label>
                            <input type="email" id="email" placeholder="ornek@mail.com" class="w-full px-5 py-4 rounded-2xl border border-slate-200 outline-none focus:border-indigo-500 bg-white transition-all input-focus">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase ml-2 mb-1 block">Şifre</label>
                            <input type="password" id="password" placeholder="••••••••" class="w-full px-5 py-4 rounded-2xl border border-slate-200 outline-none focus:border-indigo-500 bg-white transition-all input-focus">
                        </div>
                        
                        <div class="pt-2">
                            <button onclick="handleEmailAuth('signin')" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-xl hover:bg-black active:scale-[0.98] transition-all mb-3">Giriş Yap</button>
                            <button onclick="handleEmailAuth('signup')" class="w-full bg-white border-2 border-slate-100 text-slate-600 py-3.5 rounded-2xl font-bold hover:bg-slate-50 active:scale-[0.98] transition-all">Üye Ol</button>
                        </div>
                    </div>

                    <div class="relative flex items-center py-2">
                        <div class="flex-grow border-t border-slate-100"></div>
                        <span class="flex-shrink mx-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Hızlı Bağlan</span>
                        <div class="flex-grow border-t border-slate-100"></div>
                    </div>

                    <button onclick="signInWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-200 text-slate-700 py-4 rounded-2xl font-bold hover:border-indigo-300 hover:bg-indigo-50/30 transition-all">
                        <svg class="w-5 h-5" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>
                        Google ile Devam Et
                    </button>
                </div>
            </div>
        </div>

        <!-- Ana Uygulama Ekranı -->
        <div id="main-ui" class="hidden w-full max-w-6xl space-y-8 animate-in">
            <!-- Üst Header -->
            <header class="flex flex-col md:flex-row justify-between items-center gap-6 bg-white/60 backdrop-blur-md p-8 rounded-[2.5rem] border border-white shadow-sm">
                <div class="flex items-center gap-5">
                    <div class="w-16 h-16 bg-gradient-to-br from-indigo-600 to-indigo-800 rounded-2xl flex items-center justify-center text-white shadow-xl shadow-indigo-100">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                    </div>
                    <div>
                        <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Koleksiyonum</h2>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                            <p id="user-info" class="text-slate-500 font-bold text-[10px] uppercase tracking-widest"></p>
                        </div>
                    </div>
                </div>
                
                <div class="flex items-center gap-4 w-full md:w-auto">
                    <div class="relative flex-grow md:flex-grow-0">
                        <input type="text" id="search-input" oninput="filterPdfs()" placeholder="Dosyalarda ara..." class="w-full md:w-72 pl-12 pr-4 py-4 rounded-2xl border border-slate-200 outline-none focus:border-indigo-500 bg-white/50 transition-all text-sm">
                        <svg class="w-5 h-5 text-slate-400 absolute left-4 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    </div>
                    <button onclick="signOutUser()" class="p-4 bg-white text-slate-400 rounded-2xl hover:text-red-500 hover:shadow-lg transition-all border border-slate-100 group">
                        <svg class="w-6 h-6 transform group-hover:rotate-12 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                    </button>
                </div>
            </header>

            <!-- Admin Paneli (Sadece yetkili kullanıcıya görünür) -->
            <div id="admin-panel" class="hidden bg-slate-950 p-10 rounded-[3rem] text-white shadow-3xl relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-80 h-80 bg-indigo-600/20 rounded-full -mr-40 -mt-40 blur-[100px] group-hover:bg-indigo-600/30 transition-colors duration-700"></div>
                
                <div class="relative z-10">
                    <div class="flex items-center gap-4 mb-10">
                        <div class="bg-indigo-500/20 p-3 rounded-xl">
                            <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                        </div>
                        <div>
                            <h3 class="text-2xl font-bold tracking-tight">Yönetici Paneli</h3>
                            <p class="text-slate-400 text-sm">Yeni dosya ekle ve kütüphaneyi yönet</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-3">
                            <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Belge Başlığı</label>
                            <input type="text" id="pdf-name" placeholder="Örn: Modern Fizik Ders Notları" class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:border-indigo-500 focus:bg-white/10 transition-all placeholder:text-slate-600">
                        </div>
                        <div class="space-y-3">
                            <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Dropbox Paylaşım Linki</label>
                            <input type="text" id="pdf-link" placeholder="https://www.dropbox.com/s/..." class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:border-indigo-500 focus:bg-white/10 transition-all placeholder:text-slate-600">
                        </div>
                    </div>
                    
                    <button onclick="addNewPdf()" class="mt-10 w-full bg-indigo-600 hover:bg-indigo-500 py-5 rounded-2xl font-extrabold text-sm uppercase tracking-[0.2em] transition-all shadow-2xl shadow-indigo-900/40 active:scale-[0.99]">
                        Kütüphaneye Gönder
                    </button>
                </div>
            </div>

            <!-- PDF Listesi -->
            <div id="pdf-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Dinamik İçerik -->
            </div>
        </div>

        <!-- Mesaj Kutusu -->
        <div id="message-box" class="fixed top-8 left-1/2 -translate-x-1/2 px-8 py-4 rounded-full shadow-2xl hidden z-50 flex items-center gap-3 animate-bounce"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, GoogleAuthProvider, signInWithPopup, 
            createUserWithEmailAndPassword, signInWithEmailAndPassword,
            onAuthStateChanged, signOut
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, collection, addDoc, onSnapshot, query, orderBy, setDoc, doc, getDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Yapılandırması
        const firebaseConfig = {
            apiKey: "AIzaSyDoJmNT86J_GoBUG-X2TrGOHPtK258kaBM",
            authDomain: "aaa123-468db.firebaseapp.com",
            projectId: "aaa123-468db",
            storageBucket: "aaa123-468db.firebasestorage.app",
            messagingSenderId: "277639579187",
            appId: "1:277639579187:web:f51052399a8d44f2308546"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // ÖZEL YÖNETİCİ E-POSTASI
        const ADMIN_EMAIL = "algiritmi@gmail.com";

        let allPdfs = [];

        function showMessage(msg, type = 'error') {
            const box = document.getElementById('message-box');
            box.innerText = msg;
            box.className = `fixed top-8 left-1/2 -translate-x-1/2 px-8 py-4 rounded-full shadow-2xl z-50 flex items-center gap-3 font-bold border ${
                type === 'error' 
                ? 'bg-red-50 text-red-600 border-red-100' 
                : 'bg-emerald-50 text-emerald-600 border-emerald-100'
            }`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 3500);
        }

        window.handleEmailAuth = async (type) => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            if (!email || !pass) return showMessage("Lütfen tüm alanları doldurun.");

            try {
                if (type === 'signup') {
                    await createUserWithEmailAndPassword(auth, email, pass);
                    showMessage("Hesabınız oluşturuldu, hoş geldiniz!", "success");
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                    showMessage("Giriş başarılı!", "success");
                }
            } catch (e) { 
                let errorMsg = "Hata oluştu.";
                if(e.code === 'auth/email-already-in-use') errorMsg = "Bu e-posta zaten kullanımda.";
                if(e.code === 'auth/wrong-password') errorMsg = "Hatalı şifre.";
                if(e.code === 'auth/invalid-credential') errorMsg = "Hatalı e-posta veya şifre.";
                showMessage(errorMsg);
            }
        };

        window.filterPdfs = () => {
            const term = document.getElementById('search-input').value.toLowerCase();
            const filtered = allPdfs.filter(pdf => pdf.name.toLowerCase().includes(term));
            renderPdfs(filtered);
        }

        function convertToDirectDownload(url) {
            if (!url) return "#";
            if (url.includes("dropbox.com")) {
                return url.replace(/dl=0/g, "dl=1");
            }
            return url;
        }

        function renderPdfs(list) {
            const pdfListDiv = document.getElementById('pdf-list');
            pdfListDiv.innerHTML = "";
            
            if (list.length === 0) {
                pdfListDiv.innerHTML = `
                <div class="col-span-full flex flex-col items-center py-24 bg-white/40 rounded-[3rem] border-2 border-dashed border-slate-200 opacity-60">
                    <svg class="w-16 h-16 text-slate-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    <p class="text-slate-400 font-bold uppercase tracking-widest text-xs">Aradığınız kriterde dosya bulunamadı</p>
                </div>`;
                return;
            }

            list.forEach((data, index) => {
                const delay = index * 50;
                const downloadLink = convertToDirectDownload(data.link);
                
                pdfListDiv.innerHTML += `
                    <div class="pdf-card bg-white/70 backdrop-blur-sm p-8 rounded-[2.5rem] flex flex-col items-center text-center animate-in" style="animation-delay: ${delay}ms">
                        <div class="w-20 h-20 bg-slate-50 rounded-3xl flex items-center justify-center mb-6 text-slate-400 relative">
                             <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 012 2v14a2 2 0 01-2 2H7a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>
                             <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-emerald-500 rounded-full flex items-center justify-center border-2 border-white">
                                <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
                             </div>
                        </div>
                        <h4 class="font-extrabold text-slate-800 mb-6 text-sm leading-relaxed line-clamp-2 h-10 px-2 uppercase tracking-tight">${data.name}</h4>
                        <a href="${downloadLink}" download class="w-full bg-slate-900 text-white py-4 rounded-2xl text-[11px] font-black uppercase tracking-widest hover:bg-indigo-600 shadow-lg shadow-slate-100 transition-all flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                            İndir
                        </a>
                    </div>`;
            });
        }

        onAuthStateChanged(auth, async (user) => {
            const authUi = document.getElementById('auth-ui');
            const mainUi = document.getElementById('main-ui');
            const adminPanel = document.getElementById('admin-panel');

            if (user) {
                authUi.classList.add('hidden');
                mainUi.classList.remove('hidden');
                document.getElementById('user-info').innerText = user.email;
                
                if (user.email === ADMIN_EMAIL) {
                    adminPanel.classList.remove('hidden');
                } else {
                    adminPanel.classList.add('hidden');
                }
                
                const q = query(collection(db, "pdfs"), orderBy("createdAt", "desc"));
                onSnapshot(q, (snapshot) => {
                    allPdfs = [];
                    snapshot.forEach(d => allPdfs.push(d.data()));
                    renderPdfs(allPdfs);
                }, (error) => {
                    console.error("Firestore Dinleme Hatası (Yüksek ihtimalle kurallar ile ilgili):", error);
                    showMessage("Veriler yüklenirken hata oluştu.");
                });
            } else {
                authUi.classList.remove('hidden');
                mainUi.classList.add('hidden');
                adminPanel.classList.add('hidden');
            }
        });

        window.addNewPdf = async () => {
            if (auth.currentUser?.email !== ADMIN_EMAIL) {
                showMessage("Bu işlemi yapmaya yetkiniz yok.");
                return;
            }

            const name = document.getElementById('pdf-name').value;
            const link = document.getElementById('pdf-link').value;
            if (!name || !link) return showMessage("Lütfen tüm alanları doldurun.");
            
            try {
                console.log("PDF Ekleniyor...");
                await addDoc(collection(db, "pdfs"), { 
                    name, 
                    link, 
                    createdAt: Date.now() 
                });
                document.getElementById('pdf-name').value = "";
                document.getElementById('pdf-link').value = "";
                showMessage("Yeni belge sisteme başarıyla eklendi!", "success");
            } catch (e) {
                console.error("PDF Ekleme Hatası:", e);
                showMessage("Kayıt sırasında hata oluştu. Lütfen tarayıcı konsoluna bakın.");
            }
        };

        window.signOutUser = () => signOut(auth);
        window.signInWithGoogle = () => signInWithPopup(auth, new GoogleAuthProvider());
    </script>
</body>
</html>
