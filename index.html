<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DRAGON Miner Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --tg-viewport-height: 100vh;
            --tg-viewport-stable-height: 100vh;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000000;
            color: white;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
            height: 100dvh;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            height: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #000;
        }
        .header-section {
            padding: 16px 20px 8px 20px;
            flex-shrink: 0;
        }
        .balance-card {
            background: #111111;
            border-radius: 18px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
        }
        .balance-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            overflow: hidden;
            padding: 0 24px;
        }
        .fan-container {
            position: relative;
            width: 60vw;
            height: 60vw;
            max-width: 240px;
            max-height: 240px;
            flex-shrink: 0;
        }
        .fan-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            animation: spin 3s linear infinite;
            box-shadow: 0 0 30px rgba(91, 93, 242, 0.15);
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .mining-info {
            text-align: center;
            width: 100%;
        }
        
        /* Yeni Navigasyon Stilleri */
        .nav-bar {
            height: 90px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 10px 15px 10px;
            background: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0.8));
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 50;
        }
        .nav-btn {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #666;
        }
        .nav-emoji {
            font-size: 24px;
            margin-bottom: 2px;
            filter: grayscale(1);
            transition: all 0.3s ease;
        }
        .nav-text {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .nav-active {
            color: #ffffff;
            transform: translateY(-5px);
        }
        .nav-active .nav-emoji {
            filter: grayscale(0) drop-shadow(0 0 8px rgba(255,255,255,0.3));
            font-size: 28px;
        }
        .nav-active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            width: 12px;
            height: 4px;
            background: #5b5df2;
            border-radius: 10px;
            box-shadow: 0 0 10px #5b5df2;
        }

        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .tab-content.active {
            display: flex;
        }
        .claim-btn {
            background: linear-gradient(135deg, #5b5df2, #4042b8);
            box-shadow: 0 6px 15px rgba(91, 93, 242, 0.25);
        }
        .boost-btn {
            background: linear-gradient(135deg, #7169e6, #5a52c7);
            box-shadow: 0 6px 15px rgba(113, 105, 230, 0.25);
        }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .modal-content {
            background: #161616;
            border-radius: 28px;
            width: 100%;
            max-width: 320px;
            border: 1px solid rgba(255,255,255,0.08);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Üst Bakiye Bölümü -->
        <header class="header-section">
            <div class="balance-card flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-[#0088cc] flex items-center justify-center shrink-0">
                        <img src="ton.jpg" alt="TON" class="w-full h-full object-cover rounded-full" onerror="this.src='https://cryptologos.cc/logos/toncoin-ton-logo.png'">
                    </div>
                    <div>
                        <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest mb-0.5">TON</p>
                        <p class="text-white font-extrabold text-sm leading-none balance-text"><span id="total-ton-balance">0.0000</span></p>
                    </div>
                </div>
                <button class="w-9 h-9 bg-[#222] rounded-xl flex items-center justify-center shrink-0">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                </button>
            </div>

            <div class="balance-card flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-orange-950 flex items-center justify-center shrink-0 border border-orange-500/20">
                        <img src="dragon.jpg" alt="$DRAGON" class="w-full h-full object-cover rounded-full" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3233/3233303.png'">
                    </div>
                    <div>
                        <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest mb-0.5">$DRAGON</p>
                        <p class="text-white font-extrabold text-sm leading-none balance-text"><span id="dragon-balance">0</span></p>
                    </div>
                </div>
                <button class="w-9 h-9 bg-[#222] rounded-xl flex items-center justify-center shrink-0">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                </button>
            </div>
        </header>

        <!-- Ana Madencilik Alanı -->
        <main class="main-content">
            <section id="tab-home" class="tab-content active">
                <div class="flex-1 flex flex-col items-center justify-center w-full">
                    <div class="fan-container mb-6">
                        <img src="fan.jpg" alt="Fan" class="fan-image" onerror="this.src='https://cdn-icons-png.flaticon.com/512/911/911369.png'">
                    </div>

                    <div class="mining-info mb-6">
                        <h2 class="text-3xl font-black text-white mb-2 tracking-tighter">
                            <span id="mining-display">0.0000000000</span> <span class="text-blue-500">TON</span>
                        </h2>
                        <div class="flex items-center justify-center gap-2 text-[11px] text-gray-400 font-bold bg-[#111] py-1.5 px-4 rounded-full mx-auto w-fit border border-white/5">
                            <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
                            <span id="ghs-speed-display">11.00</span> GH/s
                            <span class="text-orange-500">⚡</span>
                        </div>
                    </div>
                </div>

                <div class="w-full flex gap-3 mb-4">
                    <button id="claim-btn" class="flex-1 claim-btn text-white font-extrabold py-3.5 rounded-2xl flex items-center justify-center gap-2 active:scale-95 transition-all text-xs uppercase tracking-widest">
                        Aktar
                    </button>
                    <button id="boost-trigger" class="flex-1 boost-btn text-white font-extrabold py-3.5 rounded-2xl flex items-center justify-center gap-2 active:scale-95 transition-all text-xs uppercase tracking-widest">
                        Hızlandır
                    </button>
                </div>
            </section>

            <!-- Diğer Sekmeler -->
            <section id="tab-wallet" class="tab-content items-center justify-center text-[10px] text-gray-500 font-bold uppercase tracking-widest">Cüzdan Paneli</section>
            <section id="tab-friends" class="tab-content items-center justify-center text-[10px] text-gray-500 font-bold uppercase tracking-widest">Davet Paneli</section>
            <section id="tab-missions" class="tab-content items-center justify-center text-[10px] text-gray-500 font-bold uppercase tracking-widest">Görev Paneli</section>
            <section id="tab-more" class="tab-content items-center justify-center text-[10px] text-gray-500 font-bold uppercase tracking-widest">Ayarlar Paneli</section>
        </main>

        <!-- Alt Navigasyon (Emoji & Dock Style) -->
        <nav class="nav-bar">
            <button onclick="switchTab('wallet')" class="nav-btn" id="nav-wallet">
                <span class="nav-emoji">💼</span>
                <span class="nav-text">Cüzdan</span>
            </button>
            <button onclick="switchTab('friends')" class="nav-btn" id="nav-friends">
                <span class="nav-emoji">👥</span>
                <span class="nav-text">Davet</span>
            </button>
            <button onclick="switchTab('home')" class="nav-btn nav-active" id="nav-home">
                <span class="nav-emoji">🏠</span>
                <span class="nav-text">Ev</span>
            </button>
            <button onclick="switchTab('missions')" class="nav-btn" id="nav-missions">
                <span class="nav-emoji">🎯</span>
                <span class="nav-text">Görevler</span>
            </button>
            <button onclick="switchTab('more')" class="nav-btn" id="nav-more">
                <span class="nav-emoji">⚙️</span>
                <span class="nav-text">Diğer</span>
            </button>
        </nav>
    </div>

    <!-- Modallar -->
    <div id="welcome-modal" class="modal-overlay">
        <div class="modal-content p-7 flex flex-col items-center text-center">
            <div class="w-16 h-16 bg-yellow-500/10 rounded-full flex items-center justify-center mb-4 border border-yellow-500/20">
                <img src="dragon.jpg" alt="Reward" class="w-full h-full object-cover rounded-full" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3233/3233303.png'">
            </div>
            <h3 class="text-xl font-black mb-1">HOŞ GELDİN!</h3>
            <p class="text-gray-400 text-[11px] mb-6 px-2 leading-relaxed">Senin için hazırladığımız başlangıç paketini hemen topla!</p>
            
            <div class="w-full space-y-2 mb-8">
                <div class="flex items-center justify-between bg-white/5 p-3.5 rounded-2xl border border-white/5">
                    <span class="text-[9px] font-black text-gray-500 uppercase tracking-widest">TON Ödülü</span>
                    <span class="text-green-400 font-black text-sm">+0.05 TON</span>
                </div>
                <div class="flex items-center justify-between bg-white/5 p-3.5 rounded-2xl border border-white/5">
                    <span class="text-[9px] font-black text-gray-500 uppercase tracking-widest">$DRAGON Ödülü</span>
                    <span class="text-orange-400 font-black text-sm">+50</span>
                </div>
            </div>

            <button id="collect-reward-btn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-black py-4 rounded-2xl shadow-xl active:scale-95 transition-all text-xs uppercase">
                ÖDÜLLERİ AL
            </button>
        </div>
    </div>

    <div id="boost-modal" class="modal-overlay">
        <div class="modal-content p-7 flex flex-col items-center">
            <div class="w-14 h-14 bg-indigo-500/10 rounded-full flex items-center justify-center mb-3 border border-indigo-500/20">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </div>
            <h3 class="text-lg font-extrabold mb-1 tracking-tight">HIZINI ARTIR!</h3>
            <p class="text-gray-500 text-[10px] text-center mb-6 px-4">Video izleyerek kalıcı <span class="text-white">+0.01 GH/s</span> kazan.</p>
            
            <div id="ad-simulation" class="hidden w-full mb-6">
                <div class="w-full h-2 bg-white/5 rounded-full overflow-hidden">
                    <div id="ad-progress" class="h-full bg-indigo-500 w-0 transition-all duration-[3000ms] ease-linear"></div>
                </div>
            </div>

            <button id="watch-ad-btn" class="w-full bg-indigo-600 text-white font-black py-3.5 rounded-xl text-xs uppercase">
                [izle]
            </button>
            <button id="close-boost-btn" class="mt-4 text-gray-500 text-[9px] font-black uppercase tracking-[0.2em]">Kapat</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDi7IqV474UDMtrKyKuO-2pct5WxwSB3jQ",
            authDomain: "studio-9241589115-a403e.firebaseapp.com",
            projectId: "studio-9241589115-a403e",
            storageBucket: "studio-9241589115-a403e.firebasestorage.app",
            messagingSenderId: "1010284036381",
            appId: "1:1010284036381:web:cd6effcc67287c510e61f4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const contextAppId = typeof __app_id !== 'undefined' ? __app_id : 'dragon-miner-pro-v2';

        let ghsSpeed = 11.0;
        let totalWalletBalance = 0;
        let lastClaimTime = Date.now();
        let currentMiningBalance = 0;
        let dragonBalance = 0; 
        let currentUser = null;

        const miningDisplay = document.getElementById('mining-display');
        const walletDisplay = document.getElementById('total-ton-balance');
        const dragonDisplay = document.getElementById('dragon-balance');
        const ghsDisplay = document.getElementById('ghs-speed-display');

        const welcomeModal = document.getElementById('welcome-modal');
        const boostModal = document.getElementById('boost-modal');
        const watchAdBtn = document.getElementById('watch-ad-btn');
        const adSimulation = document.getElementById('ad-simulation');
        const adProgress = document.getElementById('ad-progress');

        window.switchTab = (tabId) => {
            // Tab gizle/göster
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            const selectedTab = document.getElementById('tab-' + tabId);
            if(selectedTab) selectedTab.classList.add('active');

            // Nav buton stilleri
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-active'));
            const clickedBtn = document.getElementById('nav-' + tabId);
            if(clickedBtn) clickedBtn.classList.add('nav-active');

            // Haptic Feedback
            if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.selectionChanged();
        };

        function tick() {
            const now = Date.now();
            const elapsed = (now - lastClaimTime) / 1000;
            const perSecondReward = (ghsSpeed * 0.01) / 86400;
            currentMiningBalance = Math.max(0, elapsed * perSecondReward);
            
            miningDisplay.textContent = currentMiningBalance.toFixed(10);
            walletDisplay.textContent = totalWalletBalance.toFixed(8);
            dragonDisplay.textContent = dragonBalance;
            ghsDisplay.textContent = ghsSpeed.toFixed(2);
        }

        setInterval(tick, 100);

        function startSync(user) {
            currentUser = user;
            const docRef = doc(db, 'artifacts', contextAppId, 'users', user.uid, 'miner', 'data');
            onSnapshot(docRef, (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    totalWalletBalance = data.walletBalance || 0;
                    lastClaimTime = data.lastClaimTime || Date.now();
                    dragonBalance = data.dragonBalance || 0;
                    ghsSpeed = data.ghsSpeed || 11.0;
                } else {
                    welcomeModal.style.display = 'flex';
                }
            }, (err) => console.error(err));
        }

        async function saveToCloud() {
            if (!currentUser) return;
            const docRef = doc(db, 'artifacts', contextAppId, 'users', currentUser.uid, 'miner', 'data');
            await setDoc(docRef, {
                walletBalance: totalWalletBalance,
                lastClaimTime: lastClaimTime,
                dragonBalance: dragonBalance,
                ghsSpeed: ghsSpeed,
                updatedAt: serverTimestamp()
            }, { merge: true });
        }

        document.getElementById('collect-reward-btn').addEventListener('click', async () => {
            totalWalletBalance = 0.05;
            dragonBalance = 50;
            lastClaimTime = Date.now();
            ghsSpeed = 11.0;
            await saveToCloud();
            welcomeModal.style.display = 'none';
            if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        });

        document.getElementById('claim-btn').addEventListener('click', () => {
            if (currentMiningBalance > 0) {
                totalWalletBalance += currentMiningBalance;
                currentMiningBalance = 0;
                lastClaimTime = Date.now();
                saveToCloud();
                if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            }
        });

        document.getElementById('boost-trigger').onclick = () => boostModal.style.display = 'flex';
        document.getElementById('close-boost-btn').onclick = () => boostModal.style.display = 'none';

        watchAdBtn.addEventListener('click', async () => {
            watchAdBtn.disabled = true;
            watchAdBtn.style.opacity = '0.5';
            adSimulation.classList.remove('hidden');
            setTimeout(() => adProgress.style.width = '100%', 10);
            setTimeout(async () => {
                ghsSpeed += 0.01;
                await saveToCloud();
                adSimulation.classList.add('hidden');
                adProgress.style.width = '0';
                watchAdBtn.disabled = false;
                watchAdBtn.style.opacity = '1';
                if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            }, 3000);
        });

        signInAnonymously(auth).then(res => startSync(res.user));
    </script>
</body>
</html>
