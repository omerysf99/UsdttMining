<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Mining App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0b;
            color: white;
            user-select: none;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Boyuna çok az genişletilmiş (9:18 oranında) konteynır */
        .app-container {
            width: 100%;
            max-width: 380px; 
            aspect-ratio: 9 / 18;
            background-color: #000;
            display: flex;
            flex-direction: column;
            position: relative;
            max-height: 98vh;
            overflow: hidden;
            border: 1px solid #1a1a1a;
        }

        /* Fan Animasyonları */
        @keyframes rotate-fan {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .fan-animation {
            animation: rotate-fan 8s linear infinite;
        }

        .fan-animation.boosted {
            animation-duration: 2s;
        }

        /* Kart Stilleri */
        .glass-card {
            background: #1a1a1a;
            border-radius: 20px;
        }

        /* Buton Stilleri */
        .btn-purple {
            background-color: #7c66e3;
            transition: all 0.2s ease;
        }
        
        .btn-purple:active {
            transform: scale(0.95);
            background-color: #6b56d2;
        }

        /* Alt Navigasyon - Tamamen navi.jpg görseli kullanılır */
        .nav-footer {
            background-image: url('navi.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            height: 85px; /* Görselin tam sığması için yükseklik */
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            flex-shrink: 0;
            position: relative;
        }

        /* Tıklama Alanları - Görünmez butonlar */
        .nav-item {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            z-index: 10;
        }

        /* Sayıların yumuşak değişimi */
        .counter-text {
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.05em;
        }
        
        /* Merkez Logo Parlaması */
        .center-logo-glow {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Üst Bölüm: Bakiyeler -->
        <header class="p-4 space-y-3">
            <div class="glass-card p-3 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-[#0088cc] flex items-center justify-center overflow-hidden">
                        <img src="ton.jpg" alt="TON" class="w-7 h-7 object-contain" onerror="this.src='https://cryptologos.cc/logos/toncoin-ton-logo.png'">
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 font-medium">Balance</p>
                        <p class="font-bold text-sm tracking-wide" id="total-ton-header">0.0000 TON</p>
                    </div>
                </div>
                <div class="bg-[#2a2a2a] p-2 rounded-xl text-gray-300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256"><path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Z"></path></svg>
                </div>
            </div>

            <div class="glass-card p-3 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-[#1e293b] flex items-center justify-center overflow-hidden">
                        <img src="dragon.jpg" alt="TONIX" class="w-8 h-8 object-cover" onerror="this.src='https://cdn-icons-png.flaticon.com/512/10668/10668045.png'">
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 font-medium">Balance</p>
                        <p class="font-bold text-sm tracking-wide">0 TONIX</p>
                    </div>
                </div>
                <div class="bg-[#2a2a2a] p-2 rounded-xl text-gray-300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256"><path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Z"></path></svg>
                </div>
            </div>
        </header>

        <!-- Ana Bölüm: Madencilik -->
        <main id="view-home" class="flex-1 flex flex-col items-center justify-around px-6 py-4">
            <!-- Büyük Fan - Yuvarlak Kesim ve Merkezde TON Logosu -->
            <div class="relative w-64 h-64">
                <!-- Arka plan parlaması -->
                <div class="absolute inset-0 bg-blue-500/10 blur-[50px] rounded-full"></div>
                
                <!-- Dönen Fan -->
                <div class="w-full h-full overflow-hidden rounded-full border border-white/10 shadow-2xl fan-animation">
                    <img src="fan.jpg" id="main-fan-img" alt="Fan" class="w-full h-full object-cover" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3593/3593672.png'">
                </div>

                <!-- Sabit Merkez Logo -->
                <div class="absolute inset-0 flex items-center justify-center z-20 pointer-events-none">
                    <div class="w-16 h-16 bg-[#000] border-2 border-blue-400/50 rounded-full flex items-center justify-center center-logo-glow overflow-hidden">
                        <img src="ton.jpg" class="w-10 h-10 object-contain" alt="TON Center" onerror="this.src='https://cryptologos.cc/logos/toncoin-ton-logo.png'">
                    </div>
                </div>
            </div>

            <!-- Sayaç ve GH/s Bilgisi -->
            <div class="text-center">
                <h1 id="mining-counter" class="text-3xl font-bold counter-text mb-2 tracking-tight">0.0000000000 TON</h1>
                <div class="flex items-center justify-center gap-2 text-gray-500 font-semibold">
                    <span class="text-xs">ℹ️</span>
                    <span class="text-sm"><span id="ghs-value">6</span> GH/s</span>
                    <span class="text-orange-500 text-sm">⚡</span>
                </div>
            </div>

            <!-- Aksiyon Butonları -->
            <div class="flex gap-4 w-full px-2">
                <button onclick="claimMining()" class="btn-purple flex-1 py-4 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-indigo-500/10">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="white" viewBox="0 0 256 256"><path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Z"></path></svg>
                    Claim
                </button>
                <button onclick="boostMining()" class="btn-purple flex-1 py-4 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-indigo-500/10">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="white" viewBox="0 0 256 256"><path d="M213.66,122.34l-96-96a8,8,0,0,0-11.32,11.32L200.69,128,106.34,222.34a8,8,0,0,0,11.32,11.32l96-96A8,8,0,0,0,213.66,122.34Z"></path></svg>
                    Boost
                </button>
            </div>
        </main>

        <!-- Alt Navigasyon - Tamamen navi.jpg Arka Planı Üzerine Şeffaf Tıklama Alanları -->
        <footer class="nav-footer">
            <button onclick="switchTab('wallet', this)" class="nav-item"></button>
            <button onclick="switchTab('friends', this)" class="nav-item"></button>
            <button onclick="switchTab('home', this)" class="nav-item"></button>
            <button onclick="switchTab('missions', this)" class="nav-item"></button>
            <button onclick="switchTab('more', this)" class="nav-item"></button>
        </footer>

        <!-- Toast Mesajı -->
        <div id="toast" class="absolute bottom-28 left-1/2 -translate-x-1/2 bg-[#1a1a1a] border border-white/10 px-6 py-2 rounded-2xl text-xs font-bold opacity-0 transition-all duration-300 shadow-2xl z-50">
            Collected!
        </div>
    </div>

    <script>
        let minedAmount = 0.0000000000;
        let totalBalance = 0.0000;
        let hashrate = 6;
        let isBoosted = false;

        const counterEl = document.getElementById('mining-counter');
        const ghsEl = document.getElementById('ghs-value');
        const fanContainer = document.querySelector('.fan-animation');
        const toastEl = document.getElementById('toast');
        const headerBalanceEl = document.getElementById('total-ton-header');

        function updateMining() {
            const increment = (hashrate * 0.000000005) + (Math.random() * 0.000000001);
            minedAmount += increment;
            counterEl.innerText = minedAmount.toFixed(10) + " TON";
        }

        setInterval(updateMining, 100);

        function claimMining() {
            if (minedAmount > 0) {
                totalBalance += minedAmount;
                headerBalanceEl.innerText = totalBalance.toFixed(4) + " TON";
                minedAmount = 0;
                counterEl.innerText = "0.0000000000 TON";
                showToast("Success! TON Collected 💰");
            }
        }

        function boostMining() {
            if (isBoosted) return;
            isBoosted = true;
            hashrate *= 2;
            ghsEl.innerText = hashrate;
            fanContainer.classList.add('boosted');
            showToast("Boost Active! 2x Speed 🚀");
            setTimeout(() => {
                isBoosted = false;
                hashrate /= 2;
                ghsEl.innerText = hashrate;
                fanContainer.classList.remove('boosted');
            }, 5000);
        }

        function showToast(message) {
            toastEl.innerText = message;
            toastEl.style.opacity = "1";
            toastEl.style.bottom = "120px";
            setTimeout(() => {
                toastEl.style.opacity = "0";
                toastEl.style.bottom = "100px";
            }, 2000);
        }

        function switchTab(tab, element) {
            console.log("Switched to tab:", tab);
        }
    </script>
</body>
</html>
