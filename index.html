<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TONIX Miner Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000000;
            color: white;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }
        .balance-card {
            background: #111111;
            border-radius: 16px;
            padding: 12px 16px;
        }
        .fan-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto;
        }
        .fan-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .nav-active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }
        .tab-content {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .tab-content.active {
            display: block;
            opacity: 1;
        }
        .claim-btn {
            background: #5b5df2;
            box-shadow: 0 4px 15px rgba(91, 93, 242, 0.3);
        }
        .boost-btn {
            background: #7169e6;
            box-shadow: 0 4px 15px rgba(113, 105, 230, 0.3);
        }
        /* Modal Stili */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: #1a1a1a;
            border-radius: 24px;
            width: 100%;
            max-width: 320px;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Üst Bakiye Bilgileri -->
    <div class="p-4 pt-6 space-y-3">
        <!-- TON Card -->
        <div class="balance-card flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-[#0088cc] flex items-center justify-center">
                    <img src="ton.jpg" alt="TON" class="w-6 h-6" onerror="this.src='https://cryptologos.cc/logos/toncoin-ton-logo.png'">
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-semibold">Balance</p>
                    <p class="text-white font-extrabold text-lg tracking-tight"><span id="total-ton-balance">0.0000</span> TON</p>
                </div>
            </div>
            <div class="w-10 h-10 bg-[#333333] rounded-lg flex items-center justify-center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-300"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
            </div>
        </div>

        <!-- TONIX Card -->
        <div class="balance-card flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-900/30 flex items-center justify-center overflow-hidden border border-blue-500/20">
                    <img src="tonix.jpg" alt="TONIX" class="w-10 h-10 object-cover" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2584/2584606.png'">
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-semibold">Balance</p>
                    <p class="text-white font-extrabold text-lg tracking-tight"><span id="tonix-balance">500</span> TONIX</p>
                </div>
            </div>
            <div class="w-10 h-10 bg-[#333333] rounded-lg flex items-center justify-center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-300"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
            </div>
        </div>
    </div>

    <!-- Sekme İçerikleri -->
    <main class="flex-1">
        
        <!-- Ana Madencilik Sayfası -->
        <section id="tab-home" class="tab-content active h-full flex flex-col items-center justify-center px-6">
            <div class="fan-container mb-8">
                <img src="fan.jpg" alt="Fan" class="fan-image" onerror="this.src='https://cdn-icons-png.flaticon.com/512/911/911369.png'">
            </div>

            <div class="text-center mb-8">
                <h2 class="text-4xl font-extrabold text-white mb-2 tracking-tight">
                    <span id="mining-display">0.0000000000</span> <span class="text-white ml-2">TON</span>
                </h2>
                <div class="flex items-center justify-center gap-2 text-sm text-gray-400 font-bold">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" class="opacity-50"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                    <span id="ghs-speed-display">11.00</span> GH/s
                    <span class="text-orange-500">⚡</span>
                </div>
            </div>

            <div class="flex w-full gap-4">
                <button id="claim-btn" class="flex-1 claim-btn text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-95 transition-all">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    Claim
                </button>
                <button id="boost-trigger" class="flex-1 boost-btn text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-95 transition-all">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 11 12 6 7 11"/><polyline points="17 18 12 13 7 18"/></svg>
                    Boost
                </button>
            </div>
        </section>

        <!-- Diğer Sekmeler -->
        <section id="tab-wallet" class="tab-content h-full flex items-center justify-center">Cüzdan Paneli</section>
        <section id="tab-friends" class="tab-content h-full flex items-center justify-center text-gray-500 font-bold uppercase text-xs tracking-widest">Arkadaş Paneli</section>
        <section id="tab-missions" class="tab-content h-full flex items-center justify-center">Görevler Paneli</section>
        <section id="tab-more" class="tab-content h-full flex items-center justify-center">Ayarlar</section>
    </main>

    <!-- Boost Modal -->
    <div id="boost-modal" class="modal-overlay">
        <div class="modal-content p-6 flex flex-col items-center">
            <div class="w-16 h-16 bg-indigo-500/20 rounded-full flex items-center justify-center mb-4">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </div>
            <h3 class="text-xl font-bold mb-1">Hızını Artır!</h3>
            <p class="text-gray-500 text-xs text-center mb-6">Bir reklam izleyerek kalıcı olarak 0.01 GH/s kazanabilirsin.</p>
            
            <!-- Ad Simulation -->
            <div id="ad-simulation" class="hidden w-full mb-6">
                <div class="flex justify-between text-[10px] text-gray-400 mb-2 font-bold uppercase">Reklam İzleniyor...</div>
                <div class="w-full h-2 bg-white/5 rounded-full overflow-hidden">
                    <div id="ad-progress" class="h-full bg-indigo-500 w-0 transition-all duration-[3000ms] ease-linear"></div>
                </div>
            </div>

            <button id="watch-ad-btn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-500 transition-colors">
                [izle]
            </button>
            <button id="close-boost-btn" class="mt-4 text-gray-500 text-xs font-bold uppercase tracking-wider">Kapat</button>
        </div>
    </div>

    <!-- Navigasyon -->
    <nav class="h-20 bg-[#0a0a0a] border-t border-white/5 flex items-center justify-around px-2">
        <button onclick="switchTab('wallet')" class="nav-btn w-16 h-16 flex flex-col items-center justify-center gap-1 text-gray-500">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            <span class="text-[9px] font-bold">Wallet</span>
        </button>
        <button onclick="switchTab('friends')" class="nav-btn w-16 h-16 flex flex-col items-center justify-center gap-1 text-gray-500">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span class="text-[9px] font-bold">Friends</span>
        </button>
        <button onclick="switchTab('home')" class="nav-btn nav-active w-16 h-16 flex flex-col items-center justify-center gap-1">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
            <span class="text-[9px] font-bold">Home</span>
        </button>
        <button onclick="switchTab('missions')" class="nav-btn w-16 h-16 flex flex-col items-center justify-center gap-1 text-gray-500">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
            <span class="text-[9px] font-bold">Missions</span>
        </button>
        <button onclick="switchTab('more')" class="nav-btn w-16 h-16 flex flex-col items-center justify-center gap-1 text-gray-500">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
            <span class="text-[9px] font-bold">More</span>
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDi7IqV474UDMtrKyKuO-2pct5WxwSB3jQ",
            authDomain: "studio-9241589115-a403e.firebaseapp.com",
            projectId: "studio-9241589115-a403e",
            storageBucket: "studio-9241589115-a403e.firebasestorage.app",
            messagingSenderId: "1010284036381",
            appId: "1:1010284036381:web:cd6effcc67287c510e61f4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const contextAppId = typeof __app_id !== 'undefined' ? __app_id : 'tonix-miner-pro-v2';

        // State
        let ghsSpeed = 11.0;
        let totalWalletBalance = 0;
        let lastClaimTime = Date.now();
        let currentMiningBalance = 0;
        let tonixBalance = 500;
        let currentUser = null;

        const miningDisplay = document.getElementById('mining-display');
        const walletDisplay = document.getElementById('total-ton-balance');
        const tonixDisplay = document.getElementById('tonix-balance');
        const ghsDisplay = document.getElementById('ghs-speed-display');

        // Modal Elements
        const boostModal = document.getElementById('boost-modal');
        const watchAdBtn = document.getElementById('watch-ad-btn');
        const adSimulation = document.getElementById('ad-simulation');
        const adProgress = document.getElementById('ad-progress');

        // Tab Switching
        window.switchTab = (tabId) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-active', 'text-gray-500'));
            const selectedTab = document.getElementById('tab-' + tabId);
            if(selectedTab) selectedTab.classList.add('active');
            const clickedBtn = event.currentTarget || document.querySelector(`.nav-btn[onclick="switchTab('${tabId}')"]`);
            if(clickedBtn) clickedBtn.classList.add('nav-active');
            document.querySelectorAll('.nav-btn:not(.nav-active)').forEach(b => b.classList.add('text-gray-500'));
            if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.selectionChanged();
        };

        function tick() {
            const now = Date.now();
            const elapsed = (now - lastClaimTime) / 1000;
            // Reward calculation: 1 Gh/s = 0.01 TON daily
            const perSecondReward = (ghsSpeed * 0.01) / 86400;
            currentMiningBalance = Math.max(0, elapsed * perSecondReward);
            
            miningDisplay.textContent = currentMiningBalance.toFixed(10);
            walletDisplay.textContent = totalWalletBalance.toFixed(8);
            ghsDisplay.textContent = ghsSpeed.toFixed(2);
        }

        setInterval(tick, 100);

        function startSync(user) {
            currentUser = user;
            const docRef = doc(db, 'artifacts', contextAppId, 'users', user.uid, 'miner', 'data');
            onSnapshot(docRef, (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    totalWalletBalance = data.walletBalance || 0;
                    lastClaimTime = data.lastClaimTime || Date.now();
                    tonixBalance = data.tonixBalance || 500;
                    ghsSpeed = data.ghsSpeed || 11.0;
                    tonixDisplay.textContent = tonixBalance;
                } else {
                    saveToCloud();
                }
            }, (err) => console.error("Sync Error:", err));
        }

        async function saveToCloud() {
            if (!currentUser) return;
            const docRef = doc(db, 'artifacts', contextAppId, 'users', currentUser.uid, 'miner', 'data');
            await setDoc(docRef, {
                walletBalance: totalWalletBalance,
                lastClaimTime: lastClaimTime,
                tonixBalance: tonixBalance,
                ghsSpeed: ghsSpeed,
                updatedAt: serverTimestamp()
            }, { merge: true });
        }

        // Claim Logic
        document.getElementById('claim-btn').addEventListener('click', () => {
            if (currentMiningBalance > 0) {
                totalWalletBalance += currentMiningBalance;
                currentMiningBalance = 0;
                lastClaimTime = Date.now();
                saveToCloud();
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                }
            }
        });

        // Boost Modal Logic
        document.getElementById('boost-trigger').onclick = () => boostModal.style.display = 'flex';
        document.getElementById('close-boost-btn').onclick = () => boostModal.style.display = 'none';

        watchAdBtn.addEventListener('click', async () => {
            watchAdBtn.disabled = true;
            watchAdBtn.style.opacity = '0.5';
            adSimulation.classList.remove('hidden');
            
            // Start progress bar
            setTimeout(() => adProgress.style.width = '100%', 10);

            // Wait 3 seconds (simulated ad)
            setTimeout(async () => {
                ghsSpeed += 0.01;
                await saveToCloud();
                
                // Reset UI
                adSimulation.classList.add('hidden');
                adProgress.style.width = '0';
                watchAdBtn.disabled = false;
                watchAdBtn.style.opacity = '1';
                
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                }
                
                // Success feedback
                const originalText = ghsDisplay.parentElement.innerHTML;
                ghsDisplay.parentElement.classList.add('text-green-400');
                setTimeout(() => ghsDisplay.parentElement.classList.remove('text-green-400'), 1000);
            }, 3000);
        });

        signInAnonymously(auth).then(res => startSync(res.user));
    </script>
</body>
</html>
