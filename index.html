<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TONIX Miner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --tg-viewport-height: 100vh;
        }

        body {
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }

        /* 9:16 Mobil Oranı */
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100dvh;
            background-color: #0f0f0f;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 1rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
            box-sizing: border-box;
        }

        @media (min-height: 750px) and (min-width: 450px) {
            .app-container {
                height: 90vh;
                border-radius: 2.5rem;
                box-shadow: 0 0 100px rgba(0,0,0,0.9);
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.25rem;
        }

        /* Sekme İçerik Yönetimi - Çakışma Önleyici */
        .tab-content {
            display: none !important; 
            flex-direction: column;
            flex-grow: 1;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            animation: fadeIn 0.2s ease-in-out;
        }

        .tab-content.active {
            display: flex !important; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fan-container {
            position: relative;
            width: min(60vw, 220px);
            height: min(60vw, 220px);
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fan-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            animation: rotate-fan 4s linear infinite;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.15);
        }

        .fan-center-icon {
            position: absolute;
            width: 25%;
            height: 25%;
            border-radius: 50%;
            background: #1a1a1a;
            border: 2px solid rgba(255, 215, 0, 0.5);
            overflow: hidden;
            z-index: 10;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        /* Sol üstteki yatay dikdörtgen */
        .fan-decorator-rect {
            position: absolute;
            top: -10px;
            left: -30px;
            width: 80px;
            height: 24px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        @keyframes rotate-fan {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .mining-text {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .btn-primary {
            background: #8b5cf6;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .nav-item {
            color: #4b5563;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: #a78bfa;
        }

        .toast {
            animation: slideUp 0.3s ease-out;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        <!-- ÜST PANEL -->
        <div id="header" class="space-y-2 shrink-0 z-50">
            <!-- TON Bakiye -->
            <div class="glass-card p-3 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-sky-500 rounded-full overflow-hidden flex items-center justify-center border border-white/10 shadow-lg">
                        <img src="ton.jpg" class="w-full h-full object-cover" alt="TON" onerror="this.parentElement.innerHTML='<i class=\'fa-solid fa-gem text-lg\'></i>'">
                    </div>
                    <div>
                        <p class="text-[9px] uppercase tracking-widest text-gray-500 font-bold">Bakiye</p>
                        <p class="font-bold text-lg leading-tight"><span id="ton-balance">0.0000</span> TON</p>
                    </div>
                </div>
                <div class="w-8 h-8 bg-white/5 rounded-lg flex items-center justify-center">
                    <i class="fa-solid fa-wallet text-gray-600 text-sm"></i>
                </div>
            </div>

            <!-- TONIX Bakiye & Kağıt Dolar -->
            <div class="glass-card p-3 relative overflow-hidden">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-full overflow-hidden flex items-center justify-center border border-white/10 shadow-lg">
                            <img src="dragon.jpg" class="w-full h-full object-cover" alt="TONIX" onerror="this.parentElement.innerHTML='<i class=\'fa-solid fa-dragon text-lg\'></i>'">
                        </div>
                        <div>
                            <p class="text-[9px] uppercase tracking-widest text-gray-500 font-bold">Bakiye</p>
                            <p class="font-bold text-lg leading-tight"><span id="tonix-balance">0</span> TONIX</p>
                        </div>
                    </div>
                    <div class="w-8 h-8 bg-white/5 rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-wallet text-gray-600 text-sm"></i>
                    </div>
                </div>
                
                <!-- Kağıt Dolar Görseli -->
                <div class="flex items-center gap-2 mt-2 border-t border-white/5 pt-2">
                    <img src="dolar.jpg" class="h-10 w-24 object-contain rounded-md shadow-lg" alt="Dolar Banknot" onerror="this.parentElement.innerHTML='<p class=\'text-[10px] text-gray-500 font-bold\'>USD $</p>'">
                </div>
            </div>
        </div>

        <!-- ANA İÇERİK ALANI -->
        <div class="flex-grow flex flex-col overflow-hidden relative mt-2">
            
            <!-- HOME TAB -->
            <div id="home-tab" class="tab-content active text-center justify-around py-4">
                <div class="fan-container">
                    <!-- Fanın sol üstündeki yatay dikdörtgen -->
                    <div class="fan-decorator-rect"></div>
                    
                    <img src="fan.jpg" onerror="this.src='https://images.unsplash.com/photo-1591123120675-6f7f1aae0e5b?q=80&w=2069&auto=format&fit=crop'" class="fan-image" alt="Fan">
                    <div class="fan-center-icon">
                        <img src="dragon.jpg" class="w-full h-full object-cover" alt="Ejderha" onerror="this.parentElement.style.display='none'">
                    </div>
                </div>

                <div class="my-2">
                    <h1 class="text-3xl sm:text-4xl mining-text mb-1 tracking-tighter" id="mining-counter">0.0000000000</h1>
                    <p class="text-xl font-bold text-white/70 mb-3">TON</p>
                    <div class="inline-flex items-center gap-2 bg-white/5 px-4 py-1.5 rounded-full text-xs border border-white/10">
                        <span class="text-gray-400 font-medium"><strong class="text-white" id="hash-rate">1.0</strong> GH/s</span>
                        <i class="fa-solid fa-bolt text-orange-400"></i>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 px-2">
                    <button onclick="claimMining()" class="btn-primary p-4 rounded-xl flex items-center justify-center gap-2 font-bold shadow-lg shadow-purple-500/20">
                        <i class="fa-solid fa-coins"></i> Claim
                    </button>
                    <button class="bg-gray-800 text-gray-600 p-4 rounded-xl flex items-center justify-center gap-2 font-bold cursor-not-allowed">
                        <i class="fa-solid fa-rocket"></i> Boost
                    </button>
                </div>
            </div>

            <!-- ARKADAŞLAR TAB -->
            <div id="friends-tab" class="tab-content px-2 pt-6">
                <div class="text-center py-4">
                    <div class="w-16 h-16 bg-blue-500/10 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-blue-500/20">
                        <i class="fa-solid fa-user-group text-3xl text-blue-400"></i>
                    </div>
                    <h2 class="text-xl font-bold">Arkadaşlarını Çağır</h2>
                    <p class="text-gray-400 text-xs mt-1">Her davet için TONIX kazan!</p>
                </div>
                <div class="glass-card p-4 mb-4">
                    <p class="text-[10px] text-gray-500 font-bold uppercase mb-2">Referans Linkin</p>
                    <div class="flex gap-2">
                        <input type="text" readonly value="t.me/tonix_bot?start=r1" class="bg-black/40 border border-white/10 rounded-lg flex-grow p-2 text-xs text-gray-300 outline-none">
                        <button onclick="copyLink()" class="bg-blue-600 px-3 rounded-lg font-bold text-xs">Kopyala</button>
                    </div>
                </div>
                <div class="text-center text-gray-600 text-xs py-10 italic glass-card">Henüz kimseyi davet etmedin.</div>
            </div>

            <!-- GÖREVLER TAB -->
            <div id="missions-tab" class="tab-content px-2 pt-6">
                <div class="text-center py-4">
                    <h2 class="text-xl font-bold">Görevler</h2>
                    <p class="text-gray-400 text-xs mt-1">Ekstra TONIX kazanmak için tamamla.</p>
                </div>
                <div class="space-y-3">
                    <div class="glass-card p-3 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-blue-500/20 rounded-lg flex items-center justify-center text-blue-400"><i class="fa-brands fa-telegram text-xl"></i></div>
                            <div><p class="font-bold text-xs">Kanala Katıl</p><p class="text-[10px] text-green-400 font-bold">+100 TONIX</p></div>
                        </div>
                        <button onclick="showToast('Kontrol ediliyor...')" class="bg-white/10 px-4 py-2 rounded-lg text-[10px] font-bold">Yap</button>
                    </div>
                </div>
            </div>

            <!-- WALLET TAB -->
            <div id="wallet-tab" class="tab-content items-center justify-center text-center px-6">
                <i class="fa-solid fa-wallet text-5xl text-purple-500 mb-4 opacity-30"></i>
                <h2 class="text-lg font-bold">Cüzdan</h2>
                <p class="text-gray-500 text-xs">Çok Yakında!</p>
            </div>

            <!-- MORE TAB -->
            <div id="more-tab" class="tab-content items-center justify-center text-center px-6">
                <i class="fa-solid fa-gear text-5xl text-gray-700 mb-4 opacity-30"></i>
                <h2 class="text-lg font-bold">Ayarlar</h2>
                <p class="text-gray-500 text-xs">Geliştirme Aşamasında.</p>
            </div>
        </div>

        <!-- ALT NAVİGASYON -->
        <div id="footer" class="shrink-0 glass-card flex justify-around items-center p-1.5 mt-auto relative z-50 shadow-2xl">
            <button onclick="switchTab('wallet', this)" class="nav-item flex flex-col items-center gap-0.5 p-1.5 w-full outline-none">
                <i class="fa-solid fa-wallet text-lg"></i>
                <span class="text-[8px] font-bold uppercase tracking-tighter">Wallet</span>
            </button>
            <button onclick="switchTab('friends', this)" class="nav-item flex flex-col items-center gap-0.5 p-1.5 w-full outline-none">
                <i class="fa-solid fa-users text-lg"></i>
                <span class="text-[8px] font-bold uppercase tracking-tighter">Friends</span>
            </button>
            <button onclick="switchTab('home', this)" class="nav-item active flex flex-col items-center gap-0.5 p-1.5 w-full outline-none">
                <div class="bg-purple-600/20 w-9 h-9 rounded-lg flex items-center justify-center mb-[-2px]">
                     <i class="fa-solid fa-fan text-lg text-purple-400"></i>
                </div>
                <span class="text-[8px] font-bold uppercase tracking-tighter mt-1">Home</span>
            </button>
            <button onclick="switchTab('missions', this)" class="nav-item flex flex-col items-center gap-0.5 p-1.5 w-full outline-none">
                <i class="fa-solid fa-bullseye text-lg"></i>
                <span class="text-[8px] font-bold uppercase tracking-tighter">Missions</span>
            </button>
            <button onclick="switchTab('more', this)" class="nav-item flex flex-col items-center gap-0.5 p-1.5 w-full outline-none">
                <i class="fa-solid fa-bars-staggered text-lg"></i>
                <span class="text-[8px] font-bold uppercase tracking-tighter">More</span>
            </button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const webapp = window.Telegram.WebApp;
        if (webapp) {
            webapp.expand();
            webapp.ready();
        }

        const DAILY_RATE_PER_GH = 1.0;
        const SECONDS_IN_DAY = 86400;
        const TICK_MS = 100;

        let state = {
            tonBalance: 0.0,
            tonixBalance: 0,
            miningValue: 0.0,
            hashRate: 1.0,
            isMining: true
        };

        function startMining() {
            setInterval(() => {
                if (state.isMining) {
                    const increment = (DAILY_RATE_PER_GH / SECONDS_IN_DAY / (1000 / TICK_MS)) * state.hashRate;
                    state.miningValue += increment;
                    document.getElementById('mining-counter').innerText = state.miningValue.toFixed(10);
                }
            }, TICK_MS);
        }

        function claimMining() {
            if (state.miningValue <= 0.0000000001) return;
            state.tonBalance += state.miningValue;
            state.miningValue = 0;
            document.getElementById('ton-balance').innerText = state.tonBalance.toFixed(4);
            document.getElementById('mining-counter').innerText = "0.0000000000";
            
            state.tonixBalance += Math.floor(Math.random() * 3) + 1;
            document.getElementById('tonix-balance').innerText = state.tonixBalance;
            
            showToast("TON Başarıyla Toplandı!");
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            
            const targetTab = document.getElementById(tabId + '-tab');
            if (targetTab) targetTab.classList.add('active');
            element.classList.add('active');
        }

        function copyLink() {
            const link = "t.me/tonix_bot?start=r1";
            navigator.clipboard.writeText(link).then(() => showToast("Link Kopyalandı!"));
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = "toast fixed bottom-28 left-1/2 -translate-x-1/2 bg-white text-black px-6 py-2.5 rounded-full font-bold text-xs z-[100]";
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        window.onload = () => {
            startMining();
            if (webapp) {
                const adjustHeight = () => {
                    document.getElementById('app').style.height = webapp.viewportHeight + 'px';
                };
                webapp.onEvent('viewportChanged', adjustHeight);
                adjustHeight();
            }
        };
    </script>
</body>
</html>
