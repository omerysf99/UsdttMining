<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Mining App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: white;
            user-select: none;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 9:16 En-Boy Oranı Konteynırı */
        .app-container {
            width: 100%;
            max-width: 380px; 
            aspect-ratio: 9 / 16;
            background-color: #000;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid #1a1a1a;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            max-height: 100vh;
            overflow: hidden;
        }

        /* Fan Dönme Animasyonu */
        @keyframes rotate-fan {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .fan-animation {
            animation: rotate-fan 4s linear infinite;
        }

        .fan-animation.boosted {
            animation-duration: 1s;
        }

        /* Cam Efekti Kartlar */
        .glass-card {
            background: #121212;
            border: 1px solid #222;
        }

        /* Navigasyon Stilleri - navi.jpg tamamen görseli sağlar */
        .nav-footer {
            background-image: url('navi.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            height: 65px; 
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            position: relative;
            flex-shrink: 0;
        }

        /* Tıklama Alanları - Görünmez butonlar */
        .nav-item {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            z-index: 10;
        }

        /* Aktif olanı hafifçe belli etmek için */
        .nav-item.active {
            background: rgba(255, 255, 255, 0.03);
        }

        /* Buton Efektleri */
        .btn-active:active {
            transform: scale(0.95);
        }

        /* Sayıların yumuşak değişimi */
        .counter-text {
            font-variant-numeric: tabular-nums;
        }
        
        @media (max-height: 650px) {
            .main-fan-wrapper { width: 110px; height: 110px; }
            .mining-title { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Üst Bölüm: Bakiyeler -->
        <header class="p-3 space-y-2">
            <div class="glass-card rounded-xl p-2 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-7 h-7 rounded-full overflow-hidden border border-blue-500/30 flex items-center justify-center bg-blue-500/10 shadow-lg shadow-blue-500/10">
                        <img src="ton.jpg" alt="TON" class="w-full h-full object-cover" onerror="this.src='https://cryptologos.cc/logos/toncoin-ton-logo.png'">
                    </div>
                    <div>
                        <p class="text-[9px] text-gray-500 font-medium leading-none mb-1">Bakiye</p>
                        <p class="font-bold text-[11px] tracking-wide" id="total-ton">7.6823 TON</p>
                    </div>
                </div>
                <button class="bg-[#1e1e1e] p-1.5 rounded-lg text-indigo-400 btn-active border border-white/5">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 256 256"><path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Z"></path></svg>
                </button>
            </div>

            <div class="glass-card rounded-xl p-2 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-7 h-7 rounded-full overflow-hidden border border-blue-400/30 flex items-center justify-center bg-blue-400/10 shadow-lg shadow-blue-400/10">
                        <img src="dragon.jpg" alt="TONIX" class="w-full h-full object-cover" onerror="this.src='https://cdn-icons-png.flaticon.com/512/10668/10668045.png'">
                    </div>
                    <div>
                        <p class="text-[9px] text-gray-500 font-medium leading-none mb-1">Bakiye</p>
                        <p class="font-bold text-[11px] tracking-wide">500 TONIX</p>
                    </div>
                </div>
                <button class="bg-[#1e1e1e] p-1.5 rounded-lg text-indigo-400 btn-active border border-white/5">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 256 256"><path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Z"></path></svg>
                </button>
            </div>
        </header>

        <!-- Ana Bölüm: Madencilik Alanı -->
        <main id="view-home" class="flex-1 flex flex-col items-center justify-center px-6 transition-all duration-300">
            <!-- Fan Bölümü - Daha Kompakt -->
            <div class="relative w-40 h-40 mb-5 main-fan-wrapper">
                <div class="absolute inset-0 bg-blue-600/5 blur-[40px] rounded-full"></div>
                <div id="main-fan" class="fan-animation relative z-10 w-full h-full overflow-hidden rounded-full border-2 border-white/5 shadow-2xl">
                    <img src="fan.jpg" alt="Fan" class="w-full h-full object-cover" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3593/3593672.png'">
                </div>
            </div>

            <div class="text-center">
                <h1 id="mining-counter" class="text-xl font-bold counter-text tracking-tighter mb-1.5 mining-title">0.0000000000 TON</h1>
                <div class="inline-flex items-center justify-center gap-1.5 text-gray-400 bg-white/5 py-1 px-3.5 rounded-full border border-white/5">
                    <span class="text-[9px]">ℹ️</span>
                    <span class="text-[10px] font-semibold tracking-tight"><span id="ghs-value">6</span> GH/s</span>
                    <span class="text-orange-500 text-[10px]">⚡</span>
                </div>
            </div>

            <!-- Butonlar - Küçültüldü -->
            <div class="grid grid-cols-2 gap-3 w-4/5 mt-5">
                <button onclick="claimMining()" class="bg-[#7c66e3] hover:bg-[#6b56d2] py-1.5 rounded-xl font-bold flex items-center justify-center gap-1.5 btn-active transition-all shadow-lg shadow-indigo-500/10">
                    <span class="text-xs">💰</span>
                    <span class="text-[11px] uppercase tracking-wide">Topla</span>
                </button>
                <button onclick="boostMining()" class="bg-[#1a1a1a] hover:bg-[#222] border border-white/10 py-1.5 rounded-xl font-bold flex items-center justify-center gap-1.5 btn-active transition-all">
                    <span class="text-xs">🚀</span>
                    <span class="text-[11px] text-gray-300 uppercase tracking-wide">Hızlandır</span>
                </button>
            </div>
        </main>

        <!-- Diğer Sekmeler (Gizli) -->
        <div id="view-wallet" class="hidden flex-1 p-6 flex flex-col items-center justify-center text-center">
            <div class="w-14 h-14 bg-blue-500/20 rounded-full flex items-center justify-center mx-auto mb-3">
                <span class="text-xl">👛</span>
            </div>
            <h2 class="text-lg font-bold mb-1">Cüzdanım</h2>
            <p class="text-[10px] text-gray-400">Kazançlarınızı yönetin</p>
        </div>

        <div id="view-friends" class="hidden flex-1 p-6 flex flex-col items-center justify-center text-center">
            <h2 class="text-lg font-bold mb-1">Arkadaşlar</h2>
            <p class="text-[10px] text-gray-400">Arkadaşlarını davet et</p>
        </div>

        <!-- Alt Navigasyon - navi.jpg Arka Planı Üzerine Şeffaf Butonlar -->
        <footer class="nav-footer pb-4">
            <button onclick="switchTab('wallet', this)" class="nav-item"></button>
            <button onclick="switchTab('friends', this)" class="nav-item"></button>
            <button onclick="switchTab('home', this)" class="nav-item active"></button>
            <button onclick="switchTab('missions', this)" class="nav-item"></button>
            <button onclick="switchTab('more', this)" class="nav-item"></button>
        </footer>

        <!-- Bildirim -->
        <div id="toast" class="absolute bottom-20 left-1/2 -translate-x-1/2 bg-white/10 backdrop-blur-xl border border-white/20 px-6 py-2 rounded-xl text-[10px] font-bold opacity-0 pointer-events-none transition-all duration-300 shadow-2xl z-50">
            Toplandı!
        </div>
    </div>

    <script>
        let minedAmount = 0.0000000000;
        let totalBalance = 7.6823;
        let hashrate = 6;
        let isBoosted = false;

        const counterEl = document.getElementById('mining-counter');
        const balanceEl = document.getElementById('total-ton');
        const ghsEl = document.getElementById('ghs-value');
        const fanEl = document.getElementById('main-fan');
        const toastEl = document.getElementById('toast');

        function updateMining() {
            const increment = (hashrate * 0.000000005) + (Math.random() * 0.000000001);
            minedAmount += increment;
            counterEl.innerText = minedAmount.toFixed(10) + " TON";
        }

        setInterval(updateMining, 100);

        function claimMining() {
            if (minedAmount < 0.000001) {
                showToast("Miktar yetersiz!");
                return;
            }
            totalBalance += minedAmount;
            minedAmount = 0;
            balanceEl.innerText = totalBalance.toFixed(4) + " TON";
            counterEl.innerText = "0.0000000000 TON";
            showToast("Başarılı! TON Toplandı 💰");
        }

        function boostMining() {
            if (isBoosted) return;
            isBoosted = true;
            hashrate *= 2;
            ghsEl.innerText = hashrate;
            fanEl.classList.add('boosted');
            showToast("2x Hız Aktif! 🚀");
            setTimeout(() => {
                isBoosted = false;
                hashrate /= 2;
                ghsEl.innerText = hashrate;
                fanEl.classList.remove('boosted');
                showToast("Hızlandırma Bitti");
            }, 10000);
        }

        function showToast(message) {
            toastEl.innerText = message;
            toastEl.style.opacity = "1";
            toastEl.style.transform = "translateX(-50%) translateY(-10px)";
            setTimeout(() => {
                toastEl.style.opacity = "0";
                toastEl.style.transform = "translateX(-50%) translateY(0px)";
            }, 2500);
        }

        function switchTab(tab, element) {
            const tabs = ['home', 'wallet', 'friends', 'missions', 'more'];
            tabs.forEach(t => {
                const view = document.getElementById('view-' + t);
                if (view) view.classList.add('hidden');
            });
            const navButtons = document.querySelectorAll('footer .nav-item');
            navButtons.forEach(btn => {
                btn.classList.remove('active');
            });
            const targetView = document.getElementById('view-' + tab);
            if (targetView) targetView.classList.remove('hidden');
            element.classList.add('active');
        }
    </script>
</body>
</html>
