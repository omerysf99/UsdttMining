<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Kütüphanesi | Güvenli Giriş</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .hidden { display: none; }
        .admin-badge {
            background: linear-gradient(135deg, #4f46e5, #3730a3);
        }
        .code-input {
            letter-spacing: 0.5em;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .pdf-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pdf-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50">

    <div class="container mx-auto px-4 py-8 flex flex-col items-center">
        
        <!-- Giriş Ekranı -->
        <div id="auth-ui" class="glass-card w-full max-w-md p-10 rounded-[2rem] mt-12">
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-indigo-600 rounded-3xl shadow-xl shadow-indigo-200 mb-6">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">PDF Kütüphanesi</h1>
                <p class="text-slate-500 mt-2 font-medium">Bilgiye giden en güvenli yol</p>
            </div>

            <div class="space-y-6">
                <div class="space-y-4">
                    <div class="relative">
                        <input type="email" id="email" placeholder="E-posta adresi" class="w-full pl-4 pr-4 py-3.5 rounded-2xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500 transition-all bg-slate-50/50">
                    </div>
                    <div class="relative">
                        <input type="password" id="password" placeholder="Şifre" class="w-full pl-4 pr-4 py-3.5 rounded-2xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500 transition-all bg-slate-50/50">
                    </div>
                    
                    <div class="flex flex-col gap-3">
                        <button onclick="handleEmailAuth('signin')" id="signin-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-indigo-100 hover:bg-indigo-700 active:scale-[0.98] transition-all">Giriş Yap</button>
                        <button onclick="handleEmailAuth('signup')" id="signup-btn" class="w-full bg-white border-2 border-slate-100 text-slate-700 py-3.5 rounded-2xl font-bold hover:bg-slate-50 active:scale-[0.98] transition-all">Yeni Hesap Oluştur</button>
                    </div>
                </div>

                <div class="relative flex items-center justify-center">
                    <div class="flex-grow border-t border-slate-100"></div>
                    <span class="flex-shrink mx-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Veya şununla bağlan</span>
                    <div class="flex-grow border-t border-slate-100"></div>
                </div>

                <button onclick="signInWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-200 text-slate-700 py-3.5 rounded-2xl font-semibold hover:border-indigo-300 transition-all">
                    <svg class="w-5 h-5" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>
                    Google Hesabı
                </button>
            </div>
        </div>

        <!-- E-posta Doğrulama Ekranı -->
        <div id="verify-ui" class="hidden glass-card w-full max-w-md p-10 rounded-[2.5rem] text-center">
            <div class="w-20 h-20 bg-amber-50 text-amber-500 rounded-3xl flex items-center justify-center mx-auto mb-6">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-4">Kodunuzu Girin</h2>
            <p class="text-slate-500 mb-8 px-4 text-sm">Güvenliğiniz için e-postanıza 6 haneli bir onay kodu gönderdik.</p>
            <input type="text" id="verification-code" maxlength="6" class="w-full code-input border-2 border-slate-100 rounded-2xl py-5 mb-8 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 transition-all bg-slate-50" placeholder="000000">
            <button onclick="verifyCode()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 active:scale-[0.98] transition-all shadow-lg shadow-indigo-100">Kodu Doğrula</button>
            <button onclick="signOutUser()" class="mt-6 text-sm text-slate-400 hover:text-indigo-600 font-bold uppercase tracking-wider transition-all">Geri Dön</button>
        </div>

        <!-- Ana Uygulama Ekranı -->
        <div id="main-ui" class="hidden w-full max-w-6xl space-y-8">
            <!-- Üst Header -->
            <div class="flex flex-col md:flex-row justify-between items-center gap-6 bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                <div class="flex items-center gap-5">
                    <div class="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-indigo-100">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                    </div>
                    <div>
                        <h2 class="text-2xl font-black text-slate-900 leading-tight">Dijital Kütüphanem</h2>
                        <p id="user-info" class="text-indigo-600 font-bold text-xs uppercase tracking-widest mt-1"></p>
                    </div>
                </div>
                
                <div class="flex items-center gap-4 w-full md:w-auto">
                    <div class="relative flex-grow md:flex-grow-0">
                        <input type="text" id="search-input" oninput="filterPdfs()" placeholder="Dosya ara..." class="w-full md:w-64 pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                        <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    </div>
                    <button onclick="signOutUser()" class="p-2.5 bg-slate-50 text-slate-400 rounded-xl hover:bg-red-50 hover:text-red-500 transition-all border border-slate-100">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                    </button>
                </div>
            </div>

            <!-- Admin Paneli (Gelişmiş) -->
            <div id="admin-panel" class="hidden bg-slate-900 p-10 rounded-[2.5rem] text-white shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 right-0 w-64 h-64 bg-indigo-600/10 rounded-full -mr-32 -mt-32 blur-3xl"></div>
                
                <div class="relative z-10">
                    <div class="flex items-center gap-3 mb-8">
                        <span class="admin-badge px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-tighter">Yönetim Paneli</span>
                        <h3 class="text-xl font-bold">Kütüphaneye Yeni Yayın Ekle</h3>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-400 uppercase ml-1">Kitap / Belge Adı</label>
                            <input type="text" id="pdf-name" placeholder="Örn: 2024 Kimya Müfredatı" class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl px-5 py-4 outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder:text-slate-600">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-400 uppercase ml-1">Dropbox Paylaşım Bağlantısı</label>
                            <input type="text" id="pdf-link" placeholder="https://www.dropbox.com/s/..." class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl px-5 py-4 outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder:text-slate-600">
                        </div>
                    </div>
                    
                    <button onclick="addNewPdf()" class="mt-8 w-full bg-indigo-500 hover:bg-indigo-400 py-4 rounded-2xl font-black text-sm uppercase tracking-widest transition-all shadow-lg shadow-indigo-900/20 active:scale-[0.99]">
                        Sisteme Kaydet ve Yayınla
                    </button>
                </div>
            </div>

            <!-- PDF Listesi Izgarası -->
            <div id="pdf-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Dinamik olarak buraya eklenecek -->
            </div>
        </div>

        <!-- Bildirim Sistemi -->
        <div id="message-box" class="fixed bottom-6 right-6 px-6 py-4 rounded-2xl shadow-2xl hidden z-50 animate-bounce transition-all duration-500 border-l-8"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, GoogleAuthProvider, signInWithPopup, 
            createUserWithEmailAndPassword, signInWithEmailAndPassword,
            onAuthStateChanged, signOut
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, collection, addDoc, onSnapshot, query, orderBy, setDoc, doc, getDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoJmNT86J_GoBUG-X2TrGOHPtK258kaBM",
            authDomain: "aaa123-468db.firebaseapp.com",
            projectId: "aaa123-468db",
            storageBucket: "aaa123-468db.firebasestorage.app",
            messagingSenderId: "277639579187",
            appId: "1:277639579187:web:f51052399a8d44f2308546"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAIL = "algiritmi@gmail.com";
        const apiKey = ""; 

        let allPdfs = [];

        function showMessage(msg, type = 'error') {
            const box = document.getElementById('message-box');
            box.innerText = msg;
            if(type === 'error') {
                box.className = "fixed bottom-6 right-6 px-6 py-4 rounded-2xl shadow-2xl z-50 border-l-8 bg-white text-red-600 border-red-500 font-bold flex items-center gap-3";
            } else {
                box.className = "fixed bottom-6 right-6 px-6 py-4 rounded-2xl shadow-2xl z-50 border-l-8 bg-white text-indigo-600 border-indigo-500 font-bold flex items-center gap-3";
            }
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4000);
        }

        const generateCode = () => Math.floor(100000 + Math.random() * 900000).toString();

        async function sendVerificationEmail(email, code) {
            try {
                await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Kullanıcı: ${email}. Kod: ${code}. Mesaj: PDF Kütüphanesi giriş kodunuz: ${code}` }] }]
                    })
                });
            } catch (e) { console.error(e); }
        }

        window.handleEmailAuth = async (type) => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            if (!email || !pass) return showMessage("Eksik bilgi girdiniz!");

            try {
                if (type === 'signup') {
                    const result = await createUserWithEmailAndPassword(auth, email, pass);
                    const code = generateCode();
                    await setDoc(doc(db, "pending_verifications", result.user.uid), {
                        code: code,
                        email: email,
                        verified: false
                    });
                    await sendVerificationEmail(email, code);
                    showMessage("Doğrulama kodu mailinize yollandı!", "success");
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch (e) { showMessage("İşlem başarısız: " + e.message); }
        };

        window.verifyCode = async () => {
            const user = auth.currentUser;
            const inputCode = document.getElementById('verification-code').value;
            if (!user) return;

            const docRef = doc(db, "pending_verifications", user.uid);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists() && docSnap.data().code === inputCode) {
                await setDoc(docRef, { verified: true }, { merge: true });
                showMessage("Başarıyla doğrulandı!", "success");
                location.reload();
            } else {
                showMessage("Hatalı kod girdiniz.");
            }
        };

        window.filterPdfs = () => {
            const term = document.getElementById('search-input').value.toLowerCase();
            const filtered = allPdfs.filter(pdf => pdf.name.toLowerCase().includes(term));
            renderPdfs(filtered);
        }

        function renderPdfs(list) {
            const pdfListDiv = document.getElementById('pdf-list');
            pdfListDiv.innerHTML = "";
            
            if (list.length === 0) {
                pdfListDiv.innerHTML = `<div class="col-span-full text-center py-20 bg-white rounded-3xl border-2 border-dashed border-slate-200 text-slate-400 font-medium">Aradığınız kriterde dosya bulunamadı.</div>`;
                return;
            }

            list.forEach((data) => {
                pdfListDiv.innerHTML += `
                    <div class="pdf-card bg-white p-7 rounded-[2rem] border border-slate-100 flex flex-col items-center text-center">
                        <div class="w-20 h-24 bg-red-50 rounded-2xl flex flex-col items-center justify-center mb-6 relative group-hover:scale-105 transition-all">
                            <span class="text-[10px] font-black text-red-500 uppercase mb-1">PDF</span>
                            <svg class="w-10 h-10 text-red-400" fill="currentColor" viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 012 2v14a2 2 0 01-2 2H7a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>
                        </div>
                        <h4 class="font-bold text-slate-800 mb-6 text-sm leading-snug line-clamp-2 h-10">${data.name}</h4>
                        <a href="${data.link}" target="_blank" class="w-full bg-slate-50 text-slate-900 border border-slate-200 py-3 rounded-xl text-xs font-black uppercase tracking-tighter hover:bg-indigo-600 hover:text-white hover:border-indigo-600 transition-all">
                            Belgeyi İncele
                        </a>
                    </div>`;
            });
        }

        onAuthStateChanged(auth, async (user) => {
            const authUi = document.getElementById('auth-ui');
            const verifyUi = document.getElementById('verify-ui');
            const mainUi = document.getElementById('main-ui');
            const adminPanel = document.getElementById('admin-panel');

            if (user) {
                authUi.classList.add('hidden');
                if (user.email !== ADMIN_EMAIL) {
                    const docSnap = await getDoc(doc(db, "pending_verifications", user.uid));
                    const isVerified = docSnap.exists() && docSnap.data().verified;
                    if (!isVerified) {
                        verifyUi.classList.remove('hidden');
                        mainUi.classList.add('hidden');
                        return;
                    }
                }
                verifyUi.classList.add('hidden');
                mainUi.classList.remove('hidden');
                document.getElementById('user-info').innerText = user.email;
                if (user.email === ADMIN_EMAIL) adminPanel.classList.remove('hidden');
                
                const q = query(collection(db, "pdfs"), orderBy("createdAt", "desc"));
                onSnapshot(q, (snapshot) => {
                    allPdfs = [];
                    snapshot.forEach(d => allPdfs.push(d.data()));
                    renderPdfs(allPdfs);
                });
            } else {
                authUi.classList.remove('hidden');
                verifyUi.classList.add('hidden');
                mainUi.classList.add('hidden');
            }
        });

        window.addNewPdf = async () => {
            const name = document.getElementById('pdf-name').value;
            const link = document.getElementById('pdf-link').value;
            if (!name || !link) return showMessage("Lütfen tüm alanları doldurun.");
            await addDoc(collection(db, "pdfs"), { name, link, createdAt: Date.now() });
            document.getElementById('pdf-name').value = "";
            document.getElementById('pdf-link').value = "";
            showMessage("Yayın başarıyla kütüphaneye eklendi!", "success");
        };

        window.signOutUser = () => signOut(auth);
        window.signInWithGoogle = () => signInWithPopup(auth, new GoogleAuthProvider());
    </script>
</body>
</html>
