<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DRAGON Miner Pro</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Reklam SDK -->
    <script src='//libtl.com/sdk.js' data-zone='10839932' data-sdk='show_10839932'></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #5b5df2;
            --accent-color: #7169e6;
            --bg-dark: #000000;
            --card-bg: #111111;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
            height: 100dvh;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        #telegram-only-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }
        .app-container {
            width: 100%;
            height: 100%;
            max-width: 500px;
            display: none; 
            flex-direction: column;
            position: relative;
            background-color: #000;
        }
        .header-section {
            padding: 12px 16px 4px 16px;
            flex-shrink: 0;
        }
        .balance-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
        }
        .main-content {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 0 20px;
            scrollbar-width: none;
        }
        .main-content::-webkit-scrollbar { display: none; }

        .fan-container {
            position: relative;
            width: 55vw;
            height: 55vw;
            max-width: 210px;
            max-height: 210px;
            flex-shrink: 0;
            margin: 10px auto;
        }
        .fan-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            animation: spin 2.5s linear infinite;
            box-shadow: 0 0 45px rgba(91, 93, 242, 0.2);
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .nav-bar {
            height: 85px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 10px 10px 10px;
            background: linear-gradient(to top, #000 70%, rgba(0,0,0,0.8));
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 50;
        }
        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 55px;
            color: #444;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .nav-emoji { font-size: 20px; filter: grayscale(1); margin-bottom: 2px; }
        .nav-active { color: #fff; transform: translateY(-6px); }
        .nav-active .nav-emoji { filter: grayscale(0); font-size: 24px; }
        .nav-active::after {
            content: ''; position: absolute; bottom: -2px; width: 6px; height: 6px;
            background: var(--primary-color); border-radius: 50%; box-shadow: 0 0 10px var(--primary-color);
        }

        .tab-content { display: none; width: 100%; min-height: 100%; flex-direction: column; opacity: 0; transition: opacity 0.3s; }
        .tab-content.active { display: flex; opacity: 1; }

        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.96);
            backdrop-filter: blur(12px); z-index: 100; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content {
            background: #0a0a0a; border-radius: 28px; width: 100%; max-width: 340px;
            border: 1px solid rgba(255,255,255,0.08); max-height: 90vh; display: flex; flex-direction: column;
        }
        .modal-body { padding: 20px; overflow-y: auto; }

        .withdraw-input-group {
            background: #111; border: 1px solid rgba(255,255,255,0.05); border-radius: 18px;
            padding: 14px 18px; width: 100%; display: flex; align-items: center; gap: 10px;
        }
        .withdraw-input-group input { background: transparent; border: none; outline: none; color: white; font-size: 14px; width: 100%; font-weight: 600; }
        
        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: #1a1a1a; border: 1px solid #333; padding: 12px 24px; border-radius: 20px;
            z-index: 1000; transition: transform 0.4s; display: flex; align-items: center; gap: 10px;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        .status-badge {
            background: rgba(34, 197, 94, 0.1); color: #22c55e; padding: 5px 14px;
            border-radius: 12px; font-size: 9px; font-weight: 800; border: 1px solid rgba(34, 197, 94, 0.2);
            width: fit-content; margin: 0 auto;
        }
        .mission-card {
            background: #111; border-radius: 24px; padding: 16px; border: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; gap: 15px; margin-bottom: 12px;
        }
        .invite-btn-purple {
            background: var(--accent-color);
            color: white;
            font-weight: 800;
            padding: 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            transition: all 0.1s;
            box-shadow: 0 4px 15px rgba(113, 105, 230, 0.3);
        }
        .invite-btn-purple:active { transform: scale(0.97); }

        /* Admin Styles */
        .admin-input {
            background: #000; border: 1px solid #333; border-radius: 12px; padding: 12px;
            color: white; font-size: 12px; width: 100%; outline: none; margin-bottom: 10px;
        }
        .admin-card {
            background: #111; border: 1px solid #333; border-radius: 20px; padding: 20px; margin-top: 20px;
        }

        .sync-indicator {
            position: fixed; top: 15px; right: 15px; 
            display: flex; align-items: center; gap: 6px;
            background: rgba(16, 185, 129, 0.1); padding: 4px 10px; border-radius: 100px;
            border: 1px solid rgba(16, 185, 129, 0.2); z-index: 100;
        }
    </style>
</head>
<body>

    <!-- Bildirim Baloncuğu -->
    <div id="toast">
        <span id="toast-emoji">✅</span>
        <span id="toast-text" class="text-xs font-bold uppercase tracking-widest">İşlem Başarılı</span>
    </div>

    <!-- Senkronizasyon Göstergesi -->
    <div class="sync-indicator">
        <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div>
        <span class="text-[8px] font-black text-emerald-400 uppercase tracking-tighter">Live Sync</span>
    </div>

    <div id="telegram-only-overlay">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=dragon" class="w-20 h-20 rounded-full mb-6 border-2 border-indigo-500 animate-pulse">
        <h2 class="text-xl font-black mb-2 uppercase" style="color:white">Giriş Engellendi</h2>
        <p class="text-gray-500 text-xs px-10 leading-relaxed">Lütfen bu uygulamayı mobil Telegram uygulaması üzerinden açın.</p>
    </div>

    <div class="app-container" id="main-app-container">
        <header class="header-section">
            <!-- TON Bakiye Kartı -->
            <div class="balance-card flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img src="https://cryptologos.cc/logos/toncoin-ton-logo.png" class="w-10 h-10 rounded-full shadow-lg shadow-blue-500/20">
                    <div>
                        <p class="text-[8px] text-gray-500 font-black uppercase">TON Bakiye</p>
                        <p class="text-white font-black text-sm tracking-tight"><span id="total-ton-balance">0.0000</span></p>
                    </div>
                </div>
                <button onclick="window.openWithdraw('TON')" class="w-9 h-9 bg-[#222] rounded-xl flex items-center justify-center active:scale-90 transition-transform">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                </button>
            </div>

            <!-- DRAGON Bakiye Kartı -->
            <div class="balance-card flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=dragon" class="w-10 h-10 rounded-full shadow-lg shadow-orange-500/20">
                    <div>
                        <p class="text-[8px] text-gray-500 font-black uppercase">$DRAGON</p>
                        <p class="text-white font-black text-sm tracking-tight"><span id="dragon-balance">0</span></p>
                    </div>
                </div>
                <button onclick="window.openWithdraw('DRAGON')" class="w-9 h-9 bg-[#222] rounded-xl flex items-center justify-center active:scale-90 transition-transform">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                </button>
            </div>
        </header>

        <main class="main-content">
            <!-- ANA SAYFA TAB -->
            <section id="tab-home" class="tab-content active items-center justify-center">
                <div class="status-badge"><div class="inline-block w-1.5 h-1.5 bg-green-500 rounded-full mr-2 shadow-[0_0_8px_#22c55e]"></div>7/24 AKTİF BULUT KAZIM</div>
                <div class="flex-1 flex flex-col items-center justify-center min-h-[250px]">
                    <div class="fan-container"><img src="https://api.dicebear.com/7.x/identicon/svg?seed=fan" class="fan-image"></div>
                    <div class="text-center">
                        <h2 class="text-3xl font-black text-white tracking-tighter mb-1"><span id="mining-display">0.0000000000</span> <span class="text-blue-500 text-lg">TON</span></h2>
                        <div class="flex flex-col items-center gap-1.5">
                            <div class="inline-flex items-center gap-2 bg-[#111] px-5 py-2 rounded-full border border-white/5">
                                <span id="ghs-speed-display" class="text-xs font-bold text-gray-400">11.00</span>
                                <span class="text-[10px] font-black text-orange-500 uppercase tracking-widest">GH/S ⚡</span>
                            </div>
                            <div class="text-[9px] font-black text-gray-500 uppercase tracking-widest bg-white/5 px-3 py-1 rounded-full border border-white/5">
                                Günlük: <span id="daily-yield-display" class="text-green-400">0.11</span> TON
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex w-full gap-4 mb-6">
                    <button id="claim-btn" class="flex-1 bg-gradient-to-br from-[#5b5df2] to-[#4042b8] py-4 rounded-2xl font-black text-[11px] uppercase tracking-widest active:scale-95 transition-all shadow-lg shadow-blue-900/20">Aktar</button>
                    <button id="boost-trigger" class="flex-1 bg-gradient-to-br from-[#7169e6] to-[#5a52c7] py-4 rounded-2xl font-black text-[11px] uppercase tracking-widest active:scale-95 transition-all shadow-lg shadow-indigo-900/30">Hızlandır</button>
                </div>
            </section>

            <!-- CÜZDAN SEKMESİ -->
            <section id="tab-wallet" class="tab-content py-4">
                <h3 class="text-lg font-black uppercase mb-4 tracking-tight">Cüzdan Özeti</h3>
                <div class="bg-[#111] p-6 rounded-2xl border border-white/5 space-y-4">
                    <div class="flex justify-between text-
