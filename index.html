<!DOCTYPE html>
<!-- 
  PROJE: TON Madencilik Uygulaması (Mining App)
  VERSİYON: 2.1.0
  AÇIKLAMA: Bu uygulama, kullanıcıların sanal bir ortamda TON madenciliği yapmasını sağlar.
  GELİŞTİRİCİ NOTLARI: 
  - 9:18 en-boy oranı korunmuştur.
  - Claim işlemi artık uçan sayı animasyonu içerir.
  - Görseller GitHub üzerinden çekilmektedir.
-->
<html lang="tr">
<head>
    <!-- Karakter Seti ve Mobil Uyumluluk Ayarları -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Mining App</title>

    <!-- Tailwind CSS ve Google Fonts Entegrasyonu -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Uygulama Özel CSS Stilleri -->
    <style>
        /* Ana Gövde Ayarları */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0b;
            color: white;
            user-select: none;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* 9:18 En-Boy Oranı Konteynırı */
        .app-container {
            width: 100%;
            max-width: 380px; 
            aspect-ratio: 9 / 18;
            background-color: #000;
            display: flex;
            flex-direction: column;
            position: relative;
            max-height: 98vh;
            overflow: hidden;
            border: 1px solid #1a1a1a;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Fan Dönme Animasyonu */
        @keyframes rotate-fan {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .fan-animation {
            animation: rotate-fan 8s linear infinite;
        }

        .fan-animation.boosted {
            animation-duration: 2s;
        }

        /* Kart Tasarımları */
        .glass-card {
            background-color: #121212;
            border-radius: 20px;
            border: 1px solid #1f1f1f;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Buton Tasarımları */
        .btn-purple {
            background-color: #7c66e3;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
        }
        
        .btn-purple:active {
            transform: scale(0.95);
            background-color: #6b56d2;
        }

        /* Alt Navigasyon Çubuğu */
        .nav-footer {
            background-image: url('navi.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            flex-shrink: 0;
            position: relative;
            background-color: #121212;
            border-top: 1px solid #1f1f1f;
        }

        /* Şeffaf Navigasyon Butonları */
        .nav-item {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            z-index: 10;
        }

        /* Sayıların Görünümü */
        .counter-text {
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.05em;
        }

        /* Bilgi İkonu ve Göstergeler */
        .info-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #9ca3af;
            background-color: rgba(255, 255, 255, 0.05);
            padding: 0.25rem 1rem;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Uçan Sayı Animasyonu */
        @keyframes fly-to-top {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-300px) scale(0.5);
                opacity: 0;
            }
        }

        .flying-number {
            position: absolute;
            color: #7c66e3;
            font-weight: bold;
            pointer-events: none;
            z-index: 100;
            animation: fly-to-top 1s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body>

    <!-- Ana Uygulama Kapsayıcısı -->
    <div class="app-container">
        
        <!-- ÜST BÖLÜM: Kullanıcı Bakiyeleri -->
        <header class="p-4 space-y-3" id="app-header">
            
            <!-- TON Bakiye Kartı -->
            <div class="glass-card p-3 flex items-center justify-between" id="ton-balance-card">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full overflow-hidden border border-[#8b5cf6]/30 flex items-center justify-center bg-[#1a1a1a]">
                        <img 
                            src="ton.jpg" 
                            alt="TON Logo" 
                            class="w-full h-full object-cover" 
                            onerror="this.src='https://cryptologos.cc/logos/toncoin-ton-logo.png'"
                        >
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 font-medium">Balance</p>
                        <p class="font-bold text-sm tracking-wide" id="total-ton-header">0.0000 TON</p>
                    </div>
                </div>
                <div class="bg-[#1e1e1e] p-2 rounded-xl text-gray-300 border border-white/5">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256">
                        <path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Z"></path>
                    </svg>
                </div>
            </div>

            <!-- TONIX Bakiye Kartı -->
            <div class="glass-card p-3 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full overflow-hidden border border-[#8b5cf6]/30 flex items-center justify-center bg-[#1a1a1a]">
                        <img 
                            src="dragon.jpg" 
                            alt="TONIX Logo" 
                            class="w-full h-full object-cover" 
                            onerror="this.src='https://cdn-icons-png.flaticon.com/512/10668/10668045.png'"
                        >
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 font-medium">Balance</p>
                        <p class="font-bold text-sm tracking-wide">0 TONIX</p>
                    </div>
                </div>
                <div class="bg-[#1e1e1e] p-2 rounded-xl text-gray-300 border border-white/5">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256">
                        <path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Z"></path>
                    </svg>
                </div>
            </div>

        </header>

        <!-- ANA BÖLÜM: Madencilik Alanı -->
        <main id="view-home" class="flex-1 flex flex-col items-center justify-around px-6 py-4">
            
            <div class="relative w-64 h-64 overflow-hidden rounded-full border border-white/10 shadow-2xl">
                <div class="absolute inset-0 bg-blue-500/10 blur-[50px] rounded-full"></div>
                <div id="main-fan" class="fan-animation w-full h-full relative z-10">
                    <img 
                        src="fan.jpg" 
                        alt="Mining Fan" 
                        class="w-full h-full object-cover" 
                        onerror="this.src='https://cdn-icons-png.flaticon.com/512/3593/3593672.png'"
                    >
                </div>
            </div>

            <div class="text-center relative">
                <h1 id="mining-counter" class="text-3xl font-bold counter-text mb-2 tracking-tight">
                    0.0000000000 TON
                </h1>
                <div class="info-badge">
                    <span class="text-xs">ℹ️</span>
                    <span class="text-sm font-semibold">
                        <span id="ghs-value">6</span> GH/s
                    </span>
                    <span class="text-orange-500 text-sm">⚡</span>
                </div>
            </div>

            <div class="flex gap-4 w-full px-2">
                <button onclick="claimMining()" class="btn-purple flex-1 py-4 rounded-2xl shadow-lg shadow-indigo-500/10">
                    <svg class="mr-2" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="white" viewBox="0 0 256 256">
                        <path d="M216,72H56a8,8,0,0,1,0-16H192a8,8,0,0,0,0-16H56A24,24,0,0,0,32,64V192a24,24,0,0,0,24,24H216a16,16,0,0,0,16-16V88A16,16,0,0,0,216,72Z"></path>
                    </svg>
                    <span>Claim</span>
                </button>
                <button onclick="boostMining()" class="btn-purple flex-1 py-4 rounded-2xl shadow-lg shadow-indigo-500/10">
                    <svg class="mr-2" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="white" viewBox="0 0 256 256">
                        <path d="M213.66,122.34l-96-96a8,8,0,0,0-11.32,11.32L200.69,128,106.34,222.34a8,8,0,0,0,11.32,11.32l96-96A8,8,0,0,0,213.66,122.34Z"></path>
                    </svg>
                    <span>Boost</span>
                </button>
            </div>

        </main>

        <footer class="nav-footer">
            <button onclick="switchTab('wallet', this)" class="nav-item"></button>
            <button onclick="switchTab('friends', this)" class="nav-item"></button>
            <button onclick="switchTab('home', this)" class="nav-item"></button>
            <button onclick="switchTab('missions', this)" class="nav-item"></button>
            <button onclick="switchTab('more', this)" class="nav-item"></button>
        </footer>

        <div id="toast" class="absolute bottom-28 left-1/2 -translate-x-1/2 bg-[#1a1a1a] border border-white/10 px-6 py-2 rounded-2xl text-xs font-bold opacity-0 transition-all duration-300 shadow-2xl z-50">
            Collected!
        </div>

    </div>

    <script>
        let minedAmount = 0.0000000000;
        let totalBalance = 0.0000;
        let hashrate = 6;
        let isBoosted = false;

        const counterEl = document.getElementById('mining-counter');
        const ghsEl = document.getElementById('ghs-value');
        const fanContainer = document.querySelector('.fan-animation');
        const toastEl = document.getElementById('toast');
        const headerBalanceEl = document.getElementById('total-ton-header');
        const appContainer = document.querySelector('.app-container');

        function updateMining() {
            const increment = (hashrate * 0.000000005) + (Math.random() * 0.000000001);
            minedAmount += increment;
            if (counterEl) {
                counterEl.innerText = minedAmount.toFixed(10) + " TON";
            }
        }

        setInterval(updateMining, 100);

        function claimMining() {
            // En küçük miktarların bile toplanabilmesi için hassas kontrol
            if (minedAmount > 0.0000000001) {
                const amountToCollect = minedAmount;
                
                // Uçan sayı animasyonunu başlat
                createFloatingAnimation(amountToCollect.toFixed(6));
                
                totalBalance += amountToCollect;
                
                if (headerBalanceEl) {
                    headerBalanceEl.innerText = totalBalance.toFixed(4) + " TON";
                    // Bakiye kartında hafif bir parlama efekti
                    const card = document.getElementById('ton-balance-card');
                    card.style.borderColor = "#8b5cf6";
                    setTimeout(() => card.style.borderColor = "#1f1f1f", 500);
                }
                
                minedAmount = 0;
                if (counterEl) {
                    counterEl.innerText = "0.0000000000 TON";
                }
            }
        }

        function createFloatingAnimation(text) {
            const floater = document.createElement('div');
            floater.className = 'flying-number';
            floater.innerText = "+" + text + " TON";
            
            // Sayacın tam üstünde belirmesi için konumlandırma
            const rect = counterEl.getBoundingClientRect();
            const containerRect = appContainer.getBoundingClientRect();
            
            floater.style.left = (rect.left - containerRect.left + (rect.width / 4)) + "px";
            floater.style.top = (rect.top - containerRect.top - 20) + "px";
            
            appContainer.appendChild(floater);
            
            // Animasyon bittiğinde temizle
            setTimeout(() => {
                floater.remove();
            }, 1000);
        }

        function boostMining() {
            if (isBoosted) return;
            
            isBoosted = true;
            hashrate *= 2;
            
            if (ghsEl) ghsEl.innerText = hashrate;
            if (fanContainer) fanContainer.classList.add('boosted');
            
            showToast("Boost Active! 2x Speed 🚀");
            
            setTimeout(() => {
                isBoosted = false;
                hashrate /= 2;
                if (ghsEl) ghsEl.innerText = hashrate;
                if (fanContainer) fanContainer.classList.remove('boosted');
            }, 5000);
        }

        function showToast(message) {
            if (!toastEl) return;
            toastEl.innerText = message;
            toastEl.style.opacity = "1";
            toastEl.style.bottom = "120px";
            setTimeout(() => {
                toastEl.style.opacity = "0";
                toastEl.style.bottom = "100px";
            }, 2000);
        }

        function switchTab(tab, element) {
            console.log("Uygulama sekmesi değiştirildi: " + tab);
        }
        
        window.addEventListener('load', () => {
            console.log("TON Mining App başarıyla yüklendi.");
        });
    </script>
</body>
</html>
