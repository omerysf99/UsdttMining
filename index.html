<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONIX Miner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }

        /* 9:16 Oranı için Kapsayıcı */
        .app-container {
            width: 100%;
            max-width: 450px; /* Yaklaşık 9:16 telefon genişliği */
            height: 100vh;
            background-color: #0f0f0f;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
        }

        @media (min-aspect-ratio: 9/16) {
            .app-container {
                height: 95vh;
                border-radius: 2rem;
                margin: auto;
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }

        .fan-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 2rem auto;
        }

        .fan-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            animation: rotate-fan 4s linear infinite;
            box-shadow: 0 0 60px rgba(56, 189, 248, 0.15);
        }

        @keyframes rotate-fan {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .mining-text {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .btn-primary {
            background: #8b5cf6;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .nav-item {
            color: #4b5563;
            cursor: default;
        }

        .nav-item.active {
            color: #a78bfa;
        }

        .toast {
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Üst Panel (Bakiyeler) -->
        <div id="header" class="space-y-3 mb-6">
            <!-- TON Bakiye -->
            <div class="glass-card p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-sky-500 rounded-full flex items-center justify-center text-white shadow-lg">
                        <i class="fa-solid fa-gem text-xl"></i>
                    </div>
                    <div>
                        <p class="text-[10px] uppercase tracking-widest text-gray-500 font-bold">Balance</p>
                        <p class="font-bold text-xl leading-tight"><span id="ton-balance">0.0000</span> TON</p>
                    </div>
                </div>
                <div class="w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-wallet text-gray-600"></i>
                </div>
            </div>

            <!-- TONIX Bakiye -->
            <div class="glass-card p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-wind text-2xl"></i>
                    </div>
                    <div>
                        <p class="text-[10px] uppercase tracking-widest text-gray-500 font-bold">Balance</p>
                        <p class="font-bold text-xl leading-tight"><span id="tonix-balance">0</span> TONIX</p>
                    </div>
                </div>
                <div class="w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-wallet text-gray-600"></i>
                </div>
            </div>
        </div>

        <!-- ANA SAYFA (Mining) -->
        <div class="flex-grow flex flex-col justify-center text-center">
            <div class="fan-container">
                <img src="fan.jpg" onerror="this.src='https://images.unsplash.com/photo-1591123120675-6f7f1aae0e5b?q=80&w=2069&auto=format&fit=crop'" class="fan-image" alt="Fan">
                <!-- Fan üstündeki ikon kaldırıldı -->
            </div>

            <div class="mt-6">
                <h1 class="text-4xl mining-text mb-1 tracking-tighter" id="mining-counter">0.0000000000</h1>
                <p class="text-2xl font-bold text-white/80 mb-4">TON</p>
                <div class="inline-flex items-center gap-2 bg-white/5 px-5 py-2 rounded-full text-sm border border-white/10">
                    <span class="text-gray-400 font-medium"><strong class="text-white" id="hash-rate">1.0</strong> GH/s</span>
                    <i class="fa-solid fa-bolt text-orange-400"></i>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-10 px-2">
                <button onclick="claimMining()" class="btn-primary p-5 rounded-2xl flex items-center justify-center gap-3 font-bold shadow-xl">
                    <i class="fa-solid fa-coins text-xl"></i> Claim
                </button>
                <!-- Boost devre dışı bırakıldı -->
                <button class="bg-gray-800 text-gray-500 p-5 rounded-2xl flex items-center justify-center gap-3 font-bold cursor-not-allowed">
                    <i class="fa-solid fa-rocket text-xl"></i> Boost
                </button>
            </div>
        </div>

        <!-- ALT NAVİGASYON (Çalışmıyor/Görsel) -->
        <div class="mt-auto glass-card flex justify-around items-center p-2 relative z-50">
            <div class="nav-item flex flex-col items-center gap-1 p-2 w-full">
                <i class="fa-solid fa-wallet text-xl"></i>
                <span class="text-[9px] font-bold uppercase tracking-tighter">Wallet</span>
            </div>
            <div class="nav-item flex flex-col items-center gap-1 p-2 w-full">
                <i class="fa-solid fa-users text-xl"></i>
                <span class="text-[9px] font-bold uppercase tracking-tighter">Friends</span>
            </div>
            <div class="nav-item active flex flex-col items-center gap-1 p-2 w-full">
                <div class="bg-purple-600/20 w-10 h-10 rounded-xl flex items-center justify-center mb-[-4px]">
                     <i class="fa-solid fa-fan text-xl text-purple-400"></i>
                </div>
                <span class="text-[9px] font-bold uppercase tracking-tighter mt-1">Home</span>
            </div>
            <div class="nav-item flex flex-col items-center gap-1 p-2 w-full relative">
                <i class="fa-solid fa-bullseye text-xl"></i>
                <span class="text-[9px] font-bold uppercase tracking-tighter">Missions</span>
            </div>
            <div class="nav-item flex flex-col items-center gap-1 p-2 w-full">
                <i class="fa-solid fa-bars-staggered text-xl"></i>
                <span class="text-[9px] font-bold uppercase tracking-tighter">More</span>
            </div>
        </div>
    </div>

    <script>
        /**
         * MADENCİLİK HESABI:
         * 1 GH/s = Günde 1 TON
         * 1 Gün = 86,400 Saniye
         * Saniyede TON artışı = 1 / 86400
         */
        const DAILY_RATE_PER_GH = 1.0;
        const SECONDS_IN_DAY = 86400;
        const TICK_MS = 100;

        let state = {
            tonBalance: 0.0,
            tonixBalance: 0,
            miningValue: 0.0,
            hashRate: 1.0,
            isMining: true
        };

        const counterEl = document.getElementById('mining-counter');
        const tonBalanceEl = document.getElementById('ton-balance');

        function startMining() {
            setInterval(() => {
                if (state.isMining) {
                    const increment = (DAILY_RATE_PER_GH / SECONDS_IN_DAY / (1000 / TICK_MS)) * state.hashRate;
                    state.miningValue += increment;
                    counterEl.innerText = state.miningValue.toFixed(10);
                }
            }, TICK_MS);
        }

        function claimMining() {
            if (state.miningValue <= 0) return;
            
            state.tonBalance += state.miningValue;
            state.miningValue = 0;
            
            tonBalanceEl.innerText = state.tonBalance.toFixed(4);
            counterEl.innerText = "0.0000000000";
            
            showToast("TON Bakiyeye Aktarıldı!");
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = "toast fixed bottom-28 left-1/2 -translate-x-1/2 bg-white text-black px-8 py-3 rounded-2xl font-bold text-sm shadow-2xl z-[100]";
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = '0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 2000);
        }

        window.onload = startMining;
    </script>
</body>
</html>
