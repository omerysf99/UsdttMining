<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Kütüphanesi | Güvenli Giriş</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .hidden { display: none; }
        .admin-badge {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
        }
        .code-input {
            letter-spacing: 0.5em;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-50">

    <div class="w-full max-w-4xl">
        <!-- Giriş Ekranı -->
        <div id="auth-ui" class="glass-card max-w-md mx-auto p-10 rounded-3xl">
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl shadow-lg mb-6">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>
                <h1 class="text-3xl font-extrabold text-slate-900">PDF Kütüphanesi</h1>
                <p class="text-slate-500 mt-2">Devam etmek için giriş yapın</p>
            </div>

            <div class="space-y-6">
                <div class="space-y-4">
                    <input type="email" id="email" placeholder="E-posta" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="password" id="password" placeholder="Şifre" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                    
                    <div class="flex gap-4">
                        <button onclick="handleEmailAuth('signin')" id="signin-btn" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-all">Giriş Yap</button>
                        <button onclick="handleEmailAuth('signup')" id="signup-btn" class="flex-1 bg-white border border-slate-200 text-slate-700 py-3 rounded-xl font-bold hover:bg-slate-50 transition-all">Kayıt Ol</button>
                    </div>
                </div>

                <div class="relative flex items-center justify-center">
                    <div class="flex-grow border-t border-slate-200"></div>
                    <span class="flex-shrink mx-4 text-xs font-bold text-slate-400 uppercase">veya</span>
                    <div class="flex-grow border-t border-slate-200"></div>
                </div>

                <button onclick="signInWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-200 text-slate-700 py-3 rounded-xl font-semibold hover:border-blue-400 transition-all">
                    <svg class="w-5 h-5" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>
                    Google ile Giriş
                </button>
            </div>
        </div>

        <!-- E-posta Doğrulama Ekranı -->
        <div id="verify-ui" class="hidden glass-card max-w-md mx-auto p-10 rounded-3xl text-center">
            <h2 class="text-2xl font-bold text-slate-800 mb-4">E-postanızı Doğrulayın</h2>
            <p class="text-slate-500 mb-6">Girdiğiniz e-posta adresine 6 haneli bir kod gönderildi. Lütfen kodu aşağıya girin.</p>
            <input type="text" id="verification-code" maxlength="6" class="w-full code-input border-2 border-blue-100 rounded-xl py-4 mb-6 outline-none focus:border-blue-500 transition-all" placeholder="000000">
            <button onclick="verifyCode()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-all">Kodu Doğrula</button>
            <button onclick="signOutUser()" class="mt-4 text-sm text-slate-400 hover:text-slate-600 font-medium">Geri Dön / Çıkış</button>
        </div>

        <!-- Ana Uygulama Ekranı (PDF Listesi) -->
        <div id="main-ui" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">PDF Arşivi</h2>
                    <p id="user-info" class="text-sm text-slate-500"></p>
                </div>
                <button onclick="signOutUser()" class="px-6 py-2 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-red-50 hover:text-red-600 transition-all">Çıkış Yap</button>
            </div>

            <!-- Admin Paneli -->
            <div id="admin-panel" class="hidden bg-slate-900 p-8 rounded-3xl text-white shadow-xl">
                <div class="flex items-center gap-3 mb-6">
                    <span class="admin-badge px-3 py-1 rounded-full text-xs font-bold uppercase">Yönetici</span>
                    <h3 class="text-xl font-bold">Yeni PDF Ekle</h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="pdf-name" placeholder="PDF Adı" class="bg-slate-800 border-none rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="text" id="pdf-link" placeholder="Dropbox Linki" class="bg-slate-800 border-none rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button onclick="addNewPdf()" class="mt-4 w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold transition-all">Kütüphaneye Ekle</button>
            </div>

            <div id="pdf-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- Mesaj Kutusu -->
        <div id="message-box" class="mt-4 p-4 rounded-2xl text-sm hidden transition-all duration-300 border fixed bottom-4 right-4 max-w-sm z-50"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, GoogleAuthProvider, signInWithPopup, 
            createUserWithEmailAndPassword, signInWithEmailAndPassword,
            onAuthStateChanged, signOut
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, collection, addDoc, onSnapshot, query, orderBy, setDoc, doc, getDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoJmNT86J_GoBUG-X2TrGOHPtK258kaBM",
            authDomain: "aaa123-468db.firebaseapp.com",
            projectId: "aaa123-468db",
            storageBucket: "aaa123-468db.firebasestorage.app",
            messagingSenderId: "277639579187",
            appId: "1:277639579187:web:f51052399a8d44f2308546"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAIL = "algiritmi@gmail.com";
        const apiKey = ""; // Gemini API Key environment tarafından sağlanacak

        function showMessage(msg, type = 'error') {
            const box = document.getElementById('message-box');
            box.innerText = msg;
            box.className = `mt-4 p-4 rounded-2xl text-sm transition-all duration-300 border fixed bottom-4 right-4 max-w-sm z-50 ${type === 'error' ? 'bg-red-50 text-red-800 border-red-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200'}`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 5000);
        }

        // Rastgele 6 haneli kod üret
        const generateCode = () => Math.floor(100000 + Math.random() * 900000).toString();

        // E-posta gönderim simülasyonu (Gemini ile kod yollama)
        async function sendVerificationEmail(email, code) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Lütfen şu e-posta adresine bir doğrulama kodu gönderildiğini simüle et ve kullanıcıya bu kodun ne olduğunu (sadece 6 haneli rakam) bildir: ${email}. Kod: ${code}. Mesaj içeriği: PDF Kütüphanesi giriş kodunuz: ${code}` }] }]
                    })
                });
                console.log("Doğrulama maili tetiklendi.");
            } catch (e) {
                console.error("Mail gönderme hatası:", e);
            }
        }

        window.handleEmailAuth = async (type) => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            if (!email || !pass) return showMessage("Bilgileri girin.");

            try {
                if (type === 'signup') {
                    const result = await createUserWithEmailAndPassword(auth, email, pass);
                    const code = generateCode();
                    // Kodu Firestore'a geçici olarak kaydet
                    await setDoc(doc(db, "pending_verifications", result.user.uid), {
                        code: code,
                        email: email,
                        verified: false
                    });
                    await sendVerificationEmail(email, code);
                    showMessage("Doğrulama kodu gönderildi!", "success");
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch (e) { showMessage(e.message); }
        };

        window.verifyCode = async () => {
            const user = auth.currentUser;
            const inputCode = document.getElementById('verification-code').value;
            if (!user) return;

            const docRef = doc(db, "pending_verifications", user.uid);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists() && docSnap.data().code === inputCode) {
                await setDoc(docRef, { verified: true }, { merge: true });
                showMessage("E-posta başarıyla doğrulandı!", "success");
                location.reload();
            } else {
                showMessage("Geçersiz doğrulama kodu!");
            }
        };

        // PDF İşlemleri ve UI Yönetimi aynı kalacak, sadece doğrulama check'i eklenecek
        onAuthStateChanged(auth, async (user) => {
            const authUi = document.getElementById('auth-ui');
            const verifyUi = document.getElementById('verify-ui');
            const mainUi = document.getElementById('main-ui');
            const adminPanel = document.getElementById('admin-panel');

            if (user) {
                authUi.classList.add('hidden');
                
                // Admin değilse doğrulama kontrolü yap
                if (user.email !== ADMIN_EMAIL) {
                    const docSnap = await getDoc(doc(db, "pending_verifications", user.uid));
                    const isVerified = docSnap.exists() && docSnap.data().verified;

                    if (!isVerified) {
                        verifyUi.classList.remove('hidden');
                        mainUi.classList.add('hidden');
                        return;
                    }
                }

                // Doğrulanmış veya Admin kullanıcı
                verifyUi.classList.add('hidden');
                mainUi.classList.remove('hidden');
                document.getElementById('user-info').innerText = user.email;
                if (user.email === ADMIN_EMAIL) adminPanel.classList.remove('hidden');
                loadPdfList();
            } else {
                authUi.classList.remove('hidden');
                verifyUi.classList.add('hidden');
                mainUi.classList.add('hidden');
            }
        });

        // PDF Listeleme Fonksiyonu
        function loadPdfList() {
            const pdfListDiv = document.getElementById('pdf-list');
            const q = query(collection(db, "pdfs"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                pdfListDiv.innerHTML = snapshot.empty ? `<div class="col-span-full text-center py-20 text-slate-400">Henüz PDF eklenmemiş.</div>` : "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    pdfListDiv.innerHTML += `
                        <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm hover:shadow-md transition-all group">
                            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center mb-4 group-hover:bg-blue-600 group-hover:text-white transition-all">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
                            </div>
                            <h4 class="font-bold text-slate-800 mb-4 line-clamp-2">${data.name}</h4>
                            <a href="${data.link}" target="_blank" class="block w-full text-center py-2 bg-slate-900 text-white rounded-xl text-sm font-semibold hover:bg-slate-800 transition-all">Dosyayı Oku</a>
                        </div>`;
                });
            });
        }

        window.addNewPdf = async () => {
            const name = document.getElementById('pdf-name').value;
            const link = document.getElementById('pdf-link').value;
            if (!name || !link) return showMessage("Eksik bilgi!");
            await addDoc(collection(db, "pdfs"), { name, link, createdAt: Date.now() });
            showMessage("PDF eklendi!", "success");
        };

        window.signOutUser = () => signOut(auth);
        window.signInWithGoogle = () => signInWithPopup(auth, new GoogleAuthProvider());
    </script>
</body>
</html>
