<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TeleTap Pro - Miner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            overflow: hidden;
            touch-action: manipulation;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .coin-btn {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(145deg, #3b82f6, #1d4ed8);
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.05s;
            user-select: none;
        }
        .coin-btn:active {
            transform: scale(0.95);
        }
        .floating-text {
            position: absolute;
            color: #60a5fa;
            font-weight: 800;
            font-size: 1.5rem;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100px); }
        }
        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-white">

    <div class="max-w-md w-full flex flex-col items-center gap-8">
        <!-- Üst Panel -->
        <div class="glass w-full p-4 rounded-2xl flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center font-bold text-white">T</div>
                <div>
                    <p class="text-gray-400 text-[10px] font-bold uppercase tracking-widest">Kullanıcı Bilgisi</p>
                    <p id="tg-id-display" class="text-white text-sm font-semibold">ID: Bağlanıyor...</p>
                </div>
            </div>
            <div id="connection-dot" class="w-3 h-3 rounded-full bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.5)]"></div>
        </div>

        <!-- Ana Skor -->
        <div class="text-center">
            <h1 id="counter-display" class="text-6xl font-extrabold text-white mb-2 tracking-tight">0</h1>
            <p class="text-blue-400 font-medium text-sm tracking-widest uppercase">Toplam Puan</p>
        </div>

        <!-- Tıklama Alanı -->
        <div id="tap-area" class="coin-btn">
            <svg class="text-white w-24 h-24 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
        </div>

        <!-- İlerleme Paneli -->
        <div class="glass w-full p-6 rounded-3xl">
            <div class="flex justify-between text-xs font-bold text-gray-400 mb-2">
                <span>SEVİYE 1</span>
                <span id="level-text">0 / 1000</span>
            </div>
            <div class="progress-bar mb-4">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <div class="flex justify-center gap-4">
                <button id="reset-trigger" class="text-gray-500 hover:text-red-400 text-[10px] uppercase font-bold transition-colors underline">Verileri Temizle</button>
            </div>
        </div>

        <div id="status-indicator" class="text-gray-500 text-[10px] uppercase font-bold tracking-widest text-center px-4">
            Bağlantı Kuruluyor...
        </div>
    </div>

    <!-- Onay Modalı -->
    <div id="reset-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-6 z-[200]">
        <div class="glass bg-slate-900 p-8 rounded-3xl w-full max-w-xs text-center border-red-500/20">
            <h3 class="text-white text-xl font-bold mb-2">Sıfırlansın mı?</h3>
            <p class="text-gray-400 text-sm mb-6">Tüm kazancınız silinecektir.</p>
            <div class="flex flex-col gap-2">
                <button id="confirm-reset" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl">EVET, SIFIRLA</button>
                <button id="cancel-reset" class="text-gray-400 font-bold py-2">VAZGEÇ</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Değişkenleri Al
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "AIzaSyDi7IqV474UDMtrKyKuO-2pct5WxwSB3jQ",
                authDomain: "studio-9241589115-a403e.firebaseapp.com",
                projectId: "studio-9241589115-a403e",
                storageBucket: "studio-9241589115-a403e.firebasestorage.app",
                messagingSenderId: "1010284036381",
                appId: "1:1010284036381:web:cd6effcc67287c510e61f4"
            };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-teletap-v2';

        // Firebase Başlat
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let count = 0;
        let currentUser = null;
        let syncActive = false;

        const display = document.getElementById('counter-display');
        const tgDisplay = document.getElementById('tg-id-display');
        const tapArea = document.getElementById('tap-area');
        const progressFill = document.getElementById('progress-fill');
        const status = document.getElementById('status-indicator');
        const connDot = document.getElementById('connection-dot');

        // Cloud Güncelleme (RULE 1: /artifacts/{appId}/users/{userId}/{collectionName})
        async function updateCloud(val) {
            if (!currentUser) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'counter');
                await setDoc(docRef, { value: val, lastActive: serverTimestamp() }, { merge: true });
            } catch (e) {
                console.error("Yazma hatası:", e);
            }
        }

        // Senkronizasyon Başlat
        function startSync(user) {
            if (syncActive) return;
            currentUser = user;
            syncActive = true;
            
            status.textContent = "Bağlantı Başarılı";
            connDot.classList.replace('bg-red-500', 'bg-green-500');

            // Sayaç Verisi (RULE 1)
            const counterRef = doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'counter');
            onSnapshot(counterRef, (snap) => {
                if (snap.exists()) {
                    count = snap.data().value || 0;
                    display.textContent = count.toLocaleString();
                    
                    const progress = (count % 1000) / 1000 * 100;
                    progressFill.style.width = `${progress}%`;
                    document.getElementById('level-text').textContent = `${(count % 1000)} / 1000`;
                } else {
                    updateCloud(0);
                }
            }, (err) => {
                status.textContent = "Veri Erişim Hatası";
                console.error(err);
            });

            // Profil Verisi (RULE 1)
            const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'info');
            onSnapshot(profileRef, (snap) => {
                if (snap.exists() && snap.data().telegramId) {
                    tgDisplay.textContent = `ID: ${snap.data().telegramId}`;
                } else {
                    tgDisplay.textContent = "ID: Tanımlanmadı";
                }
            });
        }

        // Giriş Akışı (RULE 3 - Robust Fallback)
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (tokenErr) {
                        console.warn("Custom token failed, falling back to anonymous:", tokenErr);
                        await signInAnonymously(auth);
                    }
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Auth Hatası:", e);
                status.textContent = "Giriş Hatası: " + e.code;
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                startSync(user);
            } else {
                status.textContent = "Oturum bekleniyor...";
            }
        });

        // Efektler
        function createParticle(x, y) {
            const p = document.createElement('div');
            p.className = 'floating-text';
            p.textContent = '+1';
            p.style.left = `${x}px`;
            p.style.top = `${y}px`;
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 800);
        }

        // Tıklama
        tapArea.addEventListener('pointerdown', (e) => {
            if (!currentUser) return;
            count++;
            display.textContent = count.toLocaleString();
            updateCloud(count);
            createParticle(e.clientX, e.clientY);
        });

        const modal = document.getElementById('reset-modal');
        document.getElementById('reset-trigger').onclick = () => modal.style.display = 'flex';
        document.getElementById('cancel-reset').onclick = () => modal.style.display = 'none';
        document.getElementById('confirm-reset').onclick = () => {
            updateCloud(0);
            modal.style.display = 'none';
        };

        initAuth();
    </script>
</body>
</html>
